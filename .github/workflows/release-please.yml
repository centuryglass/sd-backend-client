name: release-please

# Keeps a release pull request open against main, collecting the Conventional Commits titles of merged pull requests
# into CHANGELOG.md and bumping pyproject.toml's version (release-please-config.json). Merging it tags the release and
# publishes a GitHub release with that changelog section as its notes. The build job then builds the sdist and wheel
# from the tag and attaches them to that release, and the publish-pypi job uploads them to PyPI. While the version is
# below 1.0.0, a breaking change bumps the minor version (bump-minor-pre-major).
#
# Running this workflow by hand (workflow_dispatch) with a tag skips release-please and builds, attaches and publishes
# that existing release, for a release whose upload failed or predates the publish jobs.
#
# Pull requests opened with GITHUB_TOKEN don't trigger workflows, so CI has to be started by hand on the release pull
# request: run the ci workflow from the Actions tab on its branch. The repository setting "Allow GitHub Actions to
# create and approve pull requests" must be on for this workflow to open it.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, attach and publish (e.g. v0.2.0)
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          target-branch: main

  build:
    name: build
    needs: release-please
    # always() lets a workflow_dispatch run proceed past the skipped release-please job.
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      # The tag can predate scripts/check_dist.py, so the copy from this workflow's own commit is used.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: workflow-ref
          sparse-checkout: scripts/check_dist.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      # Builds and checks the same way as ci.yml's package job, so a release ships what CI verified.
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          twine check --strict dist/*
          cp workflow-ref/scripts/check_dist.py scripts/check_dist.py
          python scripts/check_dist.py dist

      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # --clobber lets a re-run replace assets from a failed earlier attempt.
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  # Uses PyPI trusted publishing: pypi.org trusts this repository and workflow file by name, with no environment, so
  # renaming this file or adding a GitHub environment here breaks uploads until the PyPI publisher settings match.
  publish-pypi:
    name: publish-pypi
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
