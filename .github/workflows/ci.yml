name: ci

# Runs the test suite, the lint check, the type check, the packaging check and the docs build on every pull request into main and every
# push to it, so a change's state is known before it merges and main's state is known after. workflow_dispatch also
# allows running it by hand from the Actions tab, which release-please's pull requests need (see release-please.yml).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes the run in flight for the same branch or pull request.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is pyproject.toml's requires-python minimum; the newer ones guard against breakage as users upgrade.
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        # Installing the package also checks that pyproject.toml builds on this Python version.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -e .

      - name: Run tests
        # No backend runs here, so the integration tests skip themselves and only tests/unit/ executes.
        # The --cov-fail-under floor is a ratchet (AGENTS.md, "Testing").
        run: python -m pytest tests/ --cov=sd_backend_client --cov-branch --cov-report=term-missing --cov-fail-under=94

      - name: Publish coverage summary
        if: ${{ !cancelled() && matrix.python-version == '3.13' && hashFiles('.coverage') != '' }}
        run: |
          echo '## Unit-test coverage' >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown --skip-covered --sort=cover >> "$GITHUB_STEP_SUMMARY"

  test-minimum-deps:
    name: test (minimum dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install the oldest allowed runtime dependencies
        # --resolution lowest-direct installs each runtime dependency at its pyproject.toml floor; transitive
        # dependencies resolve normally. --only-binary keeps a floor honest about having a wheel for Python 3.11.
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip install --system --resolution lowest-direct --only-binary :all: -e . "$(grep '^pytest==' requirements-dev.txt)"
          uv pip list --system

      - name: Run tests
        run: python -m pytest tests/

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # scripts/pylint_baseline.json was generated with this version; pylint's inference can vary between them.
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: pylint (no new messages)
        run: python scripts/pylint_check.py

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: mypy
        # Targets and options come from pyproject.toml's [tool.mypy].
        run: python -m mypy

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install build tools
        # Only this job needs them, so they stay out of requirements-dev.txt.
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check metadata and README rendering
        run: twine check --strict dist/*

      - name: Check distribution contents
        run: python scripts/check_dist.py dist

      - name: Run unit tests against the installed wheel
        # The tests run from a copy outside the checkout, so the package can only be imported from the wheel installed
        # in the clean venv. Inside the checkout, pytest puts the repository root on sys.path, which would shadow it.
        # README.md, docs/ and examples/ are copied too, since tests/unit/test_readme_examples.py runs them.
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl "$(grep '^pytest==' requirements-dev.txt)"
          mkdir "$RUNNER_TEMP/installed"
          cp -r tests examples docs README.md "$RUNNER_TEMP/installed/"
          cd "$RUNNER_TEMP/installed"
          "$RUNNER_TEMP/venv/bin/python" -c 'import sd_backend_client, sys; print(sd_backend_client.__file__); sys.exit("site-packages" not in sd_backend_client.__file__)'
          "$RUNNER_TEMP/venv/bin/python" -m pytest tests/unit

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install documentation tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Build the documentation site
        # --strict fails on any warning, such as a broken link or a docstring mkdocstrings can't parse. mkdocs.yml's
        # hook also fails it when docs/reference/ doesn't document the package root's __all__.
        run: mkdocs build --strict

  # A single check to require for merging, so branch protection doesn't need updating whenever the matrix or the
  # set of jobs changes.
  ci:
    name: ci
    if: always()
    needs: [test, test-minimum-deps, lint, typecheck, package, docs]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        if: needs.test.result != 'success' || needs.test-minimum-deps.result != 'success' ||
          needs.lint.result != 'success' || needs.typecheck.result != 'success' || needs.package.result != 'success' ||
          needs.docs.result != 'success'
        run: |
          echo "test result: ${{ needs.test.result }}"
          echo "test-minimum-deps result: ${{ needs.test-minimum-deps.result }}"
          echo "lint result: ${{ needs.lint.result }}"
          echo "typecheck result: ${{ needs.typecheck.result }}"
          echo "package result: ${{ needs.package.result }}"
          echo "docs result: ${{ needs.docs.result }}"
          exit 1
