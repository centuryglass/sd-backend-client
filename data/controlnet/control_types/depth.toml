title = "Restyle a scene and keep its composition"
description = """\
Estimate depth from a photo or render, then prompt for a new style, setting or subject. Near and far objects \
keep their places while colors, materials and detail change."""

[[uses]]
kind = "creative"
title = "Turn a 3D blockout into a finished image"
description = """\
Render a depth pass from a simple 3D scene and use it as the control image with no preprocessor. The ControlNet \
1.1 card says its depth model works on real depth maps from rendering engines."""

[choosing]
guide = """\
Pick the estimator a model was trained on. MiDaS pairs with the most depth models here, and it is the safe \
default. ZoeDepth pairs with the Zoe models: the Zoe T2I-Adapters, Diffusers SDXL Zoe Depth and SargeZT's depth \
model. The Depth Anything ControlNet was trained on Depth Anything maps, and the V2 paper reports finer detail \
than V1. LeReS++ merges estimates at several scales for more detail and runs slower than LeReS. Marigold runs a \
diffusion model for 20 steps, so it is slow. Depth Hand Refiner only serves the HandRefiner model, for fixing \
hands.\n\n\
On SD 1.5, ControlNet 1.1 Depth accepts MiDaS, LeReS and Zoe maps and depth rendered by 3D software. On SDXL, \
xinsir's depth model handles both Zoe and MiDaS maps, per its card, and the Stability Control-LoRA was fine-tuned \
for portrait depth. The SDXL T2I-Adapters each expect the estimator in their name. SargeZT's Faid Vidit and Zeed \
models expect an undocumented conditioning and come last."""
