id = "depth"
label = "Depth"
summary = "Keeps the layout of a scene in depth, what is near and what is far, drawn as a grayscale map."
description = """\
Depth keeps the three-dimensional layout of a reference image. The control image is a grayscale map in which \
brighter pixels are nearer the camera and darker pixels are farther away. The generated image follows that \
spacing, with the same foreground, middle ground and background and the same rounded or flat forms, while color, \
texture, lighting and style come from the prompt.\n\n\
Depth ignores outlines and surface detail, so it leaves the model more freedom than an edge type. It suits \
restyling a scene or changing its subject while keeping the composition. Models trained on one estimator name \
it: the SDXL T2I-Adapters come in separate MiDaS and Zoe versions, while ControlNet 1.1 depth accepts several \
estimators."""
how_it_works = """\
A depth estimator is a neural network that looks at one photo and guesses how far each pixel is from the camera. \
Depth models are trained on pairs of images and these estimated depth maps, with a caption for each. During \
generation the model reads the map alongside the noisy image at every step and nudges the result so its \
distances match. Because training used maps from estimators, the better models also accept real depth: the \
ControlNet 1.1 card says its depth model works on depth maps from rendering engines."""
base_models = ["sd15", "sdxl"]
control_image = "Grayscale depth map, white near and black far."

