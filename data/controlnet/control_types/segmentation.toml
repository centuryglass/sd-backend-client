id = "segmentation"
label = "Segmentation"
summary = "Keeps the layout of a scene as flat color regions, one color per kind of thing: sky, wall, tree, person, road."
description = """\
Segmentation keeps where each kind of thing sits in a scene. The control image divides the picture into flat \
regions, and each region's color names a class: one color for sky, another for building, another for person. \
The generated image puts those things in those places, while their look, lighting and style come from the \
prompt.\n\n\
Colors are fixed per class, so a map has to use the palette its model was trained on. The SD 1.5 ControlNets \
read the 150-class ADE20K palette, and ControlNet 1.1 also reads COCO colors. Because each region is a class \
rather than an outline, a map can be painted by hand in flat colors."""
how_it_works = """\
A semantic segmentation network labels every pixel of a photo with one class from a fixed list, such as the \
150 classes of the ADE20K scene dataset. The preprocessor paints each class in its palette color. A \
segmentation model is trained on pairs of images and their class maps, with a caption for each, and learns \
which color means which kind of thing. During generation it reads the map at every denoising step and steers \
each region toward its class. ControlNet 1.1's README notes that telling the ADE20K and COCO palettes apart \
is easy for the model."""
base_models = ["sd15", "sdxl"]
control_image = "Flat color regions, one fixed palette color per class: the ADE20K palette, or COCO's for models trained on it."

sources = [
    "recorded_fixtures",
    "sdwebui_cn_supported_preprocessor",
