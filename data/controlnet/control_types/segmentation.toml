[[uses]]
kind = "standard"
title = "Restyle a scene and keep its layout"
description = """\
Run a segmentation preprocessor on a photo, then prompt for a different time, season or style. Sky, buildings, \
road and people stay where they were, while their surfaces and details are redrawn."""

[[uses]]
kind = "standard"
title = "Swap what fills a region"
description = """\
Since only classes are kept, not edges, the model is free to redraw everything inside a region. A street of \
houses can become a street of different houses, with the same arrangement of road, sky and trees."""

[[uses]]
kind = "creative"
title = "Paint a layout by hand"
description = """\
The ControlNet 1.0 README notes that the model deserves a UI for drawing segmentations directly, and the 1.1 \
README accepts manually created masks. Paint flat regions in the palette's class colors and use the result \
as the control image with no preprocessor."""

[choosing]
guide = """\
Segmentation models read a fixed palette, one color per class, so the preprocessor has to draw the palette the \
model learned. OneFormer ADE20K and UniFormer ADE20K draw the ADE20K palette, which both ControlNet segmentation \
models read. OneFormer COCO draws COCO colors, which ControlNet 1.1 Segmentation added. MobileSAM fills each \
region with a random color, for the xinsir union models. Anime Face Segmentation pairs with no model here.\n\n\
On SD 1.5, use ControlNet 1.1 Segmentation. The T2I-Adapter Segmentation model reads a palette no backend \
preprocessor draws. On SDXL, the xinsir union models cover segmentation."""
preprocessors = ["seg_ofade20k", "seg_ufade20k", "seg_ofcoco", "mobile_sam", "seg_anime_face"]
