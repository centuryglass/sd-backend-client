[[uses]]
kind = "standard"
title = "Make variations of an image"
description = """\
Leave the prompt empty or generic and set the weight to 1. tencent-ailab's best practice for image-only prompting \
uses scale 1.0 with an empty prompt or one like "best quality". Lowering the weight gives more varied results \
that follow the reference less closely."""

[[uses]]
kind = "standard"
title = "Combine an image prompt with a text prompt"
description = """\
Describe the new scene in the prompt and lower the weight. tencent-ailab suggests a scale around 0.5 for \
multimodal prompts. Pair it with a Depth, Canny or OpenPose unit to fix the layout while IP-Adapter carries the \
look."""

[[uses]]
kind = "standard"
title = "Keep a person's face across new images"
description = """\
Use a FaceID, FaceID Plus or PuLID model with a clear photo of the face, and prompt for the new style or setting. \
FaceID models other than Portrait come with a LoRA that is loaded separately."""

[[uses]]
kind = "creative"
title = "Borrow only style or only composition"
description = """\
sd-webui-controlnet's advanced weighting presets, taken from ComfyUI_IPAdapter_plus and the InstantStyle method, \
apply the image to some U-Net blocks only. Its style transfer presets carry the look without the content. The \
ostris composition adapters carry the layout and pose, such as a raised hand, while ignoring style and content."""

[choosing]
guide = """\
Pick the model first, then the preprocessor for its image encoder. Most models read the image with CLIP ViT-H. \
IP-Adapter SDXL and SD1.5 ViT-G read it with CLIP ViT-bigG, the FaceID and FaceID Portrait models with \
InsightFace, and the FaceID Plus models with InsightFace and CLIP ViT-H. In sd-webui-controlnet, IP-Adapter Auto \
picks the preprocessor from the model's file name, so it fails on renamed files. The CLIP encoders crop the \
center, so center the subject or crop the reference square.\n\n\
For a subject or style, the standard models carry the overall look, the Plus models stay closer to the reference, \
and the Light models leave the prompt more say. For a face, Plus Face and Full Face need only a cropped face \
photo. The FaceID models keep identity across styles but need InsightFace, are released for non-commercial use, \
and most need their LoRA. PuLID changes the rest of the image the least, per its paper, and needs an EVA-CLIP \
extension in sd-webui-controlnet. The IP Composition Adapters copy layout and pose, not content, and need a CFG \
near 3. Superseded versions come last. PuLID V1.1 loads in no WebUI extension, and FaceID Portrait SDXL Unnorm is \
not in sd-webui-controlnet's presets."""
