id = "ip_adapter"
label = "IP-Adapter"
summary = "Uses a reference image as part of the prompt, carrying its subject, style or a face into the result without copying its layout."
description = """\
IP-Adapter treats a reference image as a prompt. The result takes on what the image shows and how it looks, its \
subject, palette and style, but not its exact layout, and the text prompt still works alongside it. Tencent AI \
Lab's adapters work with any checkpoint fine-tuned from the same base model and combine with other ControlNets.\n\n\
The models come in families. Standard and Plus models read a CLIP embedding of the whole image, with Plus closer \
to the reference. Face models read a cropped face. FaceID and PuLID models read a face recognition embedding and \
keep a person's identity across new styles and scenes. The composition models carry only the general layout and \
pose. Each model pairs with one preprocessor, and sd-webui-controlnet's ip-adapter-auto picks it from the model \
name."""
how_it_works = """\
An image encoder turns the reference into features: CLIP for the standard models, InsightFace face recognition \
for FaceID. A small trained projection maps those features to a few extra tokens shaped like prompt tokens. The \
U-Net's cross-attention layers, which normally attend only to the text, gain a second set of attention weights \
that attend to the image tokens, and the two results are added. Only that projection and the new attention \
weights are trained, about 22 million parameters, so the base model is unchanged."""
base_models = ["sd15", "sdxl"]
control_image = "A reference image, unprocessed: a whole picture for the CLIP models, a photo with a clear face for the face models."

