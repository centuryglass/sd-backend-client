    "hf_tencentarc_t2i_adapter_v2_commit",
    "hf_blog_t2i_sdxl_adapters",
]
research_status = "verified"
open_questions = []

[names]
webui = ["T2I-Adapter"]
forge = ["T2I-Adapter"]
comfyui = []

[[uses]]
kind = "standard"
title = "Set a picture's color scheme"
description = "Make a color grid from an image, or paint one, and use the color adapter to place those colors in a new image."

[[uses]]
kind = "creative"
title = "Carry a reference's style"
description = "Use the style adapter with T2I Style CLIP Vision and a style image, and prompt for the subject."

[choosing]
guide = """\
Each adapter here has one preprocessor. Color Grid reduces an image to a coarse grid of colors for the Color \
adapter, which also accepts hand-painted palettes. T2I Style CLIP Vision encodes an image for the Style adapter, a \
preliminary model that carries overall style and mood but not layout. T2I Sketch PiDiNet makes hard white edges \
for the Sketch adapters. All are SD 1.x models; the SDXL T2I-Adapters sit under their own control types."""
preprocessors = ["color", "t2ia_style_clipvision", "t2ia_sketch_pidi"]
models = [
    "t2iadapter_color_sd14v1",
    "t2iadapter_style_sd14v1",
    "t2iadapter_sketch_sd15v2",
    "t2iadapter_sketch_sd14v1",
]
