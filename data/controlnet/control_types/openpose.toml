[[uses]]
kind = "standard"
title = "Copy a pose from a photo"
description = """\
Run a pose preprocessor on a photo of someone in the pose you want, then prompt for a different person, outfit \
or setting. The figure takes the same stance without copying the photo's look."""

[[uses]]
kind = "standard"
title = "Pose a group"
description = """\
The estimators find several people at once and draw a skeleton for each, so one reference can place a whole \
group. ControlNet 1.1's README shows a batch of multiple people in the wild."""

[[uses]]
kind = "creative"
title = "Draw or edit the skeleton by hand"
description = """\
The ControlNet 1.0 README notes that the model deserves a UI for posing the skeleton directly. Pose editors do \
this: drag the joints of a stick figure, or edit one a preprocessor made, and use the result as the control \
image with no preprocessor."""

