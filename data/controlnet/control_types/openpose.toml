[[uses]]
kind = "standard"
title = "Copy a pose from a photo"
description = """\
Run a pose preprocessor on a photo of someone in the pose you want, then prompt for a different person, outfit \
or setting. The figure takes the same stance without copying the photo's look."""

[[uses]]
kind = "standard"
title = "Pose a group"
description = """\
The estimators find several people at once and draw a skeleton for each, so one reference can place a whole \
group. ControlNet 1.1's README shows a batch of multiple people in the wild."""

[[uses]]
kind = "creative"
title = "Draw or edit the skeleton by hand"
description = """\
The ControlNet 1.0 README notes that the model deserves a UI for posing the skeleton directly. Pose editors do \
this: drag the joints of a stick figure, or edit one a preprocessor made, and use the result as the control \
image with no preprocessor."""

[choosing]
guide = """\
DWPose draws the same stick figure as OpenPose and is more accurate, especially on hands. Choose how much of the \
figure to keep: the body alone leaves hands and face free, Full adds both, and the Hand, Face and Face Only \
variants pick parts. ControlNet 1.1 OpenPose reads any combination; ControlNet 1.0 reads bodies only. Animal Pose \
is for four-legged animals and pairs only with the Animal Pose ControlNet. MediaPipe Face carries expression and \
gaze to its own model. The DensePose maps serve MagicAnimate and a CivitAI DensePose ControlNet, neither in this \
reference.\n\n\
On SDXL, xinsir's OpenPose reports the highest pose accuracy in its card's test and expects thick skeleton lines; \
the default lines may give unstable results. Its Twins variant follows the pose more closely with lower aesthetic \
scores. The T2I-Adapter Keypose model reads MMPose skeletons, which no backend preprocessor makes. The LLLite pose \
models are small, experimental and trained on an anime checkpoint."""
