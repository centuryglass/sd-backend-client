id = "openpose"
label = "OpenPose"
summary = "Copies the pose of people in an image, drawn as a colored stick figure, and leaves everything else to the prompt."
description = """\
OpenPose keeps the pose of each person in a reference image: where the head, shoulders, elbows, hips, knees and \
feet are. The control image is a stick figure on black, one color per limb, with optional dots for the hands and \
face. The generated image puts a figure in that pose, while clothing, body shape, setting and style come from the \
prompt.\n\n\
Because only joints are kept, OpenPose leaves the model more freedom than an edge or depth type. It suits \
reposing a character or copying a pose from a photo. Backends file several related preprocessors under it: \
DWPose, which draws the same skeleton, animal pose, DensePose and MediaPipe face landmarks. Each needs a model \
trained on its own kind of map."""
how_it_works = """\
A pose estimator is a neural network that finds body joints in a photo and links them into skeletons, one per \
person. The preprocessor draws those skeletons in fixed colors. Pose models are trained on pairs of images and \
the skeletons an estimator found in them, with a caption for each. During generation the model reads the \
skeleton alongside the noisy image at every step and nudges the result so a body forms along each limb. Since \
the skeleton is just a drawing, it can also be posed by hand in an editor."""
base_models = ["sd15", "sdxl"]
control_image = "Stick figures on black, one color per limb, in OpenPose's 18-point body layout, with optional hand and face points."

