[[uses]]
kind = "standard"
title = "Redecorate a room"
description = """\
Extract the straight lines of a room photo and prompt for a new interior style. Walls, windows and furniture \
outlines keep their positions."""

[choosing]
guide = """\
Use the M-LSD preprocessor on architecture, interiors and other scenes built from straight edges. On people, \
animals and landscapes it finds few straight lines and gives a nearly empty map, so another type suits those. \
Invert turns hand-drawn black-on-white straight lines into the white-on-black lines the models read. On SD 1.5, \
ControlNet 1.1 MLSD was trained on extra images rich in straight lines and fixes 1.0's training-set flaws. On \
SDXL, the xinsir union models cover MLSD; no dedicated SDXL MLSD model is in this reference."""
preprocessors = ["mlsd", "invert"]
models = ["control_v11p_sd15_mlsd", "control_sd15_mlsd", "xinsir_union_promax_sdxl", "xinsir_union_sdxl"]
