[[uses]]
kind = "standard"
title = "Restyle a photo without moving anything"
description = """\
Run the photo through Canny and prompt for a new style or material. Outlines stay where they were; colors and \
surfaces change."""

[[uses]]
kind = "creative"
title = "Color a clean line drawing"
description = """\
Invert a black-on-white drawing so its lines become the white edges a Canny model reads, then describe the \
finished picture in the prompt."""

[choosing]
guide = """\
Start with the Canny preprocessor: every Canny model here was trained on its maps. Lower its thresholds to keep \
more edges, or raise them to drop texture and noise. PyraCanny blends edges found at several scales into graded \
lines, and Stability's Canny Control-LoRA is the model it pairs with. A clean black-on-white drawing needs only \
Invert.\n\n\
On SD 1.5, use ControlNet 1.1 Canny, which fixes the training-set flaws of 1.0. The T2I-Adapters are smaller and \
faster. On SDXL, xinsir's Canny reports higher aesthetic and control scores than Diffusers SDXL Canny and \
MistoLine on its card, and the union models cover Canny beside their other types. Where memory is short, the \
Control-LoRA, the T2I-Adapter, the mid and small Diffusers checkpoints and the LLLite models are smaller; the mid \
and small cards say complex images may need a bigger checkpoint. The first SDXL T2I-Adapter was replaced and comes \
last."""
preprocessors = ["canny", "pyracanny", "invert"]
