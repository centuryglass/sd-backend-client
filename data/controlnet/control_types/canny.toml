id = "canny"
label = "Canny"
summary = "Follows the sharp outlines of a reference image, traced by the Canny edge detector."
description = """\
Canny keeps the outlines of a reference image and leaves the rest to the prompt. The control image is black with \
thin white lines wherever the reference has a sharp change in brightness: object borders, folds, printed text \
and fine texture. The generated image places its own edges on those lines, while color, lighting, material and \
style come from the prompt and the checkpoint.\n\n\
A Canny map holds no depth, shading or color, only where edges are. Two thresholds set how many edges it keeps. \
A black-on-white line drawing can be used once it is inverted, which is why WebUI lists "invert" under this \
type."""
how_it_works = """\
Canny models are trained on pairs of images and the Canny edge maps detected from them, with a caption for each. \
The ControlNet 1.1 Canny model was trained on maps made with random thresholds. During generation the model \
reads the edge map alongside the noisy image at every step and nudges the result so its edges land where the map \
has lines. Every model of this type expects white lines on a black background."""
base_models = ["sd15", "sdxl"]
control_image = "Black image with thin white lines, one pixel wide, along edges."

