id = "recolor"
label = "Recolor"
summary = "Keeps an image's brightness and paints new colors: colorizing black-and-white photos or recoloring images."
description = """\
Recolor reduces an image to grayscale and has a model paint colors back in, guided by the prompt. Lights and \
shadows stay where they were, and the colors are new. Stability AI's Recolor Control-LoRA is designed for \
black-and-white photographs; ioclab's Brightness model names colorizing grayscale images and recoloring \
generated ones.\n\n\
Recolor Luminance, the default, keeps perceived lightness; Recolor Intensity keeps each pixel's brightest \
channel. Gamma Correction lightens or darkens the map. Forge and reForge also match each result's brightness to \
the map after generation. Forge Neo has no Recolor type."""
how_it_works = """\
The preprocessor converts the image to a grayscale brightness map with a fixed color-space formula; no network \
is involved. A recolor model is trained on images paired with their grayscale versions, so it learns to keep the \
given brightness pattern while choosing colors. The prompt then decides which colors those are."""
base_models = ["sd15", "sdxl"]
control_image = "Grayscale image of the source's lightness or brightness."

sources = [
    "recorded_fixtures",
    "sdwebui_cn_supported_preprocessor",
    "sdwebui_cn_legacy_preprocessors",
    "forge_preprocessors",
    "hf_stabilityai_control_lora",
    "hf_latentcat_control_v1p_sd15_brightness",
    "sdwebui_cn_1_1_400_discussion",
    "reforge_preprocessors",
    "comfyui_controlnet_aux_nodes",
    "comfyui_controlnet_aux_src",
    "comfyui_controlnet_aux_readme",
    "hf_latentcat_latentcat_controlnet",
    "hf_lllyasviel_sd_control_collection",
    "antfu_ai_qrcode_101",
    "paper_controlnet",
]
research_status = "verified"
open_questions = []

[names]
webui = ["Recolor"]
forge = ["Recolor"]
comfyui = []

[[uses]]
kind = "standard"
title = "Colorize a black-and-white photo"
description = "Use the photo as the control image with Recolor Luminance, and describe its colors in the prompt."

[[uses]]
kind = "creative"
title = "Recolor a generated image"
description = """\
Keep an image's lighting and composition and give it a new palette by prompting for different colors, such as \
a red car instead of a blue one."""

[choosing]
guide = """\
Recolor Luminance makes a lightness map, the form for colorizing black-and-white photos. Recolor Intensity uses \
each pixel's brightest channel, so saturated colors stay bright in the map. On SD 1.5, use Brightness. On SDXL, \
use Stability's Recolor Control-LoRA, which is small next to a full ControlNet."""
preprocessors = ["recolor_luminance", "recolor_intensity"]
models = ["latentcat_brightness_sd15", "sai_control_lora_recolor_sdxl"]
