[[uses]]
kind = "standard"
title = "Remove an object"
description = """\
Mask the object and describe the background, or leave the prompt empty. Inpaint Only + LaMa suits this: its \
announcement shows fewer random objects appearing in the filled area."""

[[uses]]
kind = "standard"
title = "Extend the canvas"
description = """\
Outpaint by choosing Resize and Fill in sd-webui-controlnet, so the new border becomes the masked area, with \
Inpaint Only + LaMa as the preprocessor."""

[[uses]]
kind = "standard"
title = "Inpaint without a prompt"
description = """\
sd-webui-controlnet's 1.1.202 notes describe prompt-free inpainting: Inpaint Only in txt2img, "ControlNet is \
more important" mode, a base size near 512 with hires fix at 2x, and a CFG scale below 5."""

[[uses]]
kind = "creative"
title = "Replace a product photo's background"
description = """\
EcomXL Inpaint was trained to fill around a masked product without growing the product itself. Mask everything \
but the product and prompt for a new setting."""

