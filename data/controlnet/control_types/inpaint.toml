[[uses]]
kind = "standard"
title = "Remove an object"
description = """\
Mask the object and describe the background, or leave the prompt empty. Inpaint Only + LaMa suits this: its \
announcement shows fewer random objects appearing in the filled area."""

[[uses]]
kind = "standard"
title = "Extend the canvas"
description = """\
Outpaint by choosing Resize and Fill in sd-webui-controlnet, so the new border becomes the masked area, with \
Inpaint Only + LaMa as the preprocessor."""

[[uses]]
kind = "standard"
title = "Inpaint without a prompt"
description = """\
sd-webui-controlnet's 1.1.202 notes describe prompt-free inpainting: Inpaint Only in txt2img, "ControlNet is \
more important" mode, a base size near 512 with hires fix at 2x, and a CFG scale below 5."""

[[uses]]
kind = "creative"
title = "Replace a product photo's background"
description = """\
EcomXL Inpaint was trained to fill around a masked product without growing the product itself. Mask everything \
but the product and prompt for a new setting."""

[choosing]
guide = """\
On SD 1.5, use ControlNet 1.1 Inpaint, which works with any SD 1.5 base model. Inpaint Only keeps everything \
outside the mask unchanged, even in txt2img. Inpaint Only + LaMa first fills the hole with the LaMa network, which \
suits removing objects and outpainting, where the hole should become background; it is weaker when the mask should \
receive a new object. Inpaint Global Harmonious lets the whole image shift to match the new content. The \
HandRefiner model also counts as inpainting, but it repairs hands from Depth Hand Refiner maps under Depth.\n\n\
On SDXL, xinsir's Union ProMax inpaints and outpaints with its repaint type and expects the mask filled with \
black, which Inpaint NoobAI and ComfyUI's Inpaint Preprocessor with its xinsir option produce; \
sd-webui-controlnet's inpaint preprocessors fill it with -1 instead. NoobAI Inpainting was trained on NoobAI XL \
and suits that model family. EcomXL Inpaint is for product photos: it fills the background without growing the \
product. The Inpaint Dreamer models need a hand-made control image with white fill areas, and V1 is an early \
alpha."""
preprocessors = ["inpaint_only", "inpaint_only_lama", "inpaint_global_harmonious", "inpaint_noobai"]
