[[uses]]
kind = "standard"
title = "Recolor or restyle while keeping the composition"
description = """\
Soft edges hold the layout of the source image but leave room for new colors, materials and lighting. ControlNet \
1.0 described its HED model as suited to recoloring and stylizing."""

[choosing]
guide = """\
ControlNet 1.1 names PiDiNet Safe the most robust soft edge preprocessor. The Safe variants quantize edges to a \
few levels, removing the hidden image detail a model can over-fit to; plain HED and PiDiNet keep more detail. TEED \
is a tiny network with crisp maps, and SargeZT's SDXL soft edge model pairs with it. AnyLine was made for \
MistoLine. DiffusionEdge is slow and pairs with no model here.\n\n\
On SD 1.5, ControlNet 1.1 Soft Edge is much more robust than ControlNet 1.0 HED, which over-fits the hidden \
grayscale image in HED maps. On SDXL, the xinsir union models read HED, PiDiNet and TEED maps, and MistoLine takes \
many line styles."""
preprocessors = ["pidinet_safe", "hed_safe", "pidinet", "hed", "teed", "anyline", "diffusion_edge"]
