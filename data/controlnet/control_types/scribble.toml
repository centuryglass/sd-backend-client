title = "Sketch a composition, then render it"
description = """\
Block out shapes with a few strokes and describe them in the prompt. The model keeps the layout and fills in the \
detail."""

[[uses]]
kind = "creative"
title = "Loosen a photo into a new picture"
description = """\
Run a photo through scribble_hed or scribble_pidinet to keep only its rough shapes, then prompt for a different \
scene with the same layout."""

