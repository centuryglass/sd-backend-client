[[uses]]
kind = "standard"
title = "Sketch a composition, then render it"
description = """\
Block out shapes with a few strokes and describe them in the prompt. The model keeps the layout and fills in the \
detail."""

[[uses]]
kind = "creative"
title = "Loosen a photo into a new picture"
description = """\
Run a photo through scribble_hed or scribble_pidinet to keep only its rough shapes, then prompt for a different \
scene with the same layout."""

[choosing]
guide = """\
For your own drawing, use no preprocessor if it is white lines on black, or Invert if it is black on white. To \
make a scribble from a photo, Scribble HED and Scribble PiDiNet draw thick, rough strokes, and Scribble XDoG draws \
lines whose detail its threshold sets. Binary and ComfyUI's Scribble Threshold cut the image to flat black and \
white at a brightness level and keep dark strokes dark, so they suit light shapes on a dark ground.\n\n\
On SD 1.5, ControlNet 1.1 Scribble handles thin and thick strokes, and the T2I-Adapter Sketch models are smaller. \
On SDXL, xinsir's Scribble accepts any line type and width, Anime Painter turns very rough doodles into anime \
illustrations, and MistoLine takes many line styles. The SDXL T2I-Adapter Sketch, the Stability Sketch \
Control-LoRA and the LLLite model are smaller. The first SDXL T2I-Adapter Sketch was replaced and comes last."""
preprocessors = ["scribble_hed", "scribble_pidinet", "scribble_xdog", "invert", "binary", "scribble_threshold"]
