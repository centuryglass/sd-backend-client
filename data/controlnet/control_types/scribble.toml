id = "scribble"
label = "Scribble"
summary = "Turns rough strokes or doodles into a finished image that follows their shapes."
description = """\
Scribble follows rough, thick strokes, such as a quick doodle or a sketch made with a mouse. It keeps the \
placement and general shapes of the strokes but not their exact paths, and the prompt fills in what the strokes \
stand for. Its preprocessors make scribble-like maps from images, which turns a photo into a loose composition \
guide.\n\n\
Draw white strokes on black, or invert a black-on-white sketch. Thick strokes are fine: the ControlNet 1.1 model \
was trained on strokes up to 24 pixels wide on a 512 pixel canvas. Forge lists this type twice, as Scribble and \
Sketch, with the same preprocessors and models."""
how_it_works = """\
Scribble models are trained on synthetic scribbles: edge maps from HED, PiDiNet or similar detectors that are \
thinned, blurred, thresholded and randomly thickened until they look hand drawn. Learning from these loose maps \
teaches the model to treat lines as rough placement rather than exact outlines. During generation it reads the \
strokes at every step and steers the image so its shapes sit where the strokes are."""
base_models = ["sd15", "sdxl"]
control_image = "Black image with white strokes of any thickness."

