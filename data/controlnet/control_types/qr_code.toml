[[uses]]
kind = "standard"
title = "Make a scannable artistic QR code"
description = """\
Use a QR code with high error correction (level H) and 16-pixel modules as the control image, with no \
preprocessor. Raise the control weight until the code scans, lower it for a more creative image, and generate \
several to pick from. The QR Code Monster card gives this advice, and DionTimmer's card also recommends level H."""

[[uses]]
kind = "standard"
title = "Rescue a code that doesn't scan"
description = """\
Send the image to img2img with the same QR code as control image. The QR Code Monster card's workflow: max out \
the control weight, set denoising low, then raise denoising until the code scans."""

[[uses]]
kind = "standard"
title = "Keep the composition with a second model"
description = """\
The QR Code 101 guide adds ioclab Brightness as a second unit at low weight, around 0.15 to 0.25, so QR Code \
Monster can stay at weight 1 and the composition changes less."""

[[uses]]
kind = "creative"
title = "Hide text or a shape in a scene"
description = """\
Use white text, a logo or any high-contrast shape as the control image. The result reads as an ordinary scene \
up close and shows the shape when viewed small or from a distance."""

[[uses]]
kind = "creative"
title = "Make only part of the code strict"
description = """\
Gray areas leave the content free in QR Code Monster and QR Pattern V2. The QR Code 101 guide runs two units: \
the full code at medium weight, and only its position markers and format areas at high weight for fewer steps."""

