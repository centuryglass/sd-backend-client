id = "qr_code"
label = "QR Code and Illusion"
summary = "Hides a QR code, text or shape in a generated image by steering its light and dark areas, so the code still scans."
description = """\
QR models turn a black-and-white QR code into artwork that a phone can still scan. The prompt decides what the \
image shows, and the code's pattern decides where it is light or dark. The same models hide text, symbols or \
shapes in a scene, and the SDXL QR Code Monster card says illusions work too.\n\n\
No backend has a QR type: the models appear under All, and need no preprocessor. Control weight trades \
scannability against creativity, and the step range where control applies changes how far the image can drift. \
QR Code Monster V2 and SDXL treat mid-gray (#808080) as background that the code blends into. The ioclab \
Brightness and Illumination models also follow a brightness map, and QR guides pair Brightness with a QR model."""
how_it_works = """\
A QR ControlNet is trained to read a high-contrast black-and-white image and keep its dark and light areas in \
the result, while the prompt and checkpoint decide what those areas show. QR Pattern V2, for example, was \
conditioned only on the quarter of pixels closest to black and the quarter closest to white. When the tones \
follow the code closely enough, a scanner still reads it. A higher control weight holds the pattern harder and \
a lower one leaves the prompt more room."""
base_models = ["sd15", "sdxl"]
control_image = "A black-and-white QR code, text or shape, optionally on a mid-gray (#808080) background."

sources = [
    "recorded_fixtures",
    "hf_monster_labs_control_v1p_sd15_qrcode_monster",
    "hf_monster_labs_control_v1p_sdxl_qrcode_monster",
