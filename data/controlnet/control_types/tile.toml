[[uses]]
kind = "standard"
title = "Upscale with new detail"
description = """\
Enlarge an image, then run img2img in tiles with Ultimate SD Upscale and a Tile model. Each tile follows its own \
content, not the whole prompt, so faces don't appear in leaves. TTPlanet's card suggests denoising around 0.3 to \
0.4 and a control weight of 0.9 for this."""

[[uses]]
kind = "standard"
title = "Repair a blurry or damaged image"
description = """\
Feed a blurred, low-resolution or badly upscaled image as the control image. The ControlNet 1.1 README shows a \
64-pixel dog and a dog damaged by Real-ESRGAN both regenerated with clean detail."""

[[uses]]
kind = "creative"
title = "Finish a color-block draft"
description = """\
lllyasviel's release notes say Tile 1.1 can finish unfinished artwork drafted in blocks of color. Paint the \
composition in flat colors and let the model add the rendering."""

[[uses]]
kind = "creative"
title = "Restyle while keeping the structure"
description = """\
With no preprocessor and "My prompt is more important", TTPlanet's Tile V2 changes clothes or background to match \
the prompt while keeping the pose and layout."""

[choosing]
guide = """\
On SD 1.5, use ControlNet 1.1 Tile with Tile Resample. Shrinking the image in Tile Resample softens its detail, so \
the model invents more. If Tile shifts colors, most often with anime images and models, Tile Color Fix locks \
colors to the source, and Tile Color Fix and Sharpen also counters softness; both override color changes the \
prompt asks for.\n\n\
On SDXL, TTPlanet Tile Realistic V2 has less color shift than V1 and was trained on realistic images. Its card \
warns that too sharp a control image gives halos, so feed it through TTPlanet Tile Guided Filter or Simple. \
xinsir's Tile covers deblurring, variations and super-resolution, and Union ProMax adds tile to its other types. \
The LLLite blur models are small and take a Gaussian Blur image. The LLLite Replicate models take the image with \
no preprocessor and reproduce it as closely as they can."""
preprocessors = [
    "tile_resample",
    "tile_colorfix",
    "tile_colorfix_sharp",
    "ttplanet_tile_gf",
    "ttplanet_tile_simple",
    "blur_gaussian",
]
