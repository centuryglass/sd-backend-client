id = "tile"
label = "Tile"
summary = "Keeps an image's layout and colors and redraws its detail: for upscaling, fixing blur and making variations."
description = """\
Tile reads the image itself, often softened or shrunk, and generates a new version with the same composition and \
colors but freshly drawn detail. Tile models ignore the existing detail and invent their own, and where a region's \
content disagrees with the prompt they follow the region.\n\n\
That makes Tile the usual partner for tiled upscaling, such as Ultimate SD Upscale, where each tile would \
otherwise be pulled toward the whole prompt. It also repairs blur or bad detail from other upscalers, and \
restyles an image while keeping its structure, even at full denoising strength. Forge and its forks also list \
a Blur type that offers the same models."""
how_it_works = """\
A Tile model is trained to rebuild images from degraded copies of themselves: downscaled, blurred or filtered. It \
learns to recognize what each region shows from its rough colors and shapes, and to steer the generation toward \
that content while adding sharp detail. Preprocessors control how degraded the copy is. The more detail is \
removed, the more the model invents. Some Tile preprocessors also act during sampling: the color fix variants \
hold the result's broad colors to the source at every step."""
base_models = ["sd15", "sdxl"]
control_image = "The source image itself, unchanged or softened by downscaling or blur."

sources = [
    "recorded_fixtures",
    "sdwebui_cn_supported_preprocessor",
