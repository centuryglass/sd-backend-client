[[uses]]
kind = "standard"
title = "Upscale with new detail"
description = """\
Enlarge an image, then run img2img in tiles with Ultimate SD Upscale and a Tile model. Each tile follows its own \
content, not the whole prompt, so faces don't appear in leaves. TTPlanet's card suggests denoising around 0.3 to \
0.4 and a control weight of 0.9 for this."""

[[uses]]
kind = "standard"
title = "Repair a blurry or damaged image"
description = """\
Feed a blurred, low-resolution or badly upscaled image as the control image. The ControlNet 1.1 README shows a \
64-pixel dog and a dog damaged by Real-ESRGAN both regenerated with clean detail."""

[[uses]]
kind = "creative"
title = "Finish a color-block draft"
description = """\
lllyasviel's release notes say Tile 1.1 can finish unfinished artwork drafted in blocks of color. Paint the \
composition in flat colors and let the model add the rendering."""

[[uses]]
kind = "creative"
title = "Restyle while keeping the structure"
description = """\
With no preprocessor and "My prompt is more important", TTPlanet's Tile V2 changes clothes or background to match \
the prompt while keeping the pose and layout."""

