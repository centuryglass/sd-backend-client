[[uses]]
kind = "standard"
title = "Restyle an object and keep its shape"
description = """\
Estimate normals from a photo, then prompt for a new material or style. The surface angles stay, including small \
bumps and creases that a depth map flattens."""

[[uses]]
kind = "creative"
title = "Render an image from a 3D normal pass"
description = """\
Export a camera-space normal pass from a 3D program and use it as the control image. The ControlNet 1.1 card \
says its normal model reads real normal maps when their colors follow the ScanNet protocol."""

[choosing]
guide = """\
Normal BAE is the estimator ControlNet 1.1 Normal BAE was trained on. Metric3D Normal draws the same color \
convention: blue front, red left, green top. Normal DSINE draws red for right-facing and green for down-facing \
surfaces, the opposite in both channels, and neither sd-webui-controlnet nor comfyui_controlnet_aux converts it, so \
its maps reach the 1.1 model with those two colors reversed. Normal MiDaS derives normals from a depth map, the method ControlNet 1.0 Normal was trained \
on.\n\n\
On SD 1.5, use ControlNet 1.1 Normal BAE, which also reads normal maps from rendering engines that follow \
ScanNet's convention; ControlNet 1.0 Normal can't read real normal maps. On SDXL, the xinsir union models cover \
normal maps."""
preprocessors = ["normal_bae", "normal_metric3d", "normal_dsine", "normal_midas"]
models = ["control_v11p_sd15_normalbae", "control_sd15_normal", "xinsir_union_promax_sdxl", "xinsir_union_sdxl"]
