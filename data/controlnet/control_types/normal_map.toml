id = "normal_map"
label = "Normal Map"
summary = "Keeps the direction each surface faces, drawn as a color map, so shapes keep their 3D form."
description = """\
A normal map colors every pixel by the direction its surface faces. The ControlNet 1.1 model expects blue for \
surfaces facing the camera, red for left and green for up. The control image therefore carries the shape of \
objects and the angle of their surfaces, including small bumps that a depth map hides. The ControlNet 1.0 README \
found its normal model better than its depth model at keeping geometry such as a hairstyle.\n\n\
The two SD1.5 models read different maps. The 1.0 model was trained on normals computed from MiDaS depth, and \
the 1.1 model on maps from Bae's normal estimator, so use the preprocessor that matches. On SDXL the xinsir \
union models cover normal maps."""
how_it_works = """\
A normal estimator is a neural network that looks at one photo and guesses, for every pixel, the direction of \
the surface it shows. Normal models are trained on pairs of images and these estimated normal maps, with a \
caption for each. During generation the model reads the map alongside the noisy image at every step and nudges \
the result so its surfaces face the same way. The ControlNet 1.1 card says its normal model also works on normal \
maps from rendering engines when their colors follow the ScanNet protocol."""
base_models = ["sd15", "sdxl"]
control_image = "Color normal map: blue faces the camera, red faces left and green faces up."

sources = [
    "recorded_fixtures",
    "sdwebui_cn_supported_preprocessor",
