description = """\
Use lineart_standard or invert on a black-on-white drawing, then prompt for colors, lighting and style."""

[[uses]]
kind = "creative"
title = "Redraw a photo as an illustration"
description = """\
Extract lineart from a photo and generate with an illustration checkpoint, keeping the photo's shapes in a drawn \
style."""

[choosing]
guide = """\
Match the preprocessor to the image. Lineart Realistic redraws photos and renders as detailed line art, and \
Lineart Coarse keeps only the main shapes. Lineart Anime and Lineart Anime Denoise are for anime and manga images \
and pair with the anime lineart model. For a drawing that is already line art, Lineart Standard pulls out its dark \
lines without a network, and Invert alone turns clean black-on-white lines into the white-on-black lines the \
models read. AnyLine was made for MistoLine. DiffusionEdge pairs with no model here.\n\n\
On SD 1.5, use ControlNet 1.1 Lineart for realistic images and ControlNet 1.1 Anime Lineart with anime \
checkpoints; the anime model needs long prompts and clip skip 2. On SDXL, MistoLine takes many line styles and \
pairs with AnyLine, the T2I-Adapter is far smaller, and the union models cover lineart beside their other types. \
xinsir's Anime Painter turns rough doodles into anime illustrations, given an anime checkpoint and tag prompts."""
