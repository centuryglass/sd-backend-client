id = "qrcode_monster_sd15"
label = "QR Code Monster"
summary = "monster-labs' first SD 1.5 QR ControlNet: generates creative QR codes that still scan. V2 replaces it."
description = """\
monster-labs' first QR Code Monster ControlNet for SD 1.5, made to generate creative QR codes that still scan. \
Not every result scans, so its card suggests generating several and trying other prompts and settings.\n\n\
Its card's advice covers both versions. Pass the QR code as the control image with 16-pixel modules and a high \
error correction level, on a gray background. A higher control weight makes the code more readable, a lower one \
more creative. Version 2, in the same repository's v2 folder, is a large upgrade in scannability and \
creativity per the card."""
how_it_works = """\
A ControlNet is a trainable copy of the encoder layers of Stable Diffusion, joined to the frozen original by \
convolution layers that start at zero, so training begins without disturbing the base model. It learns to read \
one kind of control image and adds its signal into the main network at every denoising step. This one reads a QR code and keeps its pattern of dark and light modules in the generated image, while the \
prompt decides what the image shows."""
base_models = ["sd15"]
adapter = "controlnet"
control_types = ["qr_code"]
preprocessors = []
trainer = "monster-labs"
license = "openrail++"
homepage = "https://huggingface.co/monster-labs/control_v1p_sd15_qrcode_monster"

strengths = ["Control weight trades scannability against creativity, per its card"]
weaknesses = ["Superseded by V2, which its card calls a large upgrade in scannability and creativity"]
good_for = ["artistic QR codes"]

