id = "destitech_inpaint_dreamer_v2_sdxl"
label = "Inpaint Dreamer V2"
summary = "Second release of destitech's SDXL inpainting and outpainting ControlNet; areas to fill are painted solid white."
description = """\
The second release of destitech's Inpaint Dreamer, an SDXL ControlNet for inpainting and outpainting, published \
in the same repo's v2 folder. Its card, written for the first release, describes the use: the image goes in as \
the control image in a txt2img pipeline at denoising 1.0, with the areas to fill painted solid white.\n\n\
None of the backends' inpaint preprocessors paints the mask white, so the control image is prepared by hand. \
Civitai's ControlNetXL collection carries it as destitech-inpaintv2. The \
full-precision file's path in the repo ends in a newline character; Civitai serves the same file under a plain \
name."""
how_it_works = """\
A ControlNet is a trainable copy of the encoder layers of Stable Diffusion, joined to the frozen original by \
convolution layers that start at zero, so training begins without disturbing the base model. It learns to read \
one kind of control image and adds its signal into the main network at every denoising step. This one reads an \
image with its missing areas in solid white and guides generation to fill them."""
base_models = ["sdxl"]
adapter = "controlnet"
control_types = ["inpaint"]
preprocessors = []
trainer = "destitech"
license = "openrail"
homepage = "https://huggingface.co/destitech/controlnet-inpaint-dreamer-sdxl"

strengths = ["Outpainting as well as inpainting, per its card"]
weaknesses = ["Needs a hand-made control image with white fill areas", "No release notes for what changed from V1"]
good_for = ["outpainting", "inpainting"]

sources = [
    "hf_destitech_controlnet_inpaint_dreamer_sdxl",
    "civitai_controlnetxl_cnxl",
    "paper_controlnet",
]
research_status = "verified"
