id = "t2iadapter_canny_sd15v2"
label = "T2I-Adapter Canny v2"
summary = "Improved TencentARC T2I-Adapter for Canny edges on SD1.x, released after the sd14v1 adapter."
description = """\
The second T2I-Adapter for Canny edges on SD1.x, added on 26 March 2023 in a commit titled "add improved canny, \
sketch, depth models". Like the first version it steers generation to follow a Canny edge map at a fraction of a \
ControlNet's cost."""
how_it_works = """\
A T2I-Adapter is a small network, about 77 million parameters, that reads the control map and feeds features \
into a frozen Stable Diffusion model. It runs once per image rather than at every denoising step, so it costs \
far less than a ControlNet. This adapter takes Canny edge maps."""
base_models = ["sd15"]
adapter = "t2i_adapter"
control_types = ["canny"]
preprocessors = ["canny"]
trainer = "TencentARC"
license = ""
