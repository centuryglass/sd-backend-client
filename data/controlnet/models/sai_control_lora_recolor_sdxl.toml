id = "sai_control_lora_recolor_sdxl"
label = "Stability Control-LoRA Recolor"
summary = "Stability AI's SDXL Control-LoRA that colorizes black-and-white photos from their grayscale lightness."
description = """\
Stability AI's Recolor Control-LoRA colorizes images. Its card says it is designed for black-and-white \
photographs: given a grayscale image, it paints in color guided by the prompt. Its sibling, Sketch, colorizes \
drawings instead.\n\n\
sd-webui-controlnet's SDXL recolor example pairs it with Recolor Luminance. The rank 256 and rank 128 files are \
reductions of the same original ControlNet; sd_control_collection mirrors both under its own names."""
how_it_works = """\
A Control-LoRA is a ControlNet trained with low-rank adaptation: in place of full weight matrices it stores \
small low-rank updates, which shrinks a 4.7 GB SDXL ControlNet to about 738 MB at rank 256 or 377 MB at rank \
128. It is loaded and used like a ControlNet. This one reads a grayscale image and steers generation to keep its \
lightness while choosing colors."""
base_models = ["sdxl"]
adapter = "control_lora"
control_types = ["recolor"]
preprocessors = ["recolor_luminance", "recolor_intensity"]
trainer = "Stability AI"
