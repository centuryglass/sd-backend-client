id = "ip_adapter_faceid_portrait_sdxl"
label = "IP-Adapter FaceID Portrait SDXL"
summary = "SDXL FaceID Portrait adapter: identity from one or more face photos, style from the prompt, no LoRA."
description = """\
IP-Adapter FaceID Portrait SDXL is the SDXL version of the Portrait adapter, uploaded in March 2024. \
ComfyUI_IPAdapter_plus describes it as SDXL text-prompt style transfer: the identity comes from the face photos \
and the style from the prompt. It needs no LoRA, takes several photos and pairs with the IP-Adapter FaceID \
preprocessor."""
how_it_works = """\
It reads only InsightFace's 512-number identity embedding, projected into 16 image prompt tokens for the U-Net's \
added cross-attention weights. It accepts several reference photos, which h94 says improves likeness. There is no \
LoRA and no ControlNet."""
base_models = ["sdxl"]
adapter = "ip_adapter"
control_types = ["ip_adapter"]
preprocessors = ["ip_adapter_face_id", "ip_adapter_face_id_plus"]
trainer = "h94 (Tencent AI Lab)"
license = ""
homepage = "https://huggingface.co/h94/IP-Adapter-FaceID"

strengths = [
    "No LoRA needed",
    "Uses several reference photos together",
]
weaknesses = [
    "Research use only: h94 releases the FaceID models for non-commercial use, as InsightFace's models are",
]
good_for = [
    "portraits from several photos of one person",
    "restyling a portrait through the prompt",
]

