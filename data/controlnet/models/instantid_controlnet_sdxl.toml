id = "instantid_controlnet_sdxl"
label = "InstantID ControlNet"
summary = "The ControlNet half of InstantID, called IdentityNet: steers the face toward the identity, placed by five keypoints."
description = """\
The InstantID ControlNet is the second of InstantID's two models. Its control image is the five-point keypoint \
drawing from InstantID Face Keypoints, which sets the face's position and angle, and it must follow the InstantID \
IP-Adapter unit. InstantX's tips: raise both weights for more likeness, and lower this one if colors stay \
oversaturated after lowering the adapter. sd-webui-controlnet recommends a CFG of about 4 to 5.\n\n\
The WebUI extensions need instant_id in its file name: sd-webui-controlnet's announcement renames it to \
control_instant_id_sdxl, and reForge only feeds face tokens to ControlNets named that way."""
how_it_works = """\
It is a ControlNet for SDXL that the paper calls IdentityNet. Its spatial input is only the five-keypoint \
drawing, a weak cue for where the face is. In place of the text prompt, its cross-attention reads the face tokens \
from the InstantID adapter, a strong cue for who it is. Its output joins the U-Net like any ControlNet's."""
base_models = ["sdxl"]
adapter = "controlnet"
control_types = ["ip_adapter"]
preprocessors = ["instant_id_face_keypoints"]
trainer = "InstantX"
license = "apache-2.0"
