id = "ip_adapter_faceid_sdxl"
label = "IP-Adapter FaceID SDXL"
summary = "SDXL IP-Adapter that keeps a person's identity from a face recognition embedding; needs its LoRA."
description = """\
IP-Adapter FaceID SDXL is h94's experimental SDXL version of FaceID. It keeps a person's identity from a face \
photo while the prompt sets the style. It pairs with the IP-Adapter FaceID preprocessor and needs the insightface \
package.\n\n\
The companion LoRA, listed among this record's files, goes in the LoRA folder and into the prompt; \
sd-webui-controlnet recommends a LoRA weight of 0.5 to 0.7 and doesn't load it automatically, while \
ComfyUI_IPAdapter_plus's unified FaceID loader does."""
how_it_works = """\
InsightFace's face recognition network turns the face into a 512-number embedding that describes who it is rather \
than the lighting or angle. A small projection maps that embedding to image prompt tokens, which the U-Net's \
added cross-attention weights attend to alongside the text. The companion LoRA adjusts the U-Net itself to \
improve how consistently the identity comes through."""
base_models = ["sdxl"]
adapter = "ip_adapter"
control_types = ["ip_adapter"]
preprocessors = ["ip_adapter_face_id", "ip_adapter_face_id_plus"]
trainer = "h94 (Tencent AI Lab)"
license = ""
homepage = "https://huggingface.co/h94/IP-Adapter-FaceID"

strengths = [
    "Identity carries across styles set by the prompt",
]
weaknesses = [
    "Experimental, per h94",
    "Research use only: h94 releases the FaceID models for non-commercial use, as InsightFace's models are",
]
good_for = [
    "putting a person into new styles and scenes",
]

sources = [
