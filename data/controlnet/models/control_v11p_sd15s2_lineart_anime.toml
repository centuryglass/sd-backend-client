id = "control_v11p_sd15s2_lineart_anime"
label = "ControlNet 1.1 Anime Lineart"
summary = "The SD1.5 ControlNet 1.1 model for anime line art; needs long prompts and clip skip 2."
description = """\
ControlNet 1.1 Anime Lineart turns anime line drawings, real or extracted, into anime images. Its README demo \
needs the Anything V3 anime checkpoint.\n\n\
It was trained with three times the usual prompt length and clip skip 2. Its README calls it a long prompt \
model: unless LoRAs are used, results are better with long prompts. It does not support Guess Mode. The README \
removed its training data and implementation details."""
how_it_works = """\
A ControlNet is a trainable copy of the encoder layers of Stable Diffusion, joined to the frozen original by \
convolution layers that start at zero, so training begins without disturbing the base model. The copy learns to \
read one kind of control map and adds its signal into the main network at every denoising step. Its training \
data is not published."""
base_models = ["sd15"]
adapter = "controlnet"
control_types = ["lineart"]
preprocessors = ["lineart_anime", "lineart_anime_denoise", "anyline"]
