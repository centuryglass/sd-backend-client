id = "ip_adapter_sd15"
label = "IP-Adapter SD1.5"
summary = "The original SD 1.5 IP-Adapter: uses a reference image as part of the prompt, from its overall CLIP embedding."
description = """\
The standard SD 1.5 IP-Adapter makes the result resemble a reference image in subject and style. It reads one \
CLIP embedding of the whole image, so it carries the gist rather than fine detail; Plus stays closer to the \
reference. It pairs with the CLIP-ViT-H preprocessor.\n\n\
tencent-ailab suggests weight 1.0 with an empty or generic prompt for image-only prompting, and about 0.5 when \
combining it with a text prompt. It works with any SD 1.5 fine-tune. lllyasviel's sd_control_collection mirrors \
it as ip-adapter_sd15.pth, the same weights."""
how_it_works = """\
The CLIP ViT-H image encoder reduces the reference to a single embedding, one vector for the whole image. A small \
projection turns it into four tokens shaped like prompt tokens. Every cross-attention layer of the U-Net gets a \
second set of key and value weights that attend to those tokens, and the result is added to the text attention. \
The base model's own weights stay unchanged."""
base_models = ["sd15"]
adapter = "ip_adapter"
control_types = ["ip_adapter"]
preprocessors = ["ip_adapter_clip_h"]
trainer = "h94 (Tencent AI Lab)"
license = "apache-2.0"
homepage = "https://huggingface.co/h94/IP-Adapter"

strengths = [
    "Small: about 22 million parameters, 44 MB at fp16",
    "Works with text prompts and other ControlNets",
]
weaknesses = [
    "Carries the overall look more than exact details, compared with Plus",
]
good_for = [
    "image variations",
    "combining an image prompt with text",
]

