id = "kohya_lllite_blur_sdxl"
label = "LLLite SDXL Blur"
summary = "kohya-ss ControlNet-LLLite for SDXL that redraws a Gaussian-blurred image with new detail; trained on SDXL base."
description = """\
A ControlNet-LLLite model from kohya-ss that takes a Gaussian-blurred image and generates a sharp one with the \
same layout and colors, as a Tile model does. It was trained on SDXL base with 3,919 generated images and Gaussian blur \
preprocessing, and the card recommends Gaussian blur as its preprocessor.\n\n\
Trained only on the first half of the noise schedule, timesteps 500 to 1000, so the card advises applying it to the first half of the steps."""
how_it_works = """\
ControlNet-LLLite is kohya-ss's lightweight alternative to ControlNet: small conditioning modules attached to \
the SDXL U-Net. Its model card calls the structure highly experimental and subject to change. This model was \
trained on Gaussian-blurred images."""
base_models = ["sdxl"]
adapter = "controlnet_lllite"
control_types = ["tile"]
preprocessors = ["blur_gaussian"]
trainer = "kohya-ss"
license = "apache-2.0"
homepage = "https://huggingface.co/kohya-ss/controlnet-lllite"

