id = "ip_adapter_plus_face_sdxl_vit_h"
label = "IP-Adapter Plus Face SDXL"
summary = "IP-Adapter Plus SDXL trained on cropped faces, to carry a face from the reference image into the result."
description = """\
IP-Adapter Plus Face SDXL is the SDXL Plus model trained with cropped face images as the condition. Give it a \
reference cropped to the face and it carries that face into the generation. It pairs with the CLIP-ViT-H \
preprocessor.\n\n\
It reads CLIP image features, not a face recognition embedding, so it keeps how the face looks more than who it \
is; the FaceID and PuLID models target identity."""
how_it_works = """\
Plus models read the features of every image patch from the CLIP ViT-H encoder's second-to-last layer instead of \
its single summary vector. A small transformer called a resampler condenses those patches into 16 tokens, which \
the U-Net's added cross-attention weights attend to alongside the text. Patch features keep more of the \
reference's detail than one vector does."""
base_models = ["sdxl"]
adapter = "ip_adapter"
control_types = ["ip_adapter"]
preprocessors = ["ip_adapter_clip_h"]
trainer = "h94 (Tencent AI Lab)"
license = "apache-2.0"
homepage = "https://huggingface.co/h94/IP-Adapter"

strengths = [
    "No InsightFace install needed, unlike FaceID",
]
weaknesses = [
    "Expects a cropped face as the reference",
]
good_for = [
    "portraits that resemble a reference face",
]

sources = [
    "hf_h94_ip_adapter",
    "paper_ip_adapter",
    "gh_tencent_ailab_ip_adapter",
    "sdwebui_cn_ipadapter",
    "comfyui_ipadapter_plus_readme",
]
research_status = "verified"
