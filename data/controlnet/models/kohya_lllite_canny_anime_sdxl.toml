summary = "kohya-ss's tiny SDXL ControlNet-LLLite for Canny edges, trained on an anime model."
description = """\
A ControlNet-LLLite model for Canny edges, trained with kohya-ss's own custom anime SDXL model on 921 generated \
images. At about 46 MB it is far smaller than a ControlNet.\n\n\
lllyasviel's sd_control_collection mirrors it as kohya_controllllite_xl_canny_anime."""
how_it_works = """\
ControlNet-LLLite is kohya-ss's lightweight alternative to ControlNet: small conditioning modules, about 46 MB \
in all, attached to the SDXL U-Net. Its model card calls the structure highly experimental and subject to \
change. This model was trained on Canny edge maps of anime images."""
