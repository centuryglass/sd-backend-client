id = "kohya_lllite_replicate_anime_sdxl"
label = "LLLite SDXL Replicate Anime"
summary = "kohya-ss ControlNet-LLLite for SDXL that reproduces the control image as closely as it can, blended with the prompt."
description = """\
A ControlNet-LLLite model from kohya-ss that replicates the control image, mixed with the prompt, as closely as \
the model can. It needs no preprocessor and also works in img2img. Its card names no control type; this \
reference files it under Tile, whose models also redraw the image they are given.\n\n\
It was trained on kohya-ss's custom anime SDXL model with 896 generated image pairs at 1024 and 2048 pixels, the \
larger made with hires fix, for timesteps 0 to 500, the low-noise end of the schedule, though the card says it seems to work for 0 to 1000."""
how_it_works = """\
ControlNet-LLLite is kohya-ss's lightweight alternative to ControlNet: small conditioning modules attached to \
the SDXL U-Net. Its model card calls the structure highly experimental and subject to change. This model was \
trained on pairs of the same image at two resolutions, so it learns to reproduce its control image."""
