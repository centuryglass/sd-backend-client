id = "t2i_adapter_openpose_sdxl"
label = "T2I-Adapter SDXL OpenPose"
summary = "TencentARC's SDXL T2I-Adapter for OpenPose skeletons; small, about 158 MB in fp16."
description = """\
An SDXL adapter for OpenPose stick figures from TencentARC, trained with OpenPose bone images. Its card's \
example runs OpenPose at 512 pixels, scales the result to 1024, and uses an adapter strength of 1.\n\n\
TencentARC's original-format adapter-xl-openpose.pth holds the same network. Its fp16 copy in \
sd_control_collection, t2i-adapter_xl_openpose, matches the diffusers copy tensor for tensor, so every file \
below loads the same weights."""
how_it_works = """\
A T2I-Adapter is a small network, about 77 million parameters, that reads the control map and feeds features \
into a frozen Stable Diffusion model. It runs once per image rather than at every denoising step, so it costs \
far less than a ControlNet. This one was trained on 3 million high-resolution image and caption pairs from \
LAION-Aesthetics V2, for 35,000 steps at a total batch size of 256."""
base_models = ["sdxl"]
adapter = "t2i_adapter"
control_types = ["openpose"]
preprocessors = ["openpose"]
trainer = "TencentARC"
license = "apache-2.0"
homepage = "https://huggingface.co/TencentARC/t2i-adapter-openpose-sdxl-1.0"

strengths = ["Small and fast compared with an SDXL ControlNet"]
weaknesses = []
good_for = ["copying a pose from a photo"]

