id = "sai_control_lora_depth_sdxl"
label = "Stability Control-LoRA Depth"
summary = "Stability AI's SDXL Control-LoRA for depth, a ControlNet compressed to 377 or 738 MB."
description = """\
Stability AI's Control-LoRA for depth on SDXL. It reads a grayscale depth map and was trained on the output of \
MiDaS dpt_beit_large_512, then fine-tuned on the Portrait Depth Estimation model in Stability's ClipDrop API. \
Files come at rank 256 (about 738 MB) and an experimental rank 128 (about 377 MB). The card describes both as \
reductions of the original ControlNet.\n\n\
Stability trained the Control-LoRAs on a diverse range of image concepts and aspect ratios. The card's license \
is other."""
how_it_works = """\
A Control-LoRA is a ControlNet trained with low-rank adaptation: in place of full weight matrices it stores \
small low-rank updates, which shrinks a 4.7 GB SDXL ControlNet to about 738 MB at rank 256 or 377 MB at rank \
128. It is loaded and used like a ControlNet. This one was trained on depth maps from MiDaS and ClipDrop."""
base_models = ["sdxl"]
adapter = "control_lora"
control_types = ["depth"]
preprocessors = ["depth_midas"]
trainer = "Stability AI"
license = "other"
homepage = "https://huggingface.co/stabilityai/control-lora"

