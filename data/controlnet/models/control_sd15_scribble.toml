id = "control_sd15_scribble"
label = "ControlNet 1.0 Scribble"
summary = "The original SD1.5 ControlNet for scribbles, superseded by ControlNet 1.1 Scribble."
description = """\
ControlNet 1.0 Scribble turns rough user scribbles into images. Its README shows it working from scribbles drawn \
in any paint program, from an interactive canvas, and from "fake scribbles" synthesized from photos.\n\n\
The ControlNet 1.1 README lists problems in the 1.0 training set: a small group of grayscale human images \
duplicated thousands of times, which made 1.0 models somewhat likely to generate grayscale people, plus blurry \
or JPEG-damaged images and some mismatched captions."""
how_it_works = """\
A ControlNet is a trainable copy of the encoder layers of Stable Diffusion, joined to the frozen original by \
convolution layers that start at zero, so training begins without disturbing the base model. The copy learns to \
read one kind of control map and adds its signal into the main network at every denoising step. This model was \
trained on boundary edges with very strong data augmentation, to simulate lines like those a person draws."""
base_models = ["sd15"]
adapter = "controlnet"
control_types = ["scribble"]
preprocessors = [
    "scribble_hed",
    "binary",
    "pidinet",
    "scribble_pidinet",
    "scribble_xdog",
    "scribble_threshold",
]
trainer = "lllyasviel"
license = "openrail"
homepage = "https://huggingface.co/lllyasviel/ControlNet"

strengths = ["Works from hand-drawn scribbles"]
weaknesses = ["Training-set flaws fixed in ControlNet 1.1"]
good_for = ["turning doodles into images"]

sources = [
    "hf_lllyasviel_controlnet",
