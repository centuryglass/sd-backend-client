id = "ip_adapter_faceid_portrait_v11_sd15"
label = "IP-Adapter FaceID Portrait 1.1"
summary = "Version 1.1 of the SD 1.5 FaceID Portrait adapter: identity from one or more face photos, style from the prompt, no LoRA."
description = """\
IP-Adapter FaceID Portrait 1.1 is the later release of the SD 1.5 Portrait adapter, uploaded in February 2024. \
ComfyUI_IPAdapter_plus describes it as text-prompt style transfer for portraits: the identity comes from the face \
photos and the style from the prompt. Like the first release it needs no LoRA, takes several photos and pairs \
with the IP-Adapter FaceID preprocessor."""
how_it_works = """\
It reads only InsightFace's 512-number identity embedding, projected into 16 image prompt tokens for the U-Net's \
added cross-attention weights. It accepts several reference photos, which h94 says improves likeness. There is no \
LoRA and no ControlNet."""
base_models = ["sd15"]
adapter = "ip_adapter"
control_types = ["ip_adapter"]
preprocessors = ["ip_adapter_face_id", "ip_adapter_face_id_plus"]
trainer = "h94 (Tencent AI Lab)"
license = ""
homepage = "https://huggingface.co/h94/IP-Adapter-FaceID"

strengths = [
