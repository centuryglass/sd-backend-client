id = "latentcat_illumination_sd15"
label = "Illumination"
summary = "ioclab's SD 1.5 light composition ControlNet: places light and shadow from a blurry grayscale sketch."
description = """\
ioclab's Illumination ControlNet, also called Light Composition and now hosted by latentcat, places light and \
shadow from a rough grayscale image. Its trainer describes it as similar to depth: paint or blur a black-and-white \
sketch of where light falls, and the prompt decides what fills it. Bright words such as floating stars, sparks or \
splashes land on the brightest spots.\n\n\
The trainer recommends a control weight of 0.4 to 0.9 and ending control at 0.4 to 0.9 of the steps, lowering \
both if the result overfits. Blurry inputs leave more detail to the model. When a subject lands in the wrong \
place, a second unit such as a segmentation map fixes its position. QR guides also list it as a QR model."""
how_it_works = """\
A ControlNet is a trainable copy of the encoder layers of Stable Diffusion, joined to the frozen original by \
convolution layers that start at zero, so training begins without disturbing the base model. It learns to read \
one kind of control image and adds its signal into the main network at every denoising step. This one was \
trained on images paired with heavily degraded grayscale copies: contrast raised, blurred several times, \
histogram-equalized and pixelated, so only broad light and shadow remain."""
