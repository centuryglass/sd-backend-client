homepage = "https://huggingface.co/xinsir/controlnet-openpose-sdxl-1.0"

strengths = ["Follows the pose more precisely than xinsir's default model, per its author"]
weaknesses = ["Lower aesthetic score than xinsir's default model, per its author"]
