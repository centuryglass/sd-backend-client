id = "ip_adapter_faceid_plus_sd15"
label = "IP-Adapter FaceID Plus SD1.5"
summary = "SD 1.5 FaceID adapter that adds CLIP features of the face for its structure to the identity embedding; superseded by Plus V2."
description = """\
IP-Adapter FaceID Plus adds CLIP features of the face, for its structure, to FaceID's identity embedding. It \
pairs with the IP-Adapter FaceID Plus preprocessor. ComfyUI_IPAdapter_plus marks it deprecated in favor of FaceID \
Plus V2.\n\n\
The companion LoRA, listed among this record's files, goes in the LoRA folder and into the prompt; \
sd-webui-controlnet recommends a LoRA weight of 0.5 to 0.7 and doesn't load it automatically, while \
ComfyUI_IPAdapter_plus's unified FaceID loader does."""
how_it_works = """\
It reads two inputs: InsightFace's 512-number identity embedding and the patch features of the face from the CLIP \
ViT-H encoder. A small transformer combines them into four image prompt tokens for the U-Net's added \
cross-attention weights. h94 describes the identity embedding as carrying who the person is and the CLIP features \
as carrying the face's structure. The companion LoRA adjusts the U-Net to keep the identity consistent."""
base_models = ["sd15"]
adapter = "ip_adapter"
control_types = ["ip_adapter"]
preprocessors = ["ip_adapter_face_id_plus"]
trainer = "h94 (Tencent AI Lab)"
