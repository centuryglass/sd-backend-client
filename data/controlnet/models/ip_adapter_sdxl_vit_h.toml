id = "ip_adapter_sdxl_vit_h"
label = "IP-Adapter SDXL ViT-H"
summary = "SDXL IP-Adapter that reads the reference with the smaller CLIP ViT-H encoder; otherwise like IP-Adapter SDXL."
description = """\
IP-Adapter SDXL ViT-H is the SDXL adapter retrained with the OpenCLIP ViT-H/14 image encoder. h94 describes it as \
the same as ip-adapter_sdxl but using ViT-H; tencent-ailab found no significant difference in results and chose \
the smaller encoder to save memory. It pairs with the CLIP-ViT-H preprocessor, the same one the SD 1.5 models \
use."""
how_it_works = """\
The CLIP ViT-H image encoder reduces the reference to a single embedding, which a small projection turns into \
four tokens. Each of SDXL's cross-attention layers gains extra key and value weights that attend to those tokens, \
and the result is added to the text attention."""
base_models = ["sdxl"]
adapter = "ip_adapter"
control_types = ["ip_adapter"]
preprocessors = ["ip_adapter_clip_h"]
trainer = "h94 (Tencent AI Lab)"
license = "apache-2.0"
homepage = "https://huggingface.co/h94/IP-Adapter"

strengths = [
    "Uses the smaller ViT-H encoder, shared with the SD 1.5 models",
]
weaknesses = []
good_for = [
    "image variations",
    "combining an image prompt with text",
]

sources = [
    "hf_h94_ip_adapter",
