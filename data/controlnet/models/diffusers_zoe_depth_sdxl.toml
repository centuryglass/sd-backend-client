id = "diffusers_zoe_depth_sdxl"
label = "Diffusers SDXL Zoe Depth"
summary = "A full-size SDXL ControlNet from Hugging Face trained on ZoeDepth maps."
description = """\
The diffusers team's SDXL depth ControlNet trained on ZoeDepth maps. Its card says Zoe produces high-quality \
depth maps that are better suited for conditioning. It is the same size as the diffusers MiDaS-style depth \
ControlNet, about 2.5 GB in fp16."""
how_it_works = """\
A ControlNet is a trainable copy of the encoder layers of Stable Diffusion, joined to the frozen original by \
convolution layers that start at zero, so training begins without disturbing the base model. The copy learns to \
read one kind of control map and adds its signal into the main network at every denoising step. It was trained \
on 3 million image and caption pairs from LAION-Aesthetics V2, for 700 GPU hours on 80 GB A100s, at batch size \
256 and a constant learning rate of 1e-5, in fp16."""
base_models = ["sdxl"]
adapter = "controlnet"
control_types = ["depth"]
preprocessors = ["depth_zoe"]
trainer = "Hugging Face diffusers"
license = "openrail++"
homepage = "https://huggingface.co/diffusers/controlnet-zoe-depth-sdxl-1.0"

strengths = []
weaknesses = ["Large: about 2.5 GB in fp16"]
good_for = ["restyling while keeping scene layout"]

