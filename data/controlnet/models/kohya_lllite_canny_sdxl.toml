id = "kohya_lllite_canny_sdxl"
label = "LLLite SDXL Canny"
summary = "kohya-ss's tiny, experimental SDXL ControlNet-LLLite for Canny edges, about 46 MB."
description = """\
A ControlNet-LLLite model for Canny edges on SDXL base, from kohya-ss, the author of the sd-scripts trainer. At \
about 46 MB it is far smaller than a ControlNet. It was trained on 3,919 generated images with Canny \
preprocessing.\n\n\
WebUI's ControlNet extension and a ComfyUI custom node support it. lllyasviel's sd_control_collection mirrors it \
as kohya_controllllite_xl_canny."""
how_it_works = """\
ControlNet-LLLite is kohya-ss's lightweight alternative to ControlNet: small conditioning modules, about 46 MB \
in all, attached to the SDXL U-Net. Its model card calls the structure highly experimental and subject to \
change. This model was trained on Canny edge maps."""
