id = "xinsir_anime_painter_sdxl"
label = "Xinsir SDXL Anime Painter"
summary = "xinsir's SDXL scribble ControlNet for anime: simple doodles plus tags become illustrations."
description = """\
An SDXL scribble ControlNet trained on a large, filtered set of anime images, meant to let anyone turn a simple, \
unclear doodle into an anime illustration. It accepts any type and width of line.\n\n\
It needs an anime SDXL checkpoint; its examples use CounterfeitXL. Its card recommends prompting with Danbooru \
tags for what is in the image, followed by natural language for what is happening, in as much detail as \
possible."""
how_it_works = """\
A ControlNet is a trainable copy of the encoder layers of Stable Diffusion, joined to the frozen original by \
convolution layers that start at zero, so training begins without disturbing the base model. The copy learns to \
read one kind of control map and adds its signal into the main network at every denoising step. Its author does \
not disclose the training details beyond a large set of high-quality anime images."""
base_models = ["sdxl"]
adapter = "controlnet"
control_types = ["scribble", "lineart"]
preprocessors = []
trainer = "xinsir"
license = "apache-2.0"
homepage = "https://huggingface.co/xinsir/anime-painter"

strengths = ["Works from very simple, unclear sketches", "Accepts any line type and width"]
weaknesses = ["Needs an anime SDXL checkpoint and detailed tag prompts"]
