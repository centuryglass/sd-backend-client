id = "t2iadapter_seg_sd14v1"
label = "T2I-Adapter Segmentation v1"
summary = "TencentARC's T2I-Adapter for COCO-Stuff segmentation maps on SD 1.x, a small add-on trained on SD 1.4."
description = """\
A T2I-Adapter that steers SD 1.x generation to follow a segmentation map. It is a small add-on, about 309 MB \
at full precision, from the first T2I-Adapter release with the sketch and keypose adapters. It was trained on \
COCO-Stuff, whose maps cover 80 thing classes, 91 stuff classes and an unlabeled class.\n\n\
Its README's example takes a ready-made segmentation map, not a photo, and the example maps don't use the \
ADE20K or COCO panoptic colors that the OneFormer and UniFormer preprocessors draw. It was trained on SD 1.4. \
TencentARC's README recommends SD 1.5 as the base and says the adapters should work on other models \
fine-tuned from SD 1.4 or 1.5. The README also shows it combined with the sketch adapter."""
how_it_works = """\
A T2I-Adapter is a small network, about 77 million parameters, that reads the control map and feeds features \
into a frozen Stable Diffusion model. It runs once per image rather than at every denoising step, so it costs \
far less than a ControlNet. This adapter was trained on COCO images paired with color-coded COCO-Stuff \
segmentation masks and their captions."""
base_models = ["sd15"]
adapter = "t2i_adapter"
control_types = ["segmentation"]
preprocessors = []
trainer = "TencentARC"
license = ""
homepage = "https://huggingface.co/TencentARC/T2I-Adapter"

strengths = ["Small and fast compared with a ControlNet", "Combines with the sketch adapter, per its README"]
weaknesses = ["No backend preprocessor draws the palette of its example maps"]
good_for = ["generating from a prepared segmentation map"]

