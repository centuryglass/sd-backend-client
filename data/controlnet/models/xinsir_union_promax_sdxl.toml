    "lineart_anime",
    "mlsd",
    "normal_bae",
    "mobile_sam",
    "tile_resample",
    "blur_gaussian",
    "inpaint_noobai",
]
trainer = "xinsir"
license = "apache-2.0"
homepage = "https://huggingface.co/xinsir/controlnet-union-sdxl-1.0"

strengths = [
    "One file covers eleven control types, tile and inpaint included",
    "Its card shows inpainting, outpainting, deblurring and 9x super-resolution",
]
weaknesses = [
    "Its outpainting script extends only straight edges parallel to the image border",
    "sd-webui-controlnet's inpaint preprocessors fill the mask with -1, not the black its scripts use",
    "reForge runs it without a control type, and Forge without its union layers",
]
good_for = [
    "replacing a set of SDXL ControlNets with one file",
    "inpainting and outpainting",
    "tiled upscaling and deblurring",
]

