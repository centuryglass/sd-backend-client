id = "xinsir_union_promax_sdxl"
label = "Xinsir SDXL Union ProMax"
summary = "xinsir's all-in-one SDXL ControlNet with tile and repaint types added, for deblurring, upscaling, inpainting and outpainting."
description = """\
The ProMax version of xinsir's union ControlNet keeps its six control types and adds two: tile and repaint. Its \
card shows tile deblurring, tile variations, super-resolution from one to nine megapixels, inpainting and \
outpainting. Its example scripts blur and downscale the image for tile, and paint the masked area black for \
repaint. ComfyUI's Inpaint Preprocessor with black_pixel_for_xinsir_cn and Inpaint NoobAI make that image. \
sd-webui-controlnet's inpaint preprocessors fill it with -1. The outpainting script only extends straight edges.\n\n\
Choosing the type works as for the union model: ComfyUI's Set Union ControlNet Type, or the unit's Control Type in \
sd-webui-controlnet and Forge Neo. reForge never \
passes it, and Forge loads the model without its union layers."""
how_it_works = """\
A ControlNet is a trainable copy of the encoder layers of Stable Diffusion, joined to the frozen original by \
convolution layers that start at zero. Like the union model, this one turns the control type into an embedding \
added to the timestep embedding, and mixes control image features with a condition transformer, all through \
one shared condition encoder. Its type embedding has eight slots, not six: the extra tile and repaint types let \
it rebuild a degraded image or fill a blacked-out area."""
base_models = ["sdxl"]
adapter = "union"
control_types = [
    "openpose",
    "depth",
    "softedge",
    "scribble",
    "canny",
    "lineart",
    "mlsd",
    "normal_map",
    "segmentation",
    "tile",
    "inpaint",
]
preprocessors = [
