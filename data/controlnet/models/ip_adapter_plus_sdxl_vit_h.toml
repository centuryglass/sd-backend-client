id = "ip_adapter_plus_sdxl_vit_h"
label = "IP-Adapter Plus SDXL ViT-H"
summary = "SDXL IP-Adapter that reads the reference image's patch features, staying closer to it than the standard SDXL models."
description = """\
IP-Adapter Plus SDXL uses a reference image as part of the prompt for SDXL and stays closer to it than the \
standard SDXL adapters. h94 describes it as using patch image embeddings from OpenCLIP ViT-H, closer to the \
reference than ip-adapter_sdxl and ip-adapter_sdxl_vit-h. It pairs with the CLIP-ViT-H preprocessor; \
sd-webui-controlnet's older name for it there is ip-adapter_clip_sdxl_plus_vith."""
how_it_works = """\
Plus models read the features of every image patch from the CLIP ViT-H encoder's second-to-last layer instead of \
its single summary vector. A small transformer called a resampler condenses those patches into 16 tokens, which \
the U-Net's added cross-attention weights attend to alongside the text. Patch features keep more of the \
reference's detail than one vector does."""
base_models = ["sdxl"]
adapter = "ip_adapter"
control_types = ["ip_adapter"]
preprocessors = ["ip_adapter_clip_h"]
trainer = "h94 (Tencent AI Lab)"
license = "apache-2.0"
homepage = "https://huggingface.co/h94/IP-Adapter"

strengths = [
    "Closer to the reference than the standard SDXL adapters",
]
weaknesses = []
good_for = [
    "close image variations",
    "carrying a character or object into a new scene",
]

sources = [
