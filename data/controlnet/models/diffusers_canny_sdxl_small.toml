id = "diffusers_canny_sdxl_small"
label = "Diffusers SDXL Canny Small"
summary = "A small SDXL Canny ControlNet from Hugging Face, seven times smaller than the full model."
description = """\
An experimental, small SDXL ControlNet for Canny edges from the diffusers team, seven times smaller than the \
full model at 320 MB in fp16. Its card says it works well on most control images, but for more complex ones the \
bigger checkpoints may do better, and suggests adjusting the conditioning scale and guidance scale."""
how_it_works = """\
A smaller ControlNet, initialized from the SDXL U-Net without distillation and with no attention blocks. It was \
trained on 3 million images from the LAION Aesthetics 6+ subset, batch size 256, for 50,000 steps."""
