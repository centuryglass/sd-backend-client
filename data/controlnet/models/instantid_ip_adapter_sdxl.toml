id = "instantid_ip_adapter_sdxl"
label = "InstantID IP-Adapter"
summary = "The adapter half of InstantID: turns a face embedding into tokens for SDXL and for the InstantID ControlNet."
description = """\
The InstantID IP-Adapter is the first of InstantID's two models. It reads the face embedding from the InstantID \
Face Embedding preprocessor and must sit in the unit right before the InstantID ControlNet. InstantX's tips: \
lower its weight first when colors look oversaturated or the text prompt is ignored.\n\n\
sd-webui-controlnet recognizes it only when its file name contains instant_id, and its announcement says to \
rename ip-adapter.bin to ip-adapter_instant_id_sdxl.bin. Forge and Forge Neo pass its face tokens to every \
ControlNet unit in the generation, not only InstantID's."""
how_it_works = """\
A resampler, a small transformer with 16 learned query tokens, turns InsightFace's 512-number antelopev2 \
embedding into 16 tokens. SDXL's cross-attention layers gain extra weights that attend to them, as in IP-Adapter. \
The same tokens replace the text prompt in the InstantID ControlNet's cross-attention."""
base_models = ["sdxl"]
adapter = "ip_adapter"
control_types = ["ip_adapter"]
preprocessors = ["instant_id_face_embedding"]
trainer = "InstantX"
license = "apache-2.0"
homepage = "https://huggingface.co/InstantX/InstantID"

