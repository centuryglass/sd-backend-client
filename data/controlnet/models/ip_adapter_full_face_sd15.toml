id = "ip_adapter_full_face_sd15"
label = "IP-Adapter Full Face SD1.5"
summary = "An updated SD 1.5 face IP-Adapter that passes every CLIP patch of the face through, for a stronger face likeness."
description = """\
IP-Adapter Full Face SD1.5 is tencent-ailab's updated version of the face adapter, released in November 2023. It \
takes a cropped face as reference, like Plus Face. ComfyUI_IPAdapter_plus describes it as a stronger face model, \
not necessarily better. It pairs with the CLIP-ViT-H preprocessor."""
how_it_works = """\
Like Plus Face, it reads the patch features from the CLIP ViT-H encoder's second-to-last layer. In place of a \
resampler that condenses them into 16 tokens, a small two-layer network maps each patch feature to a token \
directly, so the U-Net's added cross-attention sees all of them."""
base_models = ["sd15"]
adapter = "ip_adapter"
control_types = ["ip_adapter"]
preprocessors = ["ip_adapter_clip_h"]
trainer = "h94 (Tencent AI Lab)"
license = "apache-2.0"
homepage = "https://huggingface.co/h94/IP-Adapter"

strengths = [
    "Stronger face influence than Plus Face",
]
weaknesses = [
    "Stronger is not always better, per ComfyUI_IPAdapter_plus",
]
good_for = [
    "portraits that resemble a reference face",
]

sources = [
    "hf_h94_ip_adapter",
