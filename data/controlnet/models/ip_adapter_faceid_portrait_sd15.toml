id = "ip_adapter_faceid_portrait_sd15"
label = "IP-Adapter FaceID Portrait SD1.5"
summary = "SD 1.5 FaceID adapter for portraits that takes several face photos at once and needs no LoRA; superseded by Portrait 1.1."
description = """\
IP-Adapter FaceID Portrait is FaceID tuned for portrait generation. It accepts several photos of the face, five \
by default in h94's example, and needs no LoRA or ControlNet. It pairs with the IP-Adapter FaceID preprocessor. \
sd-webui-controlnet's tests found it does best with multiple inputs.\n\n\
ComfyUI_IPAdapter_plus marks this first release deprecated in favor of Portrait 1.1. huchenlei also notes that a \
long negative prompt hurts identity preservation."""
how_it_works = """\
It reads only InsightFace's 512-number identity embedding, projected into 16 image prompt tokens for the U-Net's \
added cross-attention weights. It accepts several reference photos, which h94 says improves likeness. There is no \
LoRA and no ControlNet."""
base_models = ["sd15"]
adapter = "ip_adapter"
control_types = ["ip_adapter"]
preprocessors = ["ip_adapter_face_id"]
trainer = "h94 (Tencent AI Lab)"
license = ""
