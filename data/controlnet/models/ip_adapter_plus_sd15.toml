id = "ip_adapter_plus_sd15"
label = "IP-Adapter Plus SD1.5"
summary = "SD 1.5 IP-Adapter that reads the reference image's patch features, so results stay closer to it than with the standard model."
description = """\
IP-Adapter Plus SD1.5 uses a reference image as part of the prompt and stays closer to it than the standard \
model, keeping more of its detail. h94 describes it as using patch image embeddings, closer to the reference \
image than ip-adapter_sd15. ComfyUI_IPAdapter_plus calls it very strong. It pairs with the CLIP-ViT-H \
preprocessor.\n\n\
lllyasviel's sd_control_collection mirrors it as ip-adapter_sd15_plus.pth, the same weights."""
how_it_works = """\
Plus models read the features of every image patch from the CLIP ViT-H encoder's second-to-last layer instead of \
its single summary vector. A small transformer called a resampler condenses those patches into 16 tokens, which \
the U-Net's added cross-attention weights attend to alongside the text. Patch features keep more of the \
reference's detail than one vector does."""
base_models = ["sd15"]
adapter = "ip_adapter"
control_types = ["ip_adapter"]
preprocessors = ["ip_adapter_clip_h"]
trainer = "h94 (Tencent AI Lab)"
license = "apache-2.0"
homepage = "https://huggingface.co/h94/IP-Adapter"

strengths = [
    "Closer to the reference than the standard model",
]
weaknesses = [
    "Very strong influence, per ComfyUI_IPAdapter_plus",
]
good_for = [
    "close image variations",
    "carrying a character or object into a new scene",
]

