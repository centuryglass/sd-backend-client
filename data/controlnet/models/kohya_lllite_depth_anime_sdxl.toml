id = "kohya_lllite_depth_anime_sdxl"
label = "LLLite SDXL Depth Anime"
summary = "kohya-ss's small, experimental ControlNet-LLLite for depth, trained on anime images; about 11 MB."
description = """\
A ControlNet-LLLite model for depth on anime SDXL checkpoints, from kohya-ss, the author of the sd-scripts \
trainer. At about 11 MB it is far smaller than a ControlNet. It was trained on 1,433 generated images from \
kohya's own anime model with MiDaS v3 Large preprocessing.\n\n\
WebUI's ControlNet extension and a ComfyUI custom node support it. lllyasviel's sd_control_collection mirrors it \
as kohya_controllllite_xl_depth_anime."""
how_it_works = """\
ControlNet-LLLite is kohya-ss's lightweight alternative to ControlNet: small conditioning modules attached to \
the SDXL U-Net. Its model card calls the structure highly experimental and subject to change. This model was \
trained on MiDaS depth maps of anime images."""
base_models = ["sdxl"]
adapter = "controlnet_lllite"
control_types = ["depth"]
preprocessors = ["depth_midas"]
trainer = "kohya-ss"
license = "apache-2.0"
homepage = "https://huggingface.co/kohya-ss/controlnet-lllite"

strengths = ["Very small", "Trained for anime checkpoints"]
weaknesses = ["Experimental architecture", "Small training set of 1,433 images"]
good_for = ["anime and illustration"]

sources = ["hf_kohya_ss_controlnet_lllite", "hf_lllyasviel_sd_control_collection"]
research_status = "verified"
