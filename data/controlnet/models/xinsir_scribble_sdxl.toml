id = "xinsir_scribble_sdxl"
label = "Xinsir SDXL Scribble"
summary = "xinsir's SDXL ControlNet for any line type and width: scribbles, Canny, HED, PiDiNet or lineart."
description = """\
An SDXL ControlNet that accepts lines of any type and any width. Its card shows it working from scribble, Canny, \
HED, PiDiNet and lineart maps, and its author describes it as an "anyline, anywidth" model. Simple sketches and \
simple prompts work, and a more precise sketch with a detailed prompt fixes regions that come out wrong.\n\n\
The same file is published as "Canny V2" in xinsir/controlnet-canny-sdxl-1.0. Its author says V2 is the more \
powerful model and generally gives better results from Canny input."""
how_it_works = """\
A ControlNet is a trainable copy of the encoder layers of Stable Diffusion, joined to the frozen original by \
convolution layers that start at zero, so training begins without disturbing the base model. The copy learns to \
read one kind of control map and adds its signal into the main network at every denoising step. It was trained \
on over 10 million captioned images, with control maps made by HED and random thresholds to give many kinds of \
line."""
base_models = ["sdxl"]
adapter = "controlnet"
control_types = ["scribble", "canny"]
preprocessors = ["scribble_hed", "canny", "hed", "pidinet", "lineart_realistic"]
trainer = "xinsir"
license = "apache-2.0"
homepage = "https://huggingface.co/xinsir/controlnet-scribble-sdxl-1.0"

strengths = [
