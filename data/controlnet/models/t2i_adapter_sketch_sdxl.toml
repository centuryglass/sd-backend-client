id = "t2i_adapter_sketch_sdxl"
label = "T2I-Adapter SDXL Sketch"
summary = "TencentARC and Hugging Face SDXL T2I-Adapter for sketches and doodles, trained on PiDiNet edges."
description = """\
An SDXL adapter that turns sketches and doodles, white outlines on black, into images. It was trained with \
PiDiNet edge detection by TencentARC and Hugging Face and released in September 2023. The Doodly demo, which \
turns doodles into realistic images, is built on this model.\n\n\
It replaces TencentARC's first SDXL sketch adapter."""
how_it_works = """\
A T2I-Adapter is a small network, about 77 million parameters, that reads the control map and feeds features \
into a frozen Stable Diffusion model. It runs once per image rather than at every denoising step, so it costs \
far less than a ControlNet. The SDXL adapters were trained from scratch on 3 million high-resolution image and \
caption pairs from LAION-Aesthetics V2, for 20,000 to 35,000 steps at batch size 128."""
base_models = ["sdxl"]
adapter = "t2i_adapter"
control_types = ["scribble"]
preprocessors = ["pidinet"]
trainer = "TencentARC"
license = "apache-2.0"
homepage = "https://huggingface.co/TencentARC/t2i-adapter-sketch-sdxl-1.0"

strengths = ["About 94 percent smaller than an SDXL ControlNet", "Works from hand-drawn doodles"]
weaknesses = []
good_for = ["turning sketches into images"]

