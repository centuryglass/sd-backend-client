id = "latentcat_brightness_sd15"
label = "Brightness"
summary = "ioclab's SD 1.5 ControlNet that follows a grayscale brightness map, to colorize grayscale images or recolor others."
description = """\
ioclab's Brightness ControlNet, now hosted by latentcat, makes a generated image follow a grayscale image's \
brightness. Its card names two uses: colorizing grayscale images and recoloring generated ones. It was trained \
on ioclab's grayscale_image_aesthetic_3M dataset.\n\n\
sd_control_collection mirrors it in fp16 as ioclab_sd15_recolor, and sd-webui-controlnet's SD 1.5 recolor \
example pairs that copy with Recolor Luminance. QR code guides use it as a low-weight second unit beside a QR \
model, to raise local contrast so the code scans without changing the composition much."""
how_it_works = """\
A ControlNet is a trainable copy of the encoder layers of Stable Diffusion, joined to the frozen original by \
convolution layers that start at zero, so training begins without disturbing the base model. It learns to read \
one kind of control image and adds its signal into the main network at every denoising step. This one was \
trained on images paired with their grayscale versions, so it learns to keep a given brightness pattern while \
the prompt sets the colors."""
base_models = ["sd15"]
adapter = "controlnet"
control_types = ["recolor", "qr_code"]
preprocessors = ["recolor_luminance", "recolor_intensity"]
trainer = "ioclab (latentcat)"
license = "creativeml-openrail-m"
homepage = "https://huggingface.co/latentcat/control_v1p_sd15_brightness"

