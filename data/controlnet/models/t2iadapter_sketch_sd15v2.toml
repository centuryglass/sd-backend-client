id = "t2iadapter_sketch_sd15v2"
label = "T2I-Adapter Sketch v2"
summary = "Improved TencentARC T2I-Adapter for sketches on SD1.x, released after the sd14v1 adapter."
description = """\
The second T2I-Adapter for sketches on SD1.x, added on 26 March 2023 in a commit titled "add improved canny, \
sketch, depth models". It turns a white-on-black sketch into a picture at a fraction of a ControlNet's cost."""
how_it_works = """\
A T2I-Adapter is a small network, about 77 million parameters, that reads the control map and feeds features \
into a frozen Stable Diffusion model. It runs once per image rather than at every denoising step, so it costs \
far less than a ControlNet. This adapter takes sketches and sketch-like edge maps."""
base_models = ["sd15"]
adapter = "t2i_adapter"
control_types = ["scribble", "t2i_adapter"]
preprocessors = ["t2ia_sketch_pidi"]
trainer = "TencentARC"
license = ""
homepage = "https://huggingface.co/TencentARC/T2I-Adapter"

strengths = ["Small and fast compared with a ControlNet"]
weaknesses = []
good_for = ["turning sketches into images"]

