id = "animal_openpose_sd15"
label = "Animal Pose ControlNet"
summary = "An SD 1.5 ControlNet that poses four-legged animals from an AP-10K animal skeleton."
description = """\
An SD 1.5 ControlNet for four-legged animals, made by abehonest as a graduate school project and trained on \
skeletons from an RTMPose AP-10K estimator. It reads the colored animal skeleton that the Animal Pose \
preprocessor draws, not OpenPose's human skeleton.\n\n\
The original checkpoint is about 8 GB. huchenlei, a WebUI ControlNet maintainer, pruned it and uploaded the \
copies listed here when WebUI added the preprocessor; comfyui_controlnet_aux's table pairs the preprocessor \
with the fp16 copy. The skeleton has no ears and no tail beyond its root."""
how_it_works = """\
A ControlNet is a trainable copy of the encoder layers of Stable Diffusion, joined to the frozen original by \
convolution layers that start at zero, so training begins without disturbing the base model. The copy learns to \
read one kind of control map and adds its signal into the main network at every denoising step. This one was \
trained in a fork of lllyasviel's ControlNet code on animal skeletons from MMPose's RTMPose AP-10K model."""
base_models = ["sd15"]
adapter = "controlnet"
control_types = ["openpose"]
preprocessors = ["animal_openpose"]
trainer = "abehonest"
license = "apache-2.0"
homepage = "https://huggingface.co/huchenlei/animal_openpose"

strengths = ["The only model here trained on animal skeletons"]
weaknesses = ["The skeleton carries no ears or tail"]
good_for = ["posing four-legged animals"]

sources = [
    "hf_huchenlei_animal_openpose",
    "gh_controlnet_animalpose_readme",
    "sdwebui_cn_animal_openpose_discussion",
    "comfyui_controlnet_aux_readme",
    "paper_controlnet",
    "paper_ap10k",
]
research_status = "verified"
