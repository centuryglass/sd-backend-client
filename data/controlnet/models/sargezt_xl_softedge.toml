id = "sargezt_xl_softedge"
label = "SargeZT SDXL Soft Edge"
summary = "SargeZT's SDXL ControlNet for soft edges, trained on DexiNed edge maps."
description = """\
An SDXL ControlNet trained on soft edge maps from DexiNed preprocessing. No backend ships a DexiNed \
preprocessor; comfyui_controlnet_aux pairs this model with TEED.\n\n\
lllyasviel's sd_control_collection mirrors it in fp16 as sargezt_xl_softedge. SargeZT's own release is fp32."""
how_it_works = """\
A ControlNet is a trainable copy of the encoder layers of Stable Diffusion, joined to the frozen original by \
convolution layers that start at zero, so training begins without disturbing the base model. The copy learns to \
read one kind of control map and adds its signal into the main network at every denoising step. This model was \
trained on DexiNed soft edge maps."""
base_models = ["sdxl"]
adapter = "controlnet"
control_types = ["softedge"]
preprocessors = ["teed"]
trainer = "SargeZT"
license = "creativeml-openrail-m"
homepage = "https://huggingface.co/SargeZT/controlnet-sd-xl-1.0-softedge-dexined"

