id = "pulid_v1_sdxl"
label = "PuLID V1"
summary = "ByteDance's SDXL identity adapter: keeps a person's face from a photo while changing the rest of the image as little as possible."
description = """\
PuLID inserts a person's identity from a face photo into an SDXL generation, aiming to change the rest of the \
image, background, lighting, composition and style, as little as possible compared with the same prompt without \
it. V1 is the paper's model. Its authors still recommend it over V1.1 on the SDXL-Lightning 4-step base model.\n\n\
sd-webui-controlnet loads only huchenlei's fp16 conversion, listed among this record's files, with the PuLID \
preprocessor and the sd-webui-controlnet-evaclip extension. The original pulid_v1.bin keeps PuLID's own weight \
names, which neither WebUI extension reads. huchenlei found PuLID needs a stronger style prompt than InstantID."""
how_it_works = """\
Like FaceID Plus, it reads an InsightFace identity embedding and CLIP features of the face, here from EVA-CLIP on \
a face cut out from its background. These become tokens for extra cross-attention weights in SDXL. In training, a \
fast Lightning branch generates the image with and without the identity, and a contrastive alignment loss keeps \
the two alike apart from the face, while an identity loss checks the face against the photo."""
base_models = ["sdxl"]
adapter = "ip_adapter"
control_types = ["ip_adapter"]
preprocessors = ["ip_adapter_pulid", "facexlib"]
trainer = "guozinan (ByteDance)"
license = "apache-2.0"
homepage = "https://huggingface.co/guozinan/PuLID"

strengths = [
    "Changes the rest of the image little when the identity is added, per its paper",
    "Works on SDXL-Lightning 4-step models",
]
weaknesses = [
    "Needs a separate extension for EVA-CLIP in sd-webui-controlnet",
    "Needs a stronger style prompt than InstantID, per huchenlei",
]
good_for = [
    "putting a person into a generation without changing its style or layout",
]

sources = [
    "hf_guozinan_pulid",
    "gh_pulid",
    "paper_pulid",
    "hf_huchenlei_ipadapter_pulid",
    "sdwebui_cn_pulid_discussion",
    "sdwebui_cn_ipadapter",
    "sdwebui_cn_evaclip",
    "forge_ipadapter",
]
research_status = "verified"
