id = "control_v11f1e_sd15_tile"
label = "ControlNet 1.1 Tile"
summary = "ControlNet 1.1 Tile for SD 1.5: regenerates detail while keeping an image's layout, for upscaling, detail fixes and tiled diffusion."
description = """\
ControlNet 1.1 Tile keeps an image's composition and colors and redraws its detail. Its README describes two \
behaviors: it ignores the details in the control image and generates new ones, and when a tile's content doesn't \
match the prompt it follows the tile's own content. A tile of leaves stays leaves even when the prompt asks for a \
man.\n\n\
That makes it useful for upscaling with tiled scripts such as Ultimate SD Upscale, for fixing blur or bad detail \
left by other upscalers, for changing detail at denoising strength 1, and, its release notes add, for finishing \
drafts painted in color blocks. Its quality flag is experimental. It can shift colors, most often on anime \
images; Tile Color Fix addresses that."""
how_it_works = """\
A ControlNet is a trainable copy of the encoder layers of Stable Diffusion, joined to the frozen original by \
convolution layers that start at zero, so training begins without disturbing the base model. It learns to read \
one kind of control image and adds its signal into the main network at every denoising step. This one reads the \
image itself, at reduced detail, so it learns what the content of each region is and steers generation toward \
it rather than toward the prompt where they disagree."""
base_models = ["sd15"]
adapter = "controlnet"
control_types = ["tile"]
preprocessors = ["tile_resample", "tile_colorfix", "tile_colorfix_sharp"]
trainer = "lllyasviel"
license = "openrail"
