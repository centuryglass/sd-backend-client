id = "control_v11u_sd15_tile"
label = "ControlNet 1.1 Tile (unfinished)"
summary = "The unfinished first release of ControlNet 1.1 Tile, replaced by control_v11f1e_sd15_tile."
description = """\
The first, unfinished release of ControlNet 1.1 Tile. On 25 April 2023 lllyasviel released the finished model, \
control_v11f1e_sd15_tile, removed this one from the ControlNet 1.1 downloads, and asked users with v11u to \
update. Only comfyanonymous's fp16 conversion is still hosted.\n\n\
It is the same kind of model as the finished Tile: it reads the image itself and regenerates its detail. Use \
control_v11f1e_sd15_tile instead."""
how_it_works = """\
A ControlNet is a trainable copy of the encoder layers of Stable Diffusion, joined to the frozen original by \
convolution layers that start at zero, so training begins without disturbing the base model. It learns to read \
one kind of control image and adds its signal into the main network at every denoising step. This one was \
trained to read the image itself, at reduced detail. The "u" in its name marks it unfinished under ControlNet \
1.1's naming rules."""
