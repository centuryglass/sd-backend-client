id = "noobai_inpaint_sdxl"
label = "NoobAI Inpainting"
summary = "Wenaka's SDXL inpainting and outpainting ControlNet, trained on NoobAI XL; masked areas go in as black."
description = """\
NoobAI Inpainting is an SDXL ControlNet for inpainting and outpainting, trained by Wenaka on NoobAI XL's \
epsilon-prediction 1.0 release with a dataset of 110,000 images. Its control image is the masked image, and the \
Forge family's Inpaint NoobAI preprocessor makes it by painting the masked area black. Acly's fp16 copy \
describes it as an inpainting ControlNet for NoobAI, Illustrious and SDXL.\n\n\
This is the full release. An earlier SFW release, trained on a 90% SFW dataset, is a separate network. Forge Neo \
recommends a denoising strength of 0.9 or more with it."""
how_it_works = """\
A ControlNet is a trainable copy of the encoder layers of Stable Diffusion, joined to the frozen original by \
convolution layers that start at zero, so training begins without disturbing the base model. It learns to read \
one kind of control image and adds its signal into the main network at every denoising step. This one reads the \
image with its masked area blacked out and guides generation to fill it consistently with the rest."""
base_models = ["sdxl"]
adapter = "controlnet"
control_types = ["inpaint"]
preprocessors = ["inpaint_noobai"]
trainer = "Wenaka"
