id = "sparsectrl_rgb_sd15"
label = "SparseCtrl RGB"
summary = "AnimateDiff v3 SparseCtrl encoder that guides an animation from a few RGB images placed on chosen frames."
description = """\
SparseCtrl controls AnimateDiff animations from a few condition images instead of one per frame. This encoder \
takes RGB images. It was released with AnimateDiff v3 for SD 1.5, and its paper names keyframe animation and \
interpolation among its applications. AnimateDiff's demos use it to animate a single image.\n\n\
In sd-webui-controlnet it takes the image directly, with no preprocessor. The extension applies the control images to frames chosen in the AnimateDiff batch settings, \
the first frame by default, and leaves the others free. It is useful only with AnimateDiff. Of the WebUI \
backends, only sd-webui-controlnet has a SparseCtrl type."""
how_it_works = """\
A SparseCtrl encoder is shaped like a ControlNet but sees only the condition, not the noisy frames: its paper \
adds a condition encoder to a text-to-video model and leaves that model untouched. Each frame's condition is \
paired with a mask marking whether it has one, and motion modules inside the encoder spread the guidance from \
conditioned frames to the rest. This one reads its keyframes as ordinary images, which the backend encodes with the VAE first."""
