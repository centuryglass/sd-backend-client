id = "pulid_v1_1_sdxl"
label = "PuLID V1.1"
summary = "PuLID V1.1 for SDXL: better editability, naturalness and community model support than V1; no WebUI extension loads it."
description = """\
PuLID V1.1 is the October 2024 release of ByteDance's SDXL identity adapter. Its authors report stronger editing \
of style, viewpoint, expression and lighting, better compatibility with community models such as Juggernaut-XL \
and RealVisXL, more natural faces and slightly better likeness. They recommend V1 instead on the SDXL-Lightning \
4-step model.\n\n\
Neither WebUI ControlNet extension loads it. Its identity encoder differs from V1's, its weights keep PuLID's own \
names, and sd-webui-controlnet's PuLID support covers only the converted V1 file. It runs in PuLID's own code."""
how_it_works = """\
Like V1, it reads an InsightFace identity embedding and EVA-CLIP features of the face and turns them into tokens \
for extra cross-attention weights in SDXL. Its identity encoder is a different design from V1's, built around \
learned query tokens."""
base_models = ["sdxl"]
