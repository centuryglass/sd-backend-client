id = "kohya_lllite_blur_anime_beta_sdxl"
label = "LLLite SDXL Blur Anime Beta"
summary = "Beta of kohya-ss's ControlNet-LLLite blur model for anime SDXL, which redraws a blurred image with new detail."
description = """\
The beta release of kohya-ss's ControlNet-LLLite blur model for anime images. Like the finished blur models, it \
takes a blurred image and generates a sharp one with the same layout and colors, as a Tile model does. Its card \
lists it under the models trained on kohya-ss's custom anime SDXL model and says only that it is a beta.\n\n\
Its file, about 22 MB, is half the size of the later blur models', with the smaller conditioning and module \
dimensions its name encodes. The card recommends Gaussian blur for the blur models."""
how_it_works = """\
ControlNet-LLLite is kohya-ss's lightweight alternative to ControlNet: small conditioning modules attached to \
the SDXL U-Net. Its model card calls the structure highly experimental and subject to change. This model's training \
data is not described."""
