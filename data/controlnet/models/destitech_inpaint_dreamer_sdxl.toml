id = "destitech_inpaint_dreamer_sdxl"
label = "Inpaint Dreamer"
summary = "destitech's early SDXL ControlNet for inpainting and outpainting; areas to fill are painted solid white."
description = """\
Inpaint Dreamer is destitech's SDXL ControlNet for inpainting and outpainting. Its card calls this first release \
an early alpha, made while learning about ControlNet. The image goes in as the control image in a txt2img \
pipeline at denoising 1.0, with the areas to fill painted solid white. Depending on the prompt, the rest of the \
image may be kept or changed more or less.\n\n\
None of the backends' inpaint preprocessors paints the mask white, so the control image is prepared by hand. \
Civitai's ControlNetXL collection carries this release as destitech-inpaint; V2 followed in the same repo."""
how_it_works = """\
A ControlNet is a trainable copy of the encoder layers of Stable Diffusion, joined to the frozen original by \
convolution layers that start at zero, so training begins without disturbing the base model. It learns to read \
one kind of control image and adds its signal into the main network at every denoising step. This one reads an \
image with its missing areas in solid white and guides generation to fill them."""
base_models = ["sdxl"]
adapter = "controlnet"
control_types = ["inpaint"]
preprocessors = []
trainer = "destitech"
license = "openrail"
homepage = "https://huggingface.co/destitech/controlnet-inpaint-dreamer-sdxl"

strengths = ["Outpainting as well as inpainting, per its card"]
weaknesses = ["Early alpha, per its card", "Needs a hand-made control image with white fill areas"]
good_for = ["outpainting", "inpainting"]

