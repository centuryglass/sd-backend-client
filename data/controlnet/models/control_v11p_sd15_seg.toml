id = "control_v11p_sd15_seg"
label = "ControlNet 1.1 Segmentation"
summary = "ControlNet 1.1 segmentation model for SD 1.5; reads both ADE20K and COCO class-color maps."
description = """\
The ControlNet 1.1 segmentation model. It was trained on both COCO and ADE20K, so it reads either palette: \
about 150 ADE20K colors, as 1.0 did, plus another 182 colors from COCO. It was resumed from Segmentation 1.0, \
and its README says all previous inputs should still work.\n\n\
The README lists OneFormer ADE20K, OneFormer COCO and UniFormer ADE20K as acceptable preprocessors, along with \
manually created masks. Its tests show a house generated from an ADE20K map and from a COCO map."""
how_it_works = """\
A ControlNet is a trainable copy of the encoder layers of Stable Diffusion, joined to the frozen original by \
convolution layers that start at zero, so training begins without disturbing the base model. The copy learns to \
read one kind of control map and adds its signal into the main network at every denoising step. This model was \
trained on images paired with ADE20K and COCO segmentation maps. Its README notes that recognizing which \
palette a map uses is trivial for the ControlNet encoder, and that training on both improved results."""
base_models = ["sd15"]
adapter = "controlnet"
control_types = ["segmentation"]
preprocessors = ["seg_ofade20k", "seg_ofcoco", "seg_ufade20k"]
trainer = "lllyasviel"
license = "openrail"
homepage = "https://huggingface.co/lllyasviel/ControlNet-v1-1"

strengths = [
