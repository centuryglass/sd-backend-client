id = "kohya_lllite_depth_sdxl"
label = "LLLite SDXL Depth"
summary = "kohya-ss's small, experimental SDXL ControlNet-LLLite for depth, about 46 MB."
description = """\
A ControlNet-LLLite model for depth on SDXL base, from kohya-ss, the author of the sd-scripts trainer. At about \
46 MB it is far smaller than a ControlNet. It was trained on 3,919 generated images with MiDaS v3 Large \
preprocessing. The _500-1000 in its file name means it is meant to control only the first half of the sampling \
steps.\n\n\
WebUI's ControlNet extension and a ComfyUI custom node support it. lllyasviel's sd_control_collection mirrors it \
as kohya_controllllite_xl_depth."""
how_it_works = """\
ControlNet-LLLite is kohya-ss's lightweight alternative to ControlNet: small conditioning modules attached to \
the SDXL U-Net. Its model card calls the structure highly experimental and subject to change. This model was \
trained on MiDaS depth maps."""
base_models = ["sdxl"]
adapter = "controlnet_lllite"
control_types = ["depth"]
preprocessors = ["depth_midas"]
trainer = "kohya-ss"
license = "apache-2.0"
homepage = "https://huggingface.co/kohya-ss/controlnet-lllite"

strengths = ["Very small"]
weaknesses = ["Experimental architecture", "Small training set of 3,919 images"]
good_for = []

sources = ["hf_kohya_ss_controlnet_lllite", "hf_lllyasviel_sd_control_collection"]
research_status = "verified"
