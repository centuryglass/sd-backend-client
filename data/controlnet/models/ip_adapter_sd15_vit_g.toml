id = "ip_adapter_sd15_vit_g"
label = "IP-Adapter SD1.5 ViT-G"
summary = "An SD 1.5 IP-Adapter trained on the larger CLIP ViT-bigG image encoder instead of ViT-H."
description = """\
IP-Adapter SD1.5 ViT-G is the standard SD 1.5 adapter trained with the OpenCLIP ViT-bigG/14 image encoder. It \
must be paired with the CLIP-ViT-bigG preprocessor, not CLIP-ViT-H. ComfyUI_IPAdapter_plus describes it as a base \
model that requires the bigG encoder.\n\n\
The bigG encoder is about 3.7 GB against ViT-H's 2.5 GB. For SDXL, tencent-ailab found no significant difference \
between the two encoders."""
how_it_works = """\
The CLIP ViT-bigG image encoder reduces the reference to a single embedding, which a small projection turns into \
four tokens. The U-Net's cross-attention layers gain extra key and value weights that attend to those tokens, and \
the result is added to the text attention."""
base_models = ["sd15"]
adapter = "ip_adapter"
control_types = ["ip_adapter"]
preprocessors = ["ip_adapter_clip_g"]
trainer = "h94 (Tencent AI Lab)"
license = "apache-2.0"
homepage = "https://huggingface.co/h94/IP-Adapter"

strengths = [
    "Small: about 46 MB at fp16",
]
weaknesses = [
    "Needs the larger bigG image encoder",
]
good_for = [
    "image variations",
    "combining an image prompt with text",
]

