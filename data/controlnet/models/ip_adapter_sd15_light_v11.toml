id = "ip_adapter_sd15_light_v11"
label = "IP-Adapter SD1.5 Light V1.1"
summary = "Version 1.1 of the light SD 1.5 IP-Adapter, which keeps the reference image's influence low beside the prompt."
description = """\
IP-Adapter Light V1.1 is the later release of the light SD 1.5 adapter, uploaded in March 2024. \
ComfyUI_IPAdapter_plus lists it as its light impact model and marks the first Light release deprecated. It pairs \
with the CLIP-ViT-H preprocessor and has the same file size and shape as the standard model.\n\n\
h94 hasn't published notes on what changed from the first Light release."""
how_it_works = """\
The CLIP ViT-H image encoder reduces the reference to a single embedding, one vector for the whole image. A small \
projection turns it into four tokens shaped like prompt tokens. Every cross-attention layer of the U-Net gets a \
second set of key and value weights that attend to those tokens, and the result is added to the text attention. \
The base model's own weights stay unchanged."""
base_models = ["sd15"]
adapter = "ip_adapter"
control_types = ["ip_adapter"]
preprocessors = ["ip_adapter_clip_h"]
trainer = "h94 (Tencent AI Lab)"
license = "apache-2.0"
homepage = "https://huggingface.co/h94/IP-Adapter"

strengths = [
    "Light influence that leaves the text prompt in charge",
]
weaknesses = []
good_for = [
    "light image guidance under a detailed prompt",
]

