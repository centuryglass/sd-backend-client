id = "control_v11e_sd15_ip2p"
label = "ControlNet 1.1 Instruct Pix2Pix"
summary = "ControlNet 1.1 for SD 1.5 that edits an image by instruction, such as \"make it winter\", with any SD 1.5 base model."
description = """\
ControlNet 1.1 Instruct Pix2Pix edits the control image by following the prompt as an instruction, such as \
"make it into winter", while keeping the picture recognizable. It was trained on the InstructPix2Pix dataset, \
with half instruction prompts and half plain description prompts, so either kind works.\n\n\
Its README notes two differences from the original InstructPix2Pix model: it applies to any SD 1.5 base model, \
and it needs no separate image guidance scale. Instructions phrased "make it into X" work better than "make Y \
into X". It takes the source image directly, with no preprocessor."""
how_it_works = """\
A ControlNet is a trainable copy of the encoder layers of Stable Diffusion, joined to the frozen original by \
convolution layers that start at zero, so training begins without disturbing the base model. It learns to read \
one kind of control image and adds its signal into the main network at every denoising step. This one was \
trained on InstructPix2Pix's dataset: before-and-after image pairs, with edit instructions, generated with \
GPT-3 and Stable Diffusion."""
