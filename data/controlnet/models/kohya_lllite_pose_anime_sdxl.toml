id = "kohya_lllite_pose_anime_sdxl"
label = "LLLite SDXL Pose Anime"
summary = "kohya-ss's small, experimental SDXL ControlNet-LLLite for poses, trained on anime images; about 46 MB."
description = """\
A ControlNet-LLLite pose model for SDXL from kohya-ss, the author of the sd-scripts trainer. It was trained on \
921 generated images with MMPose preprocessing, on kohya-ss's own anime SDXL checkpoint, not SDXL base.\n\n\
lllyasviel's sd_control_collection mirrors it as kohya_controllllite_xl_openpose_anime, an fp16 copy of the bf16 \
original with the same values."""
how_it_works = """\
ControlNet-LLLite is kohya-ss's lightweight alternative to ControlNet: small conditioning modules attached to \
the SDXL U-Net. Its model card calls the structure highly experimental and subject to change. This model was trained on \
pose maps made with MMPose, a pose toolkit separate from OpenPose."""
base_models = ["sdxl"]
adapter = "controlnet_lllite"
control_types = ["openpose"]
preprocessors = ["openpose"]
trainer = "kohya-ss"
license = "apache-2.0"
homepage = "https://huggingface.co/kohya-ss/controlnet-lllite"

strengths = ["Very small"]
weaknesses = ["Experimental architecture", "Small training set of 921 images", "Trained on an anime checkpoint"]
good_for = ["posing anime characters"]

sources = [
    "hf_kohya_ss_controlnet_lllite",
    "hf_lllyasviel_sd_control_collection",
]
research_status = "drafted"
open_questions = [
    "Find which backend preprocessor matches the MMPose pose maps it was trained on. The card names none.",
]

