id = "control_sd15_hed"
label = "ControlNet 1.0 HED"
summary = "The original SD1.5 ControlNet for HED soft edges, superseded by ControlNet 1.1 Soft Edge."
description = """\
ControlNet 1.0 HED follows soft HED boundary maps. Its README notes that soft HED edges preserve many details, \
making it suitable for recoloring and stylizing, and that without a prompt it tends toward painting-like images \
at lower control strength.\n\n\
ControlNet 1.1 Soft Edge is its successor. The 1.1 README says this model was over-fitted to restore a hidden, \
corrupted grayscale copy of the image inside HED maps rather than follow the boundaries, and that Soft Edge 1.1 \
beats it in nearly every case."""
how_it_works = """\
A ControlNet is a trainable copy of the encoder layers of Stable Diffusion, joined to the frozen original by \
convolution layers that start at zero, so training begins without disturbing the base model. The copy learns to \
read one kind of control map and adds its signal into the main network at every denoising step. This model was \
trained on HED soft edge maps."""
base_models = ["sd15"]
adapter = "controlnet"
control_types = ["softedge"]
preprocessors = ["hed"]
trainer = "lllyasviel"
license = "openrail"
homepage = "https://huggingface.co/lllyasviel/ControlNet"

strengths = ["Keeps many details of the source image"]
weaknesses = [
    "Over-fitted to the hidden grayscale image in HED maps, per the ControlNet 1.1 README",
    "Training-set flaws fixed in ControlNet 1.1",
]
good_for = ["recoloring", "stylizing"]

sources = [
    "hf_lllyasviel_controlnet",
    "cn10_readme",
    "cn11_readme",
    "paper_controlnet",
    "hf_webui_controlnet_modules_safetensors",
    "recorded_fixtures",
]
research_status = "verified"
