id = "ip_adapter_sdxl"
label = "IP-Adapter SDXL"
summary = "The original SDXL IP-Adapter, which reads the reference image with the large CLIP ViT-bigG encoder."
description = """\
IP-Adapter SDXL uses a reference image as part of the prompt for SDXL, from one CLIP embedding of the whole \
image. It is the first SDXL release and the only SDXL adapter that uses the CLIP-ViT-bigG preprocessor. \
tencent-ailab's later SDXL models switched to the smaller ViT-H encoder, finding no significant difference in \
results.\n\n\
lllyasviel's sd_control_collection mirrors it as ip-adapter_xl.pth, the same weights, and sd-webui-controlnet's \
1.1.400 announcement demonstrates that copy."""
how_it_works = """\
The CLIP ViT-bigG image encoder reduces the reference to a single embedding, which a small projection turns into \
four tokens. Each of SDXL's cross-attention layers gains extra key and value weights that attend to those tokens, \
and the result is added to the text attention."""
base_models = ["sdxl"]
adapter = "ip_adapter"
control_types = ["ip_adapter"]
preprocessors = ["ip_adapter_clip_g"]
trainer = "h94 (Tencent AI Lab)"
license = "apache-2.0"
homepage = "https://huggingface.co/h94/IP-Adapter"

strengths = [
    "Works with any SDXL fine-tune and with other ControlNets",
]
weaknesses = [
    "Needs the 3.7 GB bigG image encoder, where the vit-h models need the 2.5 GB ViT-H one",
]
good_for = [
    "image variations",
    "combining an image prompt with text",
]

sources = [
    "hf_h94_ip_adapter",
    "paper_ip_adapter",
    "gh_tencent_ailab_ip_adapter",
    "sdwebui_cn_ipadapter",
    "comfyui_ipadapter_plus_readme",
    "hf_lllyasviel_sd_control_collection",
