id = "thibaud_openpose_xl2"
label = "Thibaud OpenPose XL2"
summary = "An early community SDXL OpenPose ControlNet by thibaud, trained on SDXL base with OpenPose conditioning."
description = """\
An SDXL ControlNet for OpenPose stick figures from thibaud. Its card describes OpenPose (v2) conditioning on \
SDXL base and 15,000 steps on LAION images at up to 768 pixels on their short side, and its example uses \
controlnet_aux's OpenPose detector. The card gives its license as OpenPose's, without naming it.\n\n\
The repo also holds a rank 256 control-LoRA extraction. sd_control_collection's thibaud_xl_openpose files are \
fp16 copies of both, matching tensor for tensor within fp16 rounding. xinsir's SDXL OpenPose card reports a \
lower pose accuracy for it than for xinsir's own model, in xinsir's own test."""
how_it_works = """\
A ControlNet is a trainable copy of the encoder layers of Stable Diffusion, joined to the frozen original by \
convolution layers that start at zero, so training begins without disturbing the base model. The copy learns to \
read one kind of control map and adds its signal into the main network at every denoising step. This one was trained on a single \
A100 at batch size 2 with gradient accumulation over 8 steps, at a constant learning rate of 8e-5, in fp16."""
base_models = ["sdxl"]
adapter = "controlnet"
control_types = ["openpose"]
preprocessors = ["openpose"]
trainer = "thibaud"
license = "other"
homepage = "https://huggingface.co/thibaud/controlnet-openpose-sdxl-1.0"

strengths = ["Comes in a smaller control-LoRA form as well as a full ControlNet"]
weaknesses = ["License deferred to OpenPose's without naming it"]
good_for = ["copying a pose from a photo"]

sources = [
    "hf_thibaud_controlnet_openpose_sdxl_1_0",
    "hf_lllyasviel_sd_control_collection",
    "hf_xinsir_controlnet_openpose_sdxl_1_0",
    "paper_controlnet",
    "gh_openpose_readme",
]
research_status = "verified"
open_questions = []

