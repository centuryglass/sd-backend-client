id = "depth_zoe"
label = "Depth ZoeDepth"
summary = """\
Estimates depth with ZoeDepth and stretches the result so the nearest areas are white and the far ones black."""
description = """\
Depth ZoeDepth draws a grayscale depth map from the ZoeDepth network, white near and black far. ZoeDepth \
predicts metric depth, meaning real distances, built on top of a relative-depth backbone. The preprocessor \
discards the distances and keeps the ordering. It scales depth between its 2nd and 85th percentiles, so the \
nearest 2 percent clips to white and the farthest 15 percent clips to black.\n\n\
The ControlNet 1.1 depth model was trained on ZoeDepth maps among others. Several SDXL models name Zoe as their \
estimator: the diffusers Zoe ControlNet, the T2I-Adapter Zoe adapter and SargeZT's depth model."""
how_it_works = """\
ZoeDepth starts from a network pre-trained to judge relative depth on 12 datasets. A lightweight head then \
adapts it to measured depth using what the paper calls metric bins, which adjust the depth values the head can \
output. The preprocessor's file, ZoeD_M12_N, is a single-head model fine-tuned on NYU Depth v2. The preprocessor \
takes the predicted depth, stretches the 2nd to 85th percentiles to the full range, and inverts it so near is \
white."""
control_types = ["depth"]
effect = "Replaces color and texture with a grayscale map of distance."
output = "Grayscale depth map, white near and black far, with the extremes clipped."
best_input = ""
weak_input = ""
