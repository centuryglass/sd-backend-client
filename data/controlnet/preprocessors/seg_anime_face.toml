[[parameters]]
id = "resolution"
label = "Resolution"
summary = "Size of the image's short side while the preprocessor runs."
names = { webui = "processor_res", forge = "processor_res", comfyui = "resolution" }
type = "int"
default = 512
range = [64, 2048]
effect = """\
In the WebUI the image is scaled so its short side matches this value, then rescaled to a 512-pixel short \
side for the segmenter. ComfyUI fixes it at 512, the size the segmenter was trained on."""
when_to_adjust = "Leave it at 512."

[[parameters]]
id = "remove_background_using_abg"
label = "Remove Background"
summary = "Removes the background with an anime segmentation network before segmenting, and returns a character mask."
names = { comfyui = "remove_background_using_abg" }
type = "bool"
default = true
effect = """\
When on, IS-Net finds the character, the background is filled with white before segmentation, and the \
node's second output is the character mask. When off, the whole image is segmented and the mask is all ones."""
when_to_adjust = """\
Turn it off to segment the whole image, background included."""
