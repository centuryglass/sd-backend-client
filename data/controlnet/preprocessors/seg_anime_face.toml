id = "seg_anime_face"
label = "Anime Face Segmentation"
summary = "Splits an anime character into seven flat color regions: background, hair, eyes, mouth, face, skin and clothes."
description = """\
Anime Face Segmentation paints an anime-style image as seven flat colors: yellow background, blue hair, red \
eyes, white mouth, green face, cyan skin and magenta clothes. It is built for anime characters, not photos or \
scenes, and its palette is its own, unrelated to ADE20K's or COCO's.\n\n\
Its weights come from bdsqlsz's qinglong ControlNet-LLLite release, whose README recommends this segmenter for \
its SDXL anime face segmentation models. Those models sit outside this reference. In ComfyUI the node first \
removes the background with a second network and also returns a character mask."""
how_it_works = """\
The segmenter is a small U-Net, a network that shrinks the image to find what is where and then grows it back \
to full size, with a pretrained MobileNetV2 encoder. It was trained to label each pixel of a 512 by 512 anime \
image with one of seven classes, and each class is painted in a fixed color. ComfyUI's version can run IS-Net, \
a background removal network trained on anime characters, beforehand and fill the background with white."""
control_types = ["segmentation"]
effect = "Replaces the image with seven flat color regions for background, hair, eyes, mouth, face, skin and clothes."
output = "Seven-color map: yellow background, blue hair, red eyes, white mouth, green face, cyan skin, magenta clothes."
best_input = "Anime-style character images."
weak_input = ""
models = []

sources = [
    "recorded_fixtures",
    "sdwebui_cn_legacy_preprocessors",
    "sdwebui_cn_preprocessors",
    "forge_preprocessors",
    "reforge_preprocessors",
