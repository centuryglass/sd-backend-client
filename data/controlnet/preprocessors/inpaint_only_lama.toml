id = "inpaint_only_lama"
label = "Inpaint Only + LaMa"
summary = "Inpaint Only, with the hole first filled by the LaMa inpainting network for cleaner results with fewer stray objects."
description = """\
Inpaint Only + LaMa first fills the masked area with LaMa, a dedicated inpainting network, then lets Stable \
Diffusion refine that fill while keeping the unmasked area unchanged, as Inpaint Only does. Its announcement \
describes results that look like Inpaint Only's but cleaner: less complicated, more consistent, with fewer random \
objects. That suits outpainting, where Resize and Fill extends the canvas, and object removal.\n\n\
It needs a mask. sd-webui-controlnet, Forge, reForge and Forge Neo all have it."""
how_it_works = """\
LaMa is an inpainting network built on fast Fourier convolutions, which let every layer see the whole image. It \
was trained with large masks and handles wide holes and repeating patterns. Here it runs at 256 pixels, and its \
fill is scaled back up and blended into the masked area. That filled image is encoded into latent space and \
mixed into Stable Diffusion's starting noise, so generation begins from LaMa's layout. From there it works as \
Inpaint Only: the ControlNet sees the blanked-out image, and the unmasked area is held to the source."""
control_types = ["inpaint"]
effect = "Fills the masked area with a plain LaMa inpainting, which seeds the generation; the unmasked area stays unchanged."
output = "The source with the masked area filled by LaMa, plus the mask."
best_input = "Object removal and outpainting, where the hole should become background rather than something new."
weak_input = "Masks meant to receive a new object: LaMa's fill favors plain continuation of the surroundings."
models = ["control_v11p_sd15_inpaint"]

