id = "hed_safe"
label = "HED Safe"
summary = "HED soft edges quantized to a few levels, removing hidden image detail for steadier results."
description = """\
HED Safe runs the same network as HED, then flattens the soft map into a few brightness levels. That strips out \
the faint grayscale copy of the source image that plain HED maps carry, which can distract the model and spoil \
results. The lines look slightly posterized.\n\n\
The ControlNet 1.1 README ranks it second for robustness and third for maximum quality among the four soft edge \
preprocessors. In ComfyUI it is the HED node with safe enabled, which is that node's default."""
how_it_works = """\
After HED predicts its soft edge map, every value is snapped down to one of a few flat levels. Subtle gradients, \
where the hidden image lives, vanish, while the boundaries stay. The ControlNet 1.1 Soft Edge model was trained \
with this filter on 75 percent of its maps."""
control_types = ["softedge"]
effect = """\
Quantizes the edge map into a few flat levels, which removes the faint grayscale copy of the source image hidden \
in plain soft edge maps."""
output = "Black image with soft white boundary lines in a few flat levels."
best_input = "Photos and renders."
weak_input = ""
models = ["control_v11p_sd15_softedge"]

sources = [
    "cn11_readme",
    "sdwebui_cn_annotators",
    "recorded_fixtures",
    "sdwebui_cn_legacy_preprocessors",
    "sdwebui_cn_preprocessors",
    "forge_preprocessors",
    "comfyui_controlnet_aux_nodes",
]
research_status = "verified"
open_questions = []

