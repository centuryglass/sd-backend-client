[[parameters]]
id = "resolution"
label = "Resolution"
summary = "Size of the image's short side while the preprocessor runs."
names = { comfyui = "resolution" }
type = "int"
default = 512
range = [64, 2048]
effect = """\
The image is scaled so its short side matches this value, padded to a multiple of 64, and processed at that \
size. Larger values keep finer detail and take longer. ComfyUI accepts up to 16384."""
when_to_adjust = "Raise it toward the generation's short side for finer lines. Lower it for bolder, simpler maps."

[[parameters]]
id = "environment"
label = "Environment"
summary = "Which checkpoint to run: indoor, urban or natural scenes."
names = { comfyui = "environment" }
type = "enum"
default = "indoor"
choices = ["indoor", "urban", "natrual"]
effect = "Loads diffusion_edge_<environment>.pt. ComfyUI spells the third choice \"natrual\"."
when_to_adjust = "Match it to the kind of scene in the image."

[[parameters]]
id = "patch_batch_size"
label = "Patch Batch Size"
summary = "How many image patches are processed at once."
names = { comfyui = "patch_batch_size" }
type = "int"
default = 4
range = [1, 16]
effect = "Higher values run faster and use more VRAM. The map itself does not change."
when_to_adjust = "Raise it if VRAM allows. Lower it on out-of-memory errors."
