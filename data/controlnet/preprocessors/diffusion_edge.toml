id = "diffusion_edge"
label = "DiffusionEdge"
summary = "Finds crisp, thin edges with a diffusion model; slow, with a choice of indoor, urban or natural."
description = """\
DiffusionEdge, available in ComfyUI only, draws thin, crisp edges using a diffusion model, the same family of \
network as Stable Diffusion itself. Its authors built it because learned edge detectors struggle to give edge \
maps that are both correct and crisp.\n\n\
Pick the checkpoint that matches the scene: indoor, urban or natural. Each is a 1.2 GB download. It is slower \
and heavier than the other edge preprocessors; a larger patch batch size speeds it up at the cost of VRAM."""
how_it_works = """\
Starting from noise, a diffusion model refines its guess of the edge map over several steps, guided by the input \
image. It works in a compressed latent space to save compute. The image is processed in patches, several at a \
time."""
control_types = ["lineart", "softedge"]
effect = "Keeps object edges as thin, crisp lines."
output = "Black image with thin white edge lines."
best_input = "Photos of the scene type its checkpoint names."
weak_input = ""
models = []

sources = [
    "paper_diffusion_edge",
    "comfyui_controlnet_aux_readme",
    "recorded_fixtures",
    "comfyui_controlnet_aux_nodes",
]
research_status = "drafted"
open_questions = [
    "Find which datasets the indoor, urban and natural checkpoints were trained on, and whether any control model was trained on DiffusionEdge maps.",
]

[names]
webui = []
forge = []
comfyui = ["DiffusionEdge_Preprocessor"]

[hardware]
device = "gpu_preferred"
vram = "grows with patch_batch_size"
speed = "slow: a multi-step diffusion model"

