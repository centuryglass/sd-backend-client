id = "normal_metric3d"
label = "Metric3D Normal"
summary = "Estimates a surface normal map with Metric3D v2, the same models as Metric3D Depth."
description = """\
Metric3D Normal draws each surface's facing direction as a color map, from the same Metric3D v2 networks that \
produce its depth map. Its README says the normal output exists for the ViT models, which are the three ComfyUI \
offers. The node inverts the normal map's values before returning it, with a code comment saying ControlNet uses \
inverse normals.\n\n\
The comfyui_controlnet_aux table pairs it with the ControlNet 1.1 normal model. It is not available in WebUI or \
Forge."""
how_it_works = """\
Metric3D v2 is a family of networks that predict both metric depth and surface normals. The authors built it \
because labeled normal data is scarce, while depth is strongly related to normals. For depth it moves training \
images into a canonical camera space so cameras with different focal lengths can share one model. The ComfyUI \
node takes the normal output, inverts its values, and returns it as an image."""
control_types = ["normal_map"]
effect = "Replaces color and texture with a color map of the direction each surface faces."
output = "RGB normal map."
best_input = ""
weak_input = ""
models = ["control_v11p_sd15_normalbae"]

sources = [
    "recorded_fixtures",
    "comfyui_controlnet_aux_nodes",
    "paper_metric3d",
    "paper_metric3dv2",
    "gh_metric3d_readme",
    "hf_jugghm_metric3d",
    "comfyui_controlnet_aux_src",
    "comfyui_controlnet_aux_readme",
]
research_status = "drafted"
open_questions = [
    "Confirm that the node's color convention matches the ControlNet 1.1 normal model's: blue front, red left, green top.",
]

