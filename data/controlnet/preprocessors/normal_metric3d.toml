[[parameters]]
id = "backbone"
label = "Backbone"
summary = "Which model size to run."
names = { comfyui = "backbone" }
type = "enum"
default = "vit-small"
choices = ["vit-small", "vit-large", "vit-giant2"]
effect = "Loads metric_depth_<backbone>_800k.pth. The files are 150 MB, 1.6 GB and 5.5 GB."
when_to_adjust = "Raise it for a better normal map if the download and memory are affordable."

[[parameters]]
id = "fx"
label = "Focal Length X"
summary = "The camera's horizontal focal length in pixels."
names = { comfyui = "fx" }
type = "int"
default = 1000
range = [1, 16384]
effect = """\
Metric3D uses the camera focal length to resolve the scale of its metric prediction. The README notes that a \
wrong focal length gives wrong metric results."""
when_to_adjust = "Leave at 1000 unless the true focal length in pixels is known."

[[parameters]]
id = "fy"
label = "Focal Length Y"
summary = "The camera's vertical focal length in pixels."
names = { comfyui = "fy" }
type = "int"
default = 1000
range = [1, 16384]
effect = "The vertical counterpart of Focal Length X."
when_to_adjust = "Set it with Focal Length X."

[[parameters]]
id = "resolution"
label = "Resolution"
summary = "Size of the image's short side while the preprocessor runs."
names = { comfyui = "resolution" }
type = "int"
default = 512
range = [64, 2048]
effect = """\
The image is scaled so its short side matches this value, padded to a multiple of 64, and processed at that \
size. Larger values keep finer detail and take longer. ComfyUI accepts up to 16384."""
when_to_adjust = """\
Raise it toward the generation's short side for finer depth detail. Lower it for a smoother, simpler map."""
