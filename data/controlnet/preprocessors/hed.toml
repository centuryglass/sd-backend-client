id = "hed"
label = "HED"
summary = "Finds object boundaries with a neural network and draws them as soft, graded lines."
description = """\
HED draws the boundaries a person would trace, as soft white lines that fade with confidence, rather than every \
change in contrast. It keeps shapes and their relative weight, which ControlNet 1.0 described as suitable for \
recoloring and stylizing.\n\n\
Its maps tend to hide a faint grayscale copy of the source image, which a model can latch onto. HED Safe removes \
it. The ControlNet 1.1 README ranks plain HED highest for maximum result quality and lowest for robustness among \
the four soft edge preprocessors."""
how_it_works = """\
HED, holistically-nested edge detection, is a convolutional network trained on photos that people outlined by \
hand. It looks at the image at five scales, predicts a boundary map at each, and combines them. The version here \
is lllyasviel's retrained, Apache-licensed model, which gives smoother edges than the original and takes RGB \
input."""
control_types = ["softedge"]
effect = "Keeps object boundaries as soft graded lines; drops most texture and noise."
output = "Black image with soft white boundary lines."
best_input = "Photos and renders."
weak_input = ""
models = ["control_sd15_hed", "control_v11p_sd15_softedge", "xinsir_scribble_sdxl"]

sources = [
    "paper_hed",
    "cn11_readme",
    "sdwebui_cn_annotators",
    "comfyui_controlnet_aux_readme",
    "recorded_fixtures",
    "sdwebui_cn_legacy_preprocessors",
    "sdwebui_cn_preprocessors",
    "forge_preprocessors",
    "comfyui_controlnet_aux_nodes",
]
research_status = "verified"
open_questions = []

[names]
webui = ["hed", "softedge_hed"]
forge = ["softedge_hed"]
comfyui = ["HEDPreprocessor"]

[name_parameters]
comfyui = { safe = "disable" }

[hardware]
device = "gpu_preferred"

[[hardware.files]]
filename = "ControlNetHED.pth"
size_bytes = 29444406
sha256 = "5ca93762ffd68a29fee1af9d495bf6aab80ae86f08905fb35472a083a4c7a8fa"
source_url = "https://huggingface.co/lllyasviel/Annotators/resolve/982e7edaec38759d914a963c48c4726685de7d96/ControlNetHED.pth"

[[parameters]]
id = "resolution"
label = "Resolution"
summary = "Size of the image's short side while the preprocessor runs."
names = { webui = "processor_res", forge = "processor_res", comfyui = "resolution" }
type = "int"
default = 512
range = [64, 2048]
effect = """\
The image is scaled so its short side matches this value, padded to a multiple of 64, and processed at that \
size. Larger values keep finer detail and take longer. ComfyUI accepts up to 16384."""
when_to_adjust = "Raise it toward the generation's short side for finer lines. Lower it for bolder, simpler maps."
