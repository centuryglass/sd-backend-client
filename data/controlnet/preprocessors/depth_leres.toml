id = "depth_leres"
label = "Depth LeReS"
summary = "Estimates relative depth with LeReS and offers sliders that flatten the nearest and farthest parts."
description = """\
Depth LeReS draws a grayscale depth map, white near and black far, with the LeReS network, which was built to \
recover correct 3D scene shape from one photo. Two sliders post-process the map. Remove Near sets the closest \
part of the range to pure white, and Remove Background sets the farthest part to pure black. Both leave the \
middle untouched.\n\n\
The ControlNet 1.1 depth model lists LeReS among the estimators it was trained on. The preprocessor downloads \
two files, 530 MB and 318 MB. The second serves only the boost option, which is the separate LeReS++ \
preprocessor."""
how_it_works = """\
LeReS predicts depth with a neural network trained on a mix of datasets. Its paper adds two training losses for \
mixed data: one normalizes errors within each image, and the other is a geometry loss on surface normals. The \
paper's full pipeline also estimates the missing depth shift and focal length to rebuild true 3D shape, but the \
preprocessor runs the depth network alone. Output is stretched to the full gray range and inverted so near is \
white."""
control_types = ["depth"]
effect = "Replaces color and texture with a grayscale map of relative distance, optionally flattened at both ends."
output = "Grayscale depth map, white near and black far."
best_input = ""
weak_input = ""
models = ["control_v11f1p_sd15_depth", "t2iadapter_depth_sd14v1", "t2iadapter_depth_sd15v2"]

sources = [
    "recorded_fixtures",
    "sdwebui_cn_legacy_preprocessors",
    "sdwebui_cn_preprocessors",
    "forge_preprocessors",
    "comfyui_controlnet_aux_nodes",
