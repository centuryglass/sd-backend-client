[[parameters]]
id = "resolution"
label = "Resolution"
summary = "Size of the image's short side while the preprocessor runs."
names = { webui = "processor_res", forge = "processor_res", comfyui = "resolution" }
type = "int"
default = 512
range = [64, 2048]
effect = """\
The image is scaled so its short side matches this value, padded to a multiple of 64, and processed at that \
size. Larger values keep finer detail and take longer. ComfyUI accepts up to 16384."""
when_to_adjust = """\
Raise it toward the generation's short side for finer depth detail. Lower it for a smoother, simpler map."""

[[parameters]]
id = "remove_near"
label = "Remove Near %"
summary = "Flattens the nearest part of the depth range to pure white."
names = { webui = "threshold_a", forge = "threshold_a", comfyui = "rm_nearest" }
type = "float"
default = 0.0
range = [0.0, 100.0]
effect = """\
Pixels in the nearest given percent of the map before inversion are all set to the same white. Zero leaves the \
map unchanged."""
when_to_adjust = "Raise it to stop a very close object from spreading into fine gradations of near depth."

[[parameters]]
id = "remove_background"
label = "Remove Background %"
summary = "Flattens the farthest part of the depth range to pure black."
names = { webui = "threshold_b", forge = "threshold_b", comfyui = "rm_background" }
type = "float"
default = 0.0
range = [0.0, 100.0]
effect = """\
Pixels in the farthest given percent of the map are all set to black, which removes background structure from \
the control image. Zero leaves the map unchanged."""
when_to_adjust = "Raise it to make the background free for the prompt to fill."
