id = "mobile_sam"
label = "MobileSAM"
summary = "Splits an image into every object and region Segment Anything finds, each filled with a random color."
description = """\
MobileSAM finds every distinct object and region in an image, without naming them, and fills each one with a \
random flat color. Large regions are drawn first and smaller ones on top. Areas no mask covers stay black.\n\n\
Unlike the OneFormer and UniFormer preprocessors, the colors carry no class: a sky and a wall can get any \
color. sd-webui-controlnet seeds them from the generation seed, so a run repeats with the same seed. The SD 1.5 \
segmentation ControlNets learned fixed class colors, and no model in this reference lists MobileSAM as a \
preprocessor. sd-webui-controlnet files it under Segmentation, and ComfyUI under its other preprocessors."""
how_it_works = """\
Segment Anything (SAM) is a network trained on over a billion masks to cut out whatever object a \
prompt points at. MobileSAM keeps SAM's pipeline and replaces its 632-million-parameter image encoder with a \
5-million-parameter TinyViT, trained to imitate the original. Here it runs in automatic mode: it prompts \
itself with a 32 by 32 grid of points across the image, keeps the masks it is confident in, and paints each \
one a random color."""
control_types = ["segmentation"]
effect = "Replaces the image with flat regions in random colors, one per object or region found, with black where no mask falls."
output = "Flat regions in random colors on black, with no class meaning."
best_input = ""
weak_input = ""
