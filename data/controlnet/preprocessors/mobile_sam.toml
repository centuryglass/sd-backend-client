id = "resolution"
label = "Resolution"
summary = "Size of the image's short side while the preprocessor runs."
names = { webui = "processor_res", comfyui = "resolution" }
type = "int"
default = 512
range = [64, 2048]
effect = """\
The image is scaled so its short side matches this value, padded to a multiple of 64, and segmented. The \
returned map has that size. ComfyUI accepts up to 16384."""
when_to_adjust = "Match it to the generation's short side to avoid rescaling the map later."
