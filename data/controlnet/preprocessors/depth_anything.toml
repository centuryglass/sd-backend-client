id = "depth_anything"
label = "Depth Anything"
summary = "Estimates relative depth with Depth Anything V1, a model trained on about 62 million unlabeled images."
description = """\
Depth Anything V1 draws a grayscale depth map, white near and black far, with a model its authors trained for \
robust results on any kind of image, from photos to artwork. It comes in three sizes. WebUI and Forge always use \
the large one; ComfyUI lets you pick large, base or small, and the smaller ones are much lighter downloads.\n\n\
The authors also trained a depth ControlNet on this estimator's maps, which they say gives more precise results \
than the earlier MiDaS-based ControlNet. See the Depth Anything ControlNet model record."""
how_it_works = """\
Depth Anything trains one depth network on labeled images plus about 62 million unlabeled ones, using a data \
engine that labels the unlabeled images automatically. Two choices make that extra data useful. The network \
trains on strongly augmented versions of each image, which is a harder task, and an auxiliary objective makes it \
inherit the scene knowledge of a pre-trained vision encoder. The output is relative depth, which the \
preprocessor stretches to the full gray range."""
control_types = ["depth"]
effect = "Replaces color and texture with a grayscale map of relative distance."
output = "Grayscale depth map, white near and black far, stretched to the full 0-255 range."
best_input = "Photos and other images of any kind; the model was built for robust results on any image."
weak_input = ""
models = ["depth_anything_controlnet_sd15"]

sources = [
    "recorded_fixtures",
    "sdwebui_cn_legacy_preprocessors",
    "sdwebui_cn_preprocessors",
    "forge_preprocessors",
    "comfyui_controlnet_aux_nodes",
    "paper_depth_anything",
    "gh_depth_anything_readme",
    "gh_depth_anything_controlnet_readme",
    "hf_liheyoung_depth_anything_space",
    "comfyui_controlnet_aux_readme",
    "comfyui_controlnet_aux_src",
    "sdwebui_cn_annotators",
]
research_status = "drafted"
open_questions = [
    "Confirm that brighter means nearer in the output, from a run or a source that says so.",
]

