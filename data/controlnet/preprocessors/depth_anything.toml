[[parameters]]
id = "checkpoint"
label = "Checkpoint"
summary = "Which model size to run: large, base or small."
names = { comfyui = "ckpt_name" }
type = "enum"
default = "depth_anything_vitl14.pth"
choices = ["depth_anything_vitl14.pth", "depth_anything_vitb14.pth", "depth_anything_vits14.pth"]
effect = "Loads the named file. WebUI and Forge always load the large one."
when_to_adjust = "Pick a smaller checkpoint to save time and memory."

[[parameters]]
id = "resolution"
label = "Resolution"
summary = "Size of the image's short side while the preprocessor runs."
names = { comfyui = "resolution" }
type = "int"
default = 512
range = [64, 2048]
effect = """\
The image is scaled so its short side matches this value, padded to a multiple of 64, and processed at that \
size. Larger values keep finer detail and take longer. ComfyUI accepts up to 16384. WebUI and Forge show no \
resolution slider for this preprocessor."""
when_to_adjust = """\
Raise it toward the generation's short side for finer depth detail. Lower it for a smoother, simpler map."""
