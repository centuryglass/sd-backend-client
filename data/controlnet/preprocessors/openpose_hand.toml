id = "openpose_hand"
label = "OpenPose Hand"
summary = "Draws each person's body skeleton plus 21 points per hand, to guide hand and finger placement."
description = """\
OpenPose Hand draws the body stick figure plus each hand: 21 points per hand, joined by lines that cycle \
through the colors of the rainbow, with blue dots at the joints. It gives the model finger positions as well \
as the body pose.\n\n\
The ControlNet 1.1 OpenPose model was trained to accept body and hand together. Hands are only searched for \
next to a detected body's wrists, so a hand alone in the frame is not found. DWPose's announcement shows the \
OpenPose hand pass missing a hand that DWPose finds."""
how_it_works = """\
OpenPose is a neural network from Carnegie Mellon that finds people bottom-up: it marks likely joints across \
the whole image, plus part affinity fields, which point along each limb, and uses them to link joints into one \
skeleton per person. The preprocessor uses a PyTorch port of it. Hands and face are a second pass: for each \
body found, it crops around the wrists and head and runs a separate hand or face network on each crop. That \
is why hand and face points only appear on a person whose body was detected."""
control_types = ["openpose"]
effect = "Replaces the image with stick figures of each person's body and hands on black."
output = "Colored stick figures on black: 18 body points and 21 points per hand."
best_input = ""
weak_input = "Hands with no detectable arm, since hands are searched for only next to a body's wrists."
models = [
    "control_v11p_sd15_openpose",
]

sources = [
    "recorded_fixtures",
    "sdwebui_cn_legacy_preprocessors",
    "sdwebui_cn_preprocessors",
    "forge_preprocessors",
    "reforge_preprocessors",
    "comfyui_controlnet_aux_nodes",
    "sdwebui_cn_annotators",
    "comfyui_controlnet_aux_src",
    "comfyui_controlnet_aux_readme",
    "hf_lllyasviel_annotators",
    "paper_openpose",
    "gh_openpose_readme",
    "cn11_readme",
    "sdwebui_cn_dwpose_discussion",
]
research_status = "verified"
open_questions = []

