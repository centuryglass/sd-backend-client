id = "ip_adapter_pulid"
label = "PuLID"
summary = "Reads a face with InsightFace, masks it with facexlib and encodes it with EVA-CLIP, for the PuLID models; sd-webui-controlnet only."
description = """\
The PuLID preprocessor prepares a face photo for the PuLID model. It combines an InsightFace identity embedding \
with EVA-CLIP features of the face alone, cut out from its background by facexlib. Its preview shows that cut-out \
face in grayscale on white.\n\n\
Only sd-webui-controlnet has it, and it needs the separate sd-webui-controlnet-evaclip extension installed. \
Together facexlib and EVA-CLIP take about 2 to 3 GB of VRAM, by huchenlei's count, which matters on small cards. \
The unit's PuLID mode switch, Fidelity or Extremely style, changes how the model mixes the face in."""
how_it_works = """\
Three networks run in turn. InsightFace's antelopev2 pack gives the face's identity embedding. facexlib's \
RetinaFace finds and aligns the face to 512 pixels, and its BiSeNet face parser paints the background white, \
keeping the face features in grayscale. EVA02-CLIP-L/14 at 336 pixels then encodes that cut-out, so the CLIP \
features describe the face without the background or the colors of the photo. The model turns both into tokens."""
control_types = ["ip_adapter"]
effect = "Produces face embeddings for the model; the preview is the aligned face in grayscale on a white background."
output = "An InsightFace antelopev2 embedding plus EVA02-CLIP-L/14 features of the masked face."
best_input = "A clear photo of one face; only the face near the center is used."
weak_input = "Images where facexlib finds no face, which fail."
models = ["pulid_v1_sdxl"]

sources = [
    "recorded_fixtures",
    "sdwebui_cn_legacy_preprocessors",
    "sdwebui_cn_preprocessors",
    "sdwebui_cn_legacy_processor",
    "sdwebui_cn_ipadapter",
    "sdwebui_cn_pulid_discussion",
    "sdwebui_cn_evaclip",
    "forge_preprocessors",
