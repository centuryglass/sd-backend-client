[[parameters]]
id = "resolution"
label = "Resolution"
summary = "Size of the image's short side while the preprocessor runs."
names = { webui = "processor_res", forge = "processor_res", comfyui = "resolution" }
type = "int"
default = 512
range = [64, 2048]
effect = """\
The image is scaled so its short side matches this value, padded to a multiple of 64, and searched for people \
at that size. The skeleton is drawn at that size too, so its lines get thinner relative to the image as the \
value rises. ComfyUI accepts up to 16384."""
when_to_adjust = """\
Raise it when small or distant people are missed, at the cost of a slower run. Lower it for thicker lines \
relative to the image."""

[[parameters]]
id = "bbox_detector"
label = "Person Detector"
summary = "Which network finds each person before the pose network places their points."
names = { comfyui = "bbox_detector" }
type = "enum"
default = "yolox_l.onnx"
choices = [
    "yolox_l.torchscript.pt",
    "yolox_l.onnx",
    "yolo_nas_l_fp16.onnx",
    "yolo_nas_m_fp16.onnx",
    "yolo_nas_s_fp16.onnx",
]
effect = """\
The TorchScript file runs on the GPU without extra libraries. The ONNX files need onnxruntime with a GPU \
provider to leave the CPU. The README notes that a TorchScript detector works with an ONNX pose estimator and \
the reverse."""
when_to_adjust = """\
Pick the TorchScript file if DWPose is slow and onnxruntime is not set up for the GPU. The README suggests the \
smaller detectors to cut detection time when the input images are clean."""

[[parameters]]
id = "pose_estimator"
label = "Pose Estimator"
summary = "Which file of the DWPose network to run: TorchScript or ONNX."
names = { comfyui = "pose_estimator" }
type = "enum"
default = "dw-ll_ucoco_384_bs5.torchscript.pt"
choices = ["dw-ll_ucoco_384_bs5.torchscript.pt", "dw-ll_ucoco_384.onnx", "dw-ll_ucoco.onnx"]
effect = """\
The 384 files are the DWPose model WebUI uses, in TorchScript or ONNX form. dw-ll_ucoco.onnx is a version with \
a 192 by 256 pixel input, where the 384 files take 288 by 384. The README says TorchScript is a little slower than ONNX Runtime but needs no extra \
library."""
when_to_adjust = "Choose ONNX only when onnxruntime with a GPU provider is installed."

[[parameters]]
id = "scale_stick_for_xinsr_cn"
label = "Scale Sticks for Xinsir"
summary = "Draws thicker body lines on large images, as xinsir's SDXL OpenPose ControlNet expects."
names = { comfyui = "scale_stick_for_xinsr_cn" }
type = "enum"
default = "disable"
choices = ["disable", "enable"]
effect = """\
When enabled, body limbs are drawn wider as the image's long side grows: normal width below 500 pixels, then \
two to seven times as wide. Hands and face are unchanged."""
when_to_adjust = """\
Enable it for xinsir's SDXL OpenPose model, whose card says its training labels used thicker lines and the \
default lines may give unstable results. Leave it off for other models."""
