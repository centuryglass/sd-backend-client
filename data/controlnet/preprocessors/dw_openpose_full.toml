    "sdwebui_cn_dwpose_discussion",
    "hf_yzd_v_dwpose",
    "hf_hr16_dwpose_torchscript_bs5",
    "hf_hr16_yolox_onnx",
    "hf_hr16_unjit_dwpose",
]
