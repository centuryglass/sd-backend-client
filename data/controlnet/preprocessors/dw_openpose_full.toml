id = "dw_openpose_full"
label = "DWPose"
summary = "Finds body, hands and face with DWPose and draws them as an OpenPose stick figure; more accurate than OpenPose, especially on hands."
description = """\
DWPose draws the same picture as OpenPose Full, a body stick figure with hand and face points for each person, \
but finds the points with a newer whole-body estimator. Its output works with any model trained on OpenPose \
skeletons. The DWPose README says replacing OpenPose with it in ControlNet gives better images, and WebUI's \
announcement says it improves detection accuracy, especially on hands.\n\n\
WebUI and Forge always draw body, hands and face. ComfyUI's node has switches for each, and offers TorchScript \
and ONNX versions of its two networks."""
how_it_works = """\
DWPose works top-down in two steps. A YOLOX detector first draws a box around each person. A pose network then \
reads each box and places 133 points at once: body, feet, hands and face. That network is RTMPose-l, trained by \
distillation: a larger teacher network guided its features and outputs, then a short second stage tuned its \
final layer. The DWPose paper reports it beats its own teacher on the COCO-WholeBody benchmark. The \
preprocessor adds a neck point between the shoulders, pads the 68 face points to OpenPose's 70, and draws \
them in OpenPose's colors and layout."""
control_types = ["openpose"]
effect = "Replaces the image with stick figures of each person's body, hands and face on black."
output = "OpenPose-style colored stick figures on black: 18 body points, 21 per hand and 70 face points per person."
best_input = ""
weak_input = ""
models = [
    "control_sd15_openpose",
    "control_v11p_sd15_openpose",
    "t2iadapter_openpose_sd14v1",
]

sources = [
    "recorded_fixtures",
    "sdwebui_cn_legacy_preprocessors",
    "sdwebui_cn_preprocessors",
    "forge_preprocessors",
    "reforge_preprocessors",
