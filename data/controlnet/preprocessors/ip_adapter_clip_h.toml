id = "ip_adapter_clip_h"
label = "IP-Adapter CLIP-ViT-H"
summary = "Encodes the reference image with OpenCLIP ViT-H/14 for the IP-Adapter models trained on it, which is most of them."
description = """\
CLIP-ViT-H reads an IP-Adapter reference image and passes its CLIP features, not an image, to the model. It \
serves every SD 1.5 IP-Adapter except ViT-G, the SDXL models with vit-h in their names, and the composition \
adapters. sd-webui-controlnet lists it as ip-adapter_clip_h, with the older module names ip-adapter_clip_sd15 and \
ip-adapter_clip_sdxl_plus_vith; Forge, reForge and Forge Neo call it CLIP-ViT-H (IPAdapter).\n\n\
The image is center-cropped to a square, so a subject off center can be lost. sd-webui-controlnet accepts a mask \
that hides part of the image from CLIP. The encoder, about 2.5 GB, downloads on first use."""
how_it_works = """\
CLIP is a pair of networks trained so that matching images and captions land close together, which makes its \
image features a summary of what an image shows and how it looks. The preprocessor resizes the image so its \
shorter side is 224 pixels, crops the center square and runs LAION's OpenCLIP ViT-H/14 image encoder. Standard \
models take its single image embedding; Plus, face and composition models take the features of every image patch \
from the encoder's second-to-last layer."""
control_types = ["ip_adapter"]
effect = "Produces image features rather than a picture; nothing visible to preview."
output = "OpenCLIP ViT-H/14 image embedding and patch features."
best_input = "An image whose subject sits in the center, or a square crop; for the face models, a cropped face."
weak_input = "Wide or tall images with the subject near an edge, which the center crop cuts off."
models = [
    "ip_adapter_sd15",
    "ip_adapter_sd15_light",
    "ip_adapter_plus_sd15",
    "ip_adapter_plus_face_sd15",
    "ip_adapter_full_face_sd15",
    "ip_adapter_sd15_light_v11",
    "ip_adapter_plus_composition_sd15",
    "ip_adapter_sdxl_vit_h",
    "ip_adapter_plus_sdxl_vit_h",
    "ip_adapter_plus_face_sdxl_vit_h",
    "ip_adapter_plus_composition_sdxl",
]

