id = "openpose_full"
label = "OpenPose Full"
summary = "Draws each person's body, hands and face points together, the most detailed OpenPose output."
description = """\
OpenPose Full draws everything OpenPose finds: the body stick figure, 21 points per hand and 70 face points for \
each person. It carries pose, fingers and expression together.\n\n\
It is one of the two choices the ControlNet 1.1 README recommends showing users, with plain OpenPose, and the \
1.1 model was trained to accept it. WebUI and Forge list it first in the OpenPose type, and it matches the \
ComfyUI node's defaults. A WebUI maintainer noted in October 2023 that none of the SDXL ControlNets then \
available supported full OpenPose input."""
how_it_works = """\
OpenPose is a neural network from Carnegie Mellon that finds people bottom-up: it marks likely joints across \
the whole image, plus part affinity fields, which point along each limb, and uses them to link joints into one \
skeleton per person. The preprocessor uses a PyTorch port of it. Hands and face are a second pass: for each \
body found, it crops around the wrists and head and runs a separate hand or face network on each crop. That \
is why hand and face points only appear on a person whose body was detected."""
control_types = ["openpose"]
effect = "Replaces the image with stick figures of each person's body, hands and face on black."
output = "Colored stick figures on black: 18 body points, 21 per hand and 70 face points per person."
best_input = ""
weak_input = "Hands or faces with no detectable body, and faces under 20 pixels across."
models = [
    "control_v11p_sd15_openpose",
]

sources = [
    "recorded_fixtures",
    "sdwebui_cn_legacy_preprocessors",
    "sdwebui_cn_preprocessors",
    "forge_preprocessors",
    "reforge_preprocessors",
    "comfyui_controlnet_aux_nodes",
    "sdwebui_cn_annotators",
    "comfyui_controlnet_aux_src",
    "comfyui_controlnet_aux_readme",
    "hf_lllyasviel_annotators",
    "paper_openpose",
    "gh_openpose_readme",
    "cn11_readme",
    "sdwebui_cn_dwpose_discussion",
]
research_status = "verified"
open_questions = []

[names]
webui = ["openpose_full"]
forge = ["openpose_full"]
comfyui = ["OpenposePreprocessor"]

