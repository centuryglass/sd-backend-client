id = "lineart_anime_denoise"
label = "Lineart Anime Denoise"
summary = "Extracts line art from manga and anime images with a network that reads a grayscale copy."
description = """\
Lineart Anime Denoise, called Manga Lineart in ComfyUI, extracts line art from manga pages and anime \
illustrations. It uses a different network from Lineart Anime and works from a grayscale copy of the image, so \
color plays no part in where it finds lines.\n\n\
comfyui_controlnet_aux pairs it with the ControlNet 1.1 anime lineart model."""
how_it_works = """\
A neural network reads a grayscale copy of the image and predicts where the artist's lines are. Its output is \
inverted into white lines on black."""
control_types = ["lineart"]
effect = "Keeps inked lines; drops color."
output = "Black image with white lines."
best_input = "Manga pages and anime illustrations."
weak_input = ""
models = ["control_v11p_sd15s2_lineart_anime"]

sources = [
    "sdwebui_cn_preprocessors",
    "sdwebui_cn_annotators",
    "comfyui_controlnet_aux_readme",
    "recorded_fixtures",
    "sdwebui_cn_legacy_preprocessors",
    "forge_preprocessors",
    "comfyui_controlnet_aux_nodes",
]
research_status = "drafted"
open_questions = [
    "Find where erika.pth comes from and what it was trained on. The annotator class is named MangaLineExtration, and its bundled LICENSE names the anime face segmentation author.",
    "Find out what the \"denoise\" in the WebUI name refers to, such as screentone or texture removal, and add it to the description if a source confirms it.",
]

[names]
webui = ["lineart_anime_denoise"]
forge = ["lineart_anime_denoise"]
comfyui = ["Manga2Anime_LineArt_Preprocessor"]

[hardware]
device = "gpu_preferred"

[[hardware.files]]
filename = "erika.pth"
size_bytes = 172789563
sha256 = "badbd6baf013cefbd98993307b02cc14a26c770d067416e4fdecc8720b88feeb"
source_url = "https://huggingface.co/lllyasviel/Annotators/resolve/982e7edaec38759d914a963c48c4726685de7d96/erika.pth"

[[parameters]]
id = "resolution"
label = "Resolution"
summary = "Size of the image's short side while the preprocessor runs."
names = { webui = "processor_res", forge = "processor_res", comfyui = "resolution" }
type = "int"
default = 512
range = [64, 2048]
effect = """\
The image is scaled so its short side matches this value, padded to a multiple of 64, and processed at that \
size. Larger values keep finer detail and take longer. ComfyUI accepts up to 16384."""
when_to_adjust = "Raise it toward the generation's short side for finer lines. Lower it for bolder, simpler maps."
