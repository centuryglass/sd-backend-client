[[parameters]]
id = "resolution"
label = "Resolution"
summary = "Size of the image's short side before it goes to the segmenter, and of the map it returns."
names = { webui = "processor_res", forge = "processor_res", comfyui = "resolution" }
type = "int"
default = 512
range = [64, 2048]
effect = """\
The image is scaled so its short side matches this value and padded to a multiple of 64. OneFormer then \
rescales it to a 640-pixel short side internally, so this value mostly sets the size of the returned map and \
how much detail survives the first scaling. sd-webui-controlnet and reForge hide the slider for this \
preprocessor. In sd-webui-controlnet the API value and Pixel Perfect still apply. ComfyUI accepts up to 16384."""
when_to_adjust = """\
Leave it at the default in the WebUI, which has no slider for it. In ComfyUI, match it to the generation's \
short side to avoid rescaling the map later."""
