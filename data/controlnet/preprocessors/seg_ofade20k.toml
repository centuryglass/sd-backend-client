id = "seg_ofade20k"
label = "OneFormer ADE20K"
summary = "Labels every pixel with one of ADE20K's 150 scene classes using OneFormer, and paints each class its palette color."
description = """\
OneFormer ADE20K divides an image into regions of 150 everyday scene classes, such as wall, sky, floor, tree, \
person and car, and fills each region with that class's ADE20K color. The result is a flat color map with no \
edges or shading inside regions.\n\n\
The ControlNet 1.1 README lists it first among the acceptable preprocessors for Segmentation 1.1, and \
sd-webui-controlnet sorts it to the top of the Segmentation list. It draws the same 150-color palette as \
UniFormer, so ControlNet 1.0 Segmentation reads its maps too. Its network is larger than UniFormer's: 219 \
million parameters against 52 million."""
how_it_works = """\
OneFormer is one transformer network trained for three segmentation tasks at once. A task token tells it \
which output to produce: semantic, instance or panoptic. The preprocessor asks for semantic segmentation, \
which gives every pixel a class. This checkpoint uses a Swin-L backbone trained on ADE20K at 640 by 640 \
pixels. Inside the network the image is rescaled so its short side is 640 pixels, and the predicted class of \
each pixel is then painted in ADE20K's palette color."""
control_types = ["segmentation"]
effect = "Replaces the image with flat regions in ADE20K class colors, one region per detected class."
output = "Flat color map in the 150-class ADE20K palette."
best_input = ""
weak_input = ""
models = ["control_v11p_sd15_seg", "control_sd15_seg"]

sources = [
    "recorded_fixtures",
    "sdwebui_cn_legacy_preprocessors",
    "sdwebui_cn_preprocessors",
    "sdwebui_cn_supported_preprocessor",
    "sdwebui_cn_script",
    "forge_preprocessors",
    "reforge_preprocessors",
