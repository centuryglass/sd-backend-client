[[parameters]]
id = "checkpoint"
label = "Checkpoint"
summary = "Which model size to run."
names = { comfyui = "ckpt_name" }
type = "enum"
default = "depth_anything_v2_vitl.pth"
choices = [
    "depth_anything_v2_vitg.pth",
    "depth_anything_v2_vitl.pth",
    "depth_anything_v2_vitb.pth",
    "depth_anything_v2_vits.pth",
]
effect = """\
Loads the named file. WebUI and Forge always load the large model. The vitg option has no released checkpoint."""
when_to_adjust = "Pick small for speed. Pick small, the Apache-2.0 model, when a commercial license matters."

[[parameters]]
id = "resolution"
label = "Resolution"
summary = "Size of the image's short side while the preprocessor runs."
names = { comfyui = "resolution" }
type = "int"
default = 512
range = [64, 2048]
effect = """\
The image is scaled so its short side matches this value, padded to a multiple of 64, and processed at that \
size. Larger values keep finer detail and take longer. ComfyUI accepts up to 16384. WebUI and Forge show no \
resolution slider for this preprocessor."""
when_to_adjust = """\
Raise it toward the generation's short side for finer depth detail. Lower it for a smoother, simpler map."""
