id = "reference_adain"
label = "Reference AdaIN"
summary = "Matches the generation's internal feature statistics to a reference image's, carrying over its overall style."
description = """\
Reference AdaIN carries a reference image's overall color, tone and style into a new image, with no control \
model. In place of Reference Only's attention sharing, it matches the statistics of the U-Net's features to the \
reference's, the idea behind AdaIN style transfer. That transfers look more than content.\n\n\
Its announcement compares the three reference preprocessors on one prompt and seed. Style Fidelity works as in \
Reference Only: it applies in Balanced mode, and on SDXL its value is cubed."""
how_it_works = """\
Adaptive instance normalization, from Huang and Belongie's style transfer paper, aligns the mean and variance of \
content features with those of style features. Here, at every step the reference is noised to the current noise \
level and run through the U-Net, recording the mean and variance of each channel at several blocks. While the \
actual image is denoised, the same blocks rescale their outputs to match. Weight chooses how many blocks take \
part, from the deepest outward. Style Fidelity sets how far the negative prompt's pass is left unmatched."""
control_types = ["reference"]
effect = "Passes the image unchanged; during sampling, shifts the generation's feature statistics toward the reference's."
output = "The reference image, unchanged."
best_input = "An image whose palette, lighting and style should carry over without its subject."
weak_input = ""
models = []

sources = [
    "recorded_fixtures",
    "sdwebui_cn_legacy_preprocessors",
    "sdwebui_cn_preprocessors",
    "sdwebui_cn_hook",
    "forge_preprocessors",
    "reforge_preprocessors",
    "forge_neo_preprocessors",
    "sdwebui_cn_reference_adain_discussion",
    "paper_adain",
]
research_status = "verified"
open_questions = []

[names]
webui = ["reference_adain"]
forge = ["reference_adain", "reference_adain_variant"]
comfyui = []

[hardware]
device = "none"
speed = "fast to prepare; each sampling step runs an extra U-Net pass on the reference"

[[parameters]]
id = "style_fidelity"
label = "Style Fidelity"
summary = "How strongly the reference outweighs the prompt, through guidance."
names = { webui = "threshold_a", forge = "threshold_a" }
type = "float"
default = 0.5
range = [0.0, 1.0]
effect = """\
At 0 both the prompt and negative passes are matched to the reference. At 1 only the prompt pass is, and \
classifier-free guidance amplifies the difference. sd-webui-controlnet uses it only in Balanced mode, and cubes \
it on SDXL."""
when_to_adjust = "Raise it when the style doesn't come through. Lower it when the prompt should have more say."
