id = "scribble_hed"
label = "Scribble HED"
summary = "Turns an image into rough, thick scribble strokes, using HED edges."
description = """\
Scribble HED, called Fake Scribble in ComfyUI and in ControlNet 1.0, makes a scribble from an image so the \
scribble models can use it without anyone drawing. It keeps the main shapes as bold, uneven white strokes and \
drops all detail, which leaves the model free to reinterpret what is inside each shape."""
how_it_works = """\
It runs HED, thins the soft edges down to their ridges, blurs them, and then turns every pixel that is not \
almost black into full white. The result is a set of thick, hard-edged strokes. ControlNet 1.0 introduced it as \
"a simple algorithm to synthesize scribbles from input images"."""
control_types = ["scribble", "sparsectrl"]
effect = "Keeps main shapes as thick strokes; drops all fine detail."
output = "Black image with thick white strokes."
best_input = "Photos and renders with clear main shapes."
weak_input = ""
models = [
    "control_v11p_sd15_scribble",
    "control_sd15_scribble",
    "sparsectrl_scribble_sd15",
    "xinsir_scribble_sdxl",
]

sources = [
    "cn10_readme",
    "cn11_readme",
    "sdwebui_cn_preprocessors",
    "sdwebui_cn_annotators",
    "comfyui_controlnet_aux_readme",
    "recorded_fixtures",
    "sdwebui_cn_legacy_preprocessors",
    "forge_preprocessors",
    "comfyui_controlnet_aux_nodes",
]
research_status = "verified"
open_questions = []

[names]
webui = ["scribble_hed"]
forge = ["scribble_hed"]
comfyui = ["FakeScribblePreprocessor"]

