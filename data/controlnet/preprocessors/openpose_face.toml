id = "openpose_face"
label = "OpenPose Face"
summary = "Draws each person's body skeleton plus 70 face points, to carry head angle and expression."
description = """\
OpenPose Face draws the body stick figure plus a face for each person: 70 white dots tracing the jaw, brows, \
eyes, nose and mouth. It passes on where the face points and roughly how it is set, along with the body \
pose.\n\n\
The ControlNet 1.1 OpenPose model was trained to accept body and face together. The face is only searched for \
around a detected body's head, and faces under 20 pixels across are skipped."""
how_it_works = """\
OpenPose is a neural network from Carnegie Mellon that finds people bottom-up: it marks likely joints across \
the whole image, plus part affinity fields, which point along each limb, and uses them to link joints into one \
skeleton per person. The preprocessor uses a PyTorch port of it. Hands and face are a second pass: for each \
body found, it crops around the wrists and head and runs a separate hand or face network on each crop. That \
is why hand and face points only appear on a person whose body was detected."""
control_types = ["openpose"]
effect = "Replaces the image with stick figures of each person's body, plus face points, on black."
output = "Colored stick figures on black: 18 body points, plus 70 white face points per person."
best_input = ""
weak_input = "Faces under 20 pixels across, and faces with no detectable body below them."
models = [
    "control_v11p_sd15_openpose",
]

sources = [
    "recorded_fixtures",
    "sdwebui_cn_legacy_preprocessors",
    "sdwebui_cn_preprocessors",
    "forge_preprocessors",
    "reforge_preprocessors",
    "comfyui_controlnet_aux_nodes",
    "sdwebui_cn_annotators",
    "comfyui_controlnet_aux_src",
    "comfyui_controlnet_aux_readme",
    "hf_lllyasviel_annotators",
    "paper_openpose",
    "gh_openpose_readme",
    "cn11_readme",
]
research_status = "verified"
open_questions = []

