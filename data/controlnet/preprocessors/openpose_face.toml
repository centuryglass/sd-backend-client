[[parameters]]
id = "resolution"
label = "Resolution"
summary = "Size of the image's short side while the preprocessor runs."
names = { webui = "processor_res", forge = "processor_res", comfyui = "resolution" }
type = "int"
default = 512
range = [64, 2048]
effect = """\
The image is scaled so its short side matches this value, padded to a multiple of 64, and searched for people \
at that size. The skeleton is drawn at that size too, so its lines get thinner relative to the image as the \
value rises. ComfyUI accepts up to 16384."""
when_to_adjust = """\
Raise it when small or distant people are missed, at the cost of a slower run. Lower it for thicker lines \
relative to the image."""

[[parameters]]
id = "scale_stick_for_xinsr_cn"
label = "Scale Sticks for Xinsir"
summary = "Draws thicker body lines on large images, as xinsir's SDXL OpenPose ControlNet expects."
names = { comfyui = "scale_stick_for_xinsr_cn" }
type = "enum"
default = "disable"
choices = ["disable", "enable"]
effect = """\
When enabled, body limbs are drawn wider as the image's long side grows: normal width below 500 pixels, then \
two to seven times as wide. Hands and face are unchanged."""
when_to_adjust = """\
Enable it for xinsir's SDXL OpenPose model, whose card says its training labels used thicker lines and the \
default lines may give unstable results. Leave it off for other models."""
