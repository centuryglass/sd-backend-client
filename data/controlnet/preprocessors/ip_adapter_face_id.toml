id = "ip_adapter_face_id"
label = "IP-Adapter FaceID"
summary = "Reads a face's identity with InsightFace face recognition for the FaceID and FaceID Portrait IP-Adapter models."
description = """\
IP-Adapter FaceID finds the face in the reference photo and passes its identity embedding, not an image, to the \
model. It serves the plain FaceID models and the FaceID Portrait models. Only the largest face is used when the \
photo shows several. Install the insightface Python package first; sd-webui-controlnet ships a prebuilt wheel \
only for Windows.\n\n\
sd-webui-controlnet lists it as ip-adapter_face_id, and reForge keeps that copy as ip-adapter_face_id_variant. \
Forge, reForge and Forge Neo otherwise have no FaceID-only preprocessor: their InsightFace+CLIP-H (IPAdapter) \
drives these models too, and skips the CLIP part for models that don't use it."""
how_it_works = """\
InsightFace's buffalo_l model pack detects the face and runs an ArcFace face recognition network on it. ArcFace \
is trained so that photos of the same person map to nearby points and different people to distant ones, so its \
512-number embedding describes who a face belongs to rather than the lighting, angle or style of the photo. The \
FaceID models project that embedding into image prompt tokens."""
control_types = ["ip_adapter"]
effect = "Produces a face identity embedding rather than a picture; nothing visible to preview."
output = "A 512-dimensional InsightFace (ArcFace) face embedding."
best_input = "A clear, well-lit photo of one face."
weak_input = "Images with no detectable face, which fail; stylized faces InsightFace doesn't detect."
models = [
    "ip_adapter_faceid_sd15",
    "ip_adapter_faceid_portrait_sd15",
    "ip_adapter_faceid_portrait_v11_sd15",
    "ip_adapter_faceid_sdxl",
    "ip_adapter_faceid_portrait_sdxl",
    "ip_adapter_faceid_portrait_sdxl_unnorm",
]

