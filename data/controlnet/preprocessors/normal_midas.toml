id = "normal_midas"
label = "Normal MiDaS"
summary = "Builds a normal map from a MiDaS depth map, the method ControlNet 1.0 used, with a background threshold."
description = """\
Normal MiDaS first estimates depth with MiDaS, then works out which way each surface faces from how that depth \
changes across the image, and draws the result as a color map. Areas below the background threshold are set to \
face the viewer, so far background becomes a flat color. WebUI lists it as normal_map and normal_midas.\n\n\
The ControlNet 1.1 README calls this method neither reasonable nor physically correct and replaced it with \
Normal BAE. Use it with the 1.0 normal model, which was trained on maps made this way."""
how_it_works = """\
There is no normal-estimating network here. MiDaS predicts depth. The preprocessor measures how steeply depth \
slopes left to right and top to bottom at each pixel, combines those slopes with a constant for the forward \
direction, and scales each result to a unit-length direction. The constant, the Z scale, controls how pronounced \
the tilt looks. Pixels in the farthest part of the depth range have their slope set to zero, which makes them \
face straight at the camera."""
control_types = ["normal_map"]
effect = "Replaces the image with a color map of surface direction derived from estimated depth."
output = "RGB normal map with a flat color for the far background."
best_input = ""
weak_input = ""
models = ["control_sd15_normal"]

