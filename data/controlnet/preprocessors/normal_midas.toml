[[parameters]]
id = "resolution"
label = "Resolution"
summary = "Size of the image's short side while the preprocessor runs."
names = { webui = "processor_res", forge = "processor_res", comfyui = "resolution" }
type = "int"
default = 512
range = [64, 2048]
effect = """\
The image is scaled so its short side matches this value, padded to a multiple of 64, and processed at that \
size. Larger values keep finer detail and take longer. ComfyUI accepts up to 16384."""
when_to_adjust = """\
Raise it toward the generation's short side for finer depth detail. Lower it for a smoother, simpler map."""

[[parameters]]
id = "background_threshold"
label = "Background Threshold"
summary = "Depth below this fraction of the range is flattened to face the viewer."
names = { webui = "threshold_a", forge = "threshold_a", comfyui = "bg_threshold" }
type = "float"
default = 0.4
range = [0.0, 1.0]
effect = """\
Raise it to turn more of the far scene into the flat background color. WebUI and Forge default to 0.4 and \
ComfyUI to 0.1."""
when_to_adjust = "Raise it to remove busy background shapes. Lower it when the background should keep its relief."

[[parameters]]
id = "a"
label = "Z Scale"
summary = "How strongly surfaces tilt away from the viewer."
names = { comfyui = "a" }
type = "float"
default = 6.283185307179586
range = [0.0, 15.707963267948966]
effect = """\
A larger value keeps normals closer to facing the camera and softens the relief. WebUI and Forge do not show it \
and use the default."""
when_to_adjust = "Lower it for more pronounced relief."
