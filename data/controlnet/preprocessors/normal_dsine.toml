[[parameters]]
id = "resolution"
label = "Resolution"
summary = "Size of the image's short side while the preprocessor runs."
names = { webui = "processor_res", comfyui = "resolution" }
type = "int"
default = 512
range = [64, 2048]
effect = """\
The image is scaled so its short side matches this value, padded to a multiple of 64, and processed at that \
size. Larger values keep finer detail and take longer. ComfyUI accepts up to 16384."""
when_to_adjust = """\
Raise it toward the generation's short side for finer depth detail. Lower it for a smoother, simpler map."""

[[parameters]]
id = "fov"
label = "Field of View"
summary = "The camera's field of view in degrees."
names = { webui = "threshold_a", comfyui = "fov" }
type = "float"
default = 60.0
range = [0.0, 360.0]
effect = """\
The model assumes known camera intrinsics, and an approximate value still gives good results, per its README. \
ComfyUI accepts up to 365."""
when_to_adjust = "Raise it for wide-angle shots and lower it for telephoto shots."

[[parameters]]
id = "iterations"
label = "Iterations"
summary = "How many refinement passes the network runs."
names = { webui = "threshold_b", comfyui = "iterations" }
type = "int"
default = 5
range = [1, 20]
effect = "More passes refine the prediction further and take longer."
when_to_adjust = "Lower it for speed or raise it to chase detail."
