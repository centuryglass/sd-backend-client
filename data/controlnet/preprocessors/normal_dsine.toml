id = "normal_dsine"
label = "Normal DSINE"
summary = "Estimates a surface normal map with DSINE, which uses the camera's field of view to sharpen the result."
description = """\
Normal DSINE draws each surface's facing direction as a color map. Unlike most normal estimators it takes the \
camera's field of view, because the direction a surface faces depends on where it sits in the camera's view. A \
rough value is enough; the default is 60 degrees. A second setting controls how many refinement passes run.\n\n\
The comfyui_controlnet_aux table pairs it with the ControlNet 1.1 normal model. The weights file the backends \
fetch comes from a third-party repository whose card is licensed CC-BY-NC-SA 4.0."""
how_it_works = """\
DSINE argues that normal estimation needs different assumptions from other image tasks. It feeds the direction \
of the camera ray through each pixel to the network, because a surface seen head-on looks different from the \
same surface seen at an angle. It also learns how each pixel's direction rotates relative to its neighbors, \
which keeps results crisp but smooth within a flat area. The network refines its answer over several passes, and \
the iterations setting chooses how many."""
control_types = ["normal_map"]
effect = "Replaces the image with a sharp color map of the direction each surface faces."
output = "RGB normal map."
best_input = ""
weak_input = ""
models = ["control_v11p_sd15_normalbae"]

sources = [
    "recorded_fixtures",
    "sdwebui_cn_legacy_preprocessors",
    "sdwebui_cn_preprocessors",
    "comfyui_controlnet_aux_nodes",
    "paper_dsine",
