    "hf_bdsqlsz_qinglong_lllite",
    "comfyui_controlnet_aux_readme",
    "comfyui_controlnet_aux_src",
    "sdwebui_cn_annotators",
]
research_status = "drafted"
open_questions = [
    "Confirm that DSINE's color convention matches the ControlNet 1.1 normal model's: blue front, red left, green top.",
]

[names]
