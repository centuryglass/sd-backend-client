id = "depth_leres_plus"
label = "Depth LeReS++"
summary = "LeReS depth with the boost option, which merges estimates made at several scales for finer detail."
description = """\
Depth LeReS++ is LeReS with its boost option turned on. Instead of one pass, it estimates depth at different \
scales and merges the results, so the map keeps both the overall scene layout and small details that a single \
pass blurs. It takes the same Remove Near and Remove Background sliders as LeReS and draws white for near, black \
for far.\n\n\
Boost uses the second downloaded file, a 318 MB merging network. ComfyUI exposes it as the boost switch on the \
LeReS node."""
how_it_works = """\
Depth networks trade off scene consistency against detail: a low-resolution pass gets the layout right, and a \
high-resolution pass adds fine detail but can distort the layout. The boosting method behind LeReS++ estimates \
depth at several resolutions and in image patches that depend on the content, then combines them with a small \
merging network. The result is a depth map with more detail than a single pass gives, at the cost of several \
runs of the depth network."""
control_types = ["depth"]
effect = "Like LeReS, with finer detail in the depth map."
output = "Grayscale depth map, white near and black far."
best_input = ""
weak_input = ""
models = ["control_v11f1p_sd15_depth"]

sources = [
    "recorded_fixtures",
    "sdwebui_cn_legacy_preprocessors",
    "sdwebui_cn_preprocessors",
    "forge_preprocessors",
