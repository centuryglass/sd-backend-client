id = "normal_bae"
label = "Normal BAE"
summary = "Estimates a surface normal map with Bae's network, the preprocessor the ControlNet 1.1 normal model uses."
description = """\
Normal BAE draws each surface's facing direction as a color map. In the convention of the ControlNet 1.1 normal \
model, blue faces the camera, red faces left and green faces up. It carries surface angle, including small bumps \
that a depth map flattens.\n\n\
The ControlNet 1.1 README says the network was trained on the NYU-V2 visualization protocol and that the normal \
model can read real normal maps from 3D engines if their colors follow ScanNet's convention. WebUI lists it as \
normal_bae. Forge and reForge also list it as normalbae."""
how_it_works = """\
The network predicts a probability distribution over surface directions at each pixel, not a single direction. \
The spread of that distribution tells how uncertain the estimate is. The paper uses that uncertainty to choose \
which pixels to train on, so large flat surfaces do not dominate. Small multilayer perceptrons then refine the \
prediction at the chosen pixels, which improves detail. The preprocessor shows the expected direction as a \
color."""
control_types = ["normal_map"]
effect = "Replaces the image with a color map of the direction each surface faces."
output = "RGB normal map: blue faces the camera, red faces left, green faces up."
best_input = ""
weak_input = ""
models = [
    "control_v11p_sd15_normalbae",
    "xinsir_union_sdxl",
    "xinsir_union_promax_sdxl",
]

sources = [
    "recorded_fixtures",
    "sdwebui_cn_legacy_preprocessors",
    "sdwebui_cn_preprocessors",
    "forge_preprocessors",
    "reforge_preprocessors",
    "comfyui_controlnet_aux_nodes",
    "paper_bae",
    "cn11_readme",
    "hf_lllyasviel_annotators",
    "comfyui_controlnet_aux_src",
    "sdwebui_cn_annotators",
]
research_status = "verified"
open_questions = []

