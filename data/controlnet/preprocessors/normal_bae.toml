[[parameters]]
id = "resolution"
label = "Resolution"
summary = "Size of the image's short side while the preprocessor runs."
names = { forge = "processor_res", comfyui = "resolution" }
type = "int"
default = 512
range = [128, 2048]
effect = """\
The image is scaled so its short side matches this value, padded to a multiple of 64, and processed at that \
size. Larger values keep finer detail and take longer. ComfyUI accepts up to 16384. Forge shows this slider from \
128 in steps of 8, and WebUI has no resolution slider for this preprocessor."""
when_to_adjust = """\
Raise it toward the generation's short side for finer depth detail. Lower it for a smoother, simpler map."""
