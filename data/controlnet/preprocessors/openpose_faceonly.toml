id = "openpose_faceonly"
label = "OpenPose Face Only"
summary = "Draws only the 70 OpenPose face points, so the face's angle and expression guide generation and the body is free."
description = """\
OpenPose Face Only draws a face for each person, 70 white dots tracing the jaw, brows, eyes, nose and mouth, \
and leaves out the body. It suits portraits where the expression and head angle matter and the body should \
follow the prompt.\n\n\
The ControlNet 1.1 OpenPose model was trained to accept face points alone. The preprocessor still has to find \
a body first, since it locates each face from the body's head points. A tight close-up with no shoulders may \
give an empty map."""
how_it_works = """\
OpenPose is a neural network from Carnegie Mellon that finds people bottom-up: it marks likely joints across \
the whole image, plus part affinity fields, which point along each limb, and uses them to link joints into one \
skeleton per person. The preprocessor uses a PyTorch port of it. Hands and face are a second pass: for each \
body found, it crops around the wrists and head and runs a separate hand or face network on each crop. That \
is why hand and face points only appear on a person whose body was detected."""
control_types = ["openpose"]
effect = "Replaces the image with face points for each detected person, on black."
output = "White face points on black, 70 per face."
best_input = ""
weak_input = "Tight face close-ups, where too little body shows for the head points to be found."
models = [
    "control_v11p_sd15_openpose",
]

sources = [
    "recorded_fixtures",
    "sdwebui_cn_legacy_preprocessors",
    "sdwebui_cn_preprocessors",
    "forge_preprocessors",
    "reforge_preprocessors",
    "comfyui_controlnet_aux_nodes",
    "sdwebui_cn_annotators",
    "comfyui_controlnet_aux_src",
    "comfyui_controlnet_aux_readme",
    "hf_lllyasviel_annotators",
    "paper_openpose",
    "gh_openpose_readme",
    "cn11_readme",
]
research_status = "verified"
open_questions = []

