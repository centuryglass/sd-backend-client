id = "openpose"
label = "OpenPose"
summary = "Finds each person's body joints and draws them as a colored stick figure, without hands or face."
description = """\
OpenPose finds the people in an image and draws each one as a stick figure on black: 18 body points, from \
nose, eyes and ears down to ankles, joined by limbs in fixed colors. Hands and face are left out, so the \
generated figure copies the stance but not the fingers or expression.\n\n\
This is one of the two choices the ControlNet 1.1 README recommends showing users, with OpenPose Full. Pose \
models for both SD 1.5 and SDXL accept it, and xinsir's SDXL card makes its examples with hands and face off."""
how_it_works = """\
OpenPose is a neural network from Carnegie Mellon that finds people bottom-up: it marks likely joints across \
the whole image, plus part affinity fields, which point along each limb, and uses them to link joints into one \
skeleton per person. The preprocessor uses a PyTorch port of it. Hands and face are a second pass: for each \
body found, it crops around the wrists and head and runs a separate hand or face network on each crop. That \
is why hand and face points only appear on a person whose body was detected."""
control_types = ["openpose"]
effect = "Replaces the image with a stick figure of each detected person's body on black."
output = "Colored stick figures on black, 18 body points per person."
best_input = ""
weak_input = ""
models = [
    "control_sd15_openpose",
    "control_v11p_sd15_openpose",
    "t2iadapter_openpose_sd14v1",
    "t2i_adapter_openpose_sdxl",
    "thibaud_openpose_xl2",
    "xinsir_openpose_sdxl",
    "xinsir_openpose_twins_sdxl",
    "kohya_lllite_pose_anime_sdxl",
    "kohya_lllite_pose_anime_v2_sdxl",
]

sources = [
    "recorded_fixtures",
    "sdwebui_cn_legacy_preprocessors",
    "sdwebui_cn_preprocessors",
    "forge_preprocessors",
    "reforge_preprocessors",
    "comfyui_controlnet_aux_nodes",
    "sdwebui_cn_annotators",
    "comfyui_controlnet_aux_src",
    "comfyui_controlnet_aux_readme",
    "hf_lllyasviel_annotators",
    "paper_openpose",
