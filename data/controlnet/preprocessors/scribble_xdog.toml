id = "scribble_xdog"
label = "Scribble XDoG"
summary = "Turns an image into scribble lines with a difference-of-blurs filter; a threshold sets the detail."
description = """\
Scribble XDoG makes scribble-like lines from an image without a neural network. It picks out dark edges and \
lines, and its one setting controls how much survives: a low threshold keeps a dense tracing with texture, a \
high one keeps only the strongest lines."""
how_it_works = """\
XDoG, extended difference of Gaussians, blurs the image twice, once slightly and once heavily, and subtracts one \
from the other. Where a pixel is darker than its wide surroundings, the difference is large, which marks edges \
and dark lines. Pixels above the threshold become white and the rest black."""
control_types = ["scribble", "sparsectrl"]
effect = "Keeps dark edges and lines as white strokes; the threshold sets how many."
output = "Black image with white lines."
best_input = "Photos, renders and drawings with clear dark lines."
weak_input = ""
models = ["control_v11p_sd15_scribble", "control_sd15_scribble", "sparsectrl_scribble_sd15"]

sources = [
    "sdwebui_cn_preprocessors",
    "comfyui_controlnet_aux_src",
    "comfyui_controlnet_aux_readme",
    "recorded_fixtures",
    "sdwebui_cn_legacy_preprocessors",
    "forge_preprocessors",
    "comfyui_controlnet_aux_nodes",
]
research_status = "verified"
open_questions = []

[names]
webui = ["scribble_xdog"]
forge = ["scribble_xdog"]
comfyui = ["Scribble_XDoG_Preprocessor"]

[hardware]
device = "none"
speed = "fast: two blurs and a threshold, no network"

[[parameters]]
id = "resolution"
label = "Resolution"
summary = "Size of the image's short side while the preprocessor runs."
names = { webui = "processor_res", forge = "processor_res", comfyui = "resolution" }
type = "int"
default = 512
range = [64, 2048]
effect = """\
The image is scaled so its short side matches this value, padded to a multiple of 64, and processed at that \
size. Larger values keep finer detail and take longer. ComfyUI accepts up to 16384."""
when_to_adjust = "Raise it toward the generation's short side for finer lines. Lower it for bolder, simpler maps."

[[parameters]]
id = "threshold"
label = "XDoG Threshold"
summary = "Edge strength a pixel needs to become a white line."
names = { webui = "threshold_a", forge = "threshold_a", comfyui = "threshold" }
type = "int"
default = 32
range = [1, 64]
effect = "Lower values keep more, fainter lines and texture. Higher values keep only strong lines."
when_to_adjust = "Raise it if the map is cluttered. Lower it if shapes break apart."
