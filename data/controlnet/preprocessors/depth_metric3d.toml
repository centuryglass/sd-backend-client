id = "depth_metric3d"
label = "Metric3D Depth"
summary = "Estimates depth with Metric3D, a model built to predict real-world distances from one photo."
description = """\
Metric3D Depth predicts metric depth, meaning real distances, from a single image, and the ComfyUI node turns it \
into a grayscale control map. Three model sizes are available, from 150 MB to 5.5 GB. The node takes the \
camera's focal length in pixels, which the model needs to judge scale; both values default to 1000. The node \
divides the map by its farthest point, so focal length scales real distances but leaves the returned image \
unchanged.\n\n\
The comfyui_controlnet_aux table pairs it with the standard depth ControlNets. It is not available in WebUI or \
Forge."""
how_it_works = """\
The main difficulty with metric depth is that the same picture can come from a small scene close up or a large \
one far away, depending on the camera. Metric3D resolves this with a canonical camera space: it transforms \
training images, or the predicted labels, to one standard focal length, so a single model can train on many \
cameras at once. At inference the known focal length converts the output back to real distances. Version 2 also \
predicts surface normals."""
control_types = ["depth"]
effect = "Replaces color and texture with a grayscale map of distance."
output = "Grayscale depth map, light near and dark far; the farthest point is dark gray, not black."
best_input = ""
weak_input = ""
models = ["control_v11f1p_sd15_depth"]

sources = [
    "recorded_fixtures",
    "comfyui_controlnet_aux_nodes",
    "paper_metric3d",
    "paper_metric3dv2",
    "gh_metric3d_readme",
    "hf_jugghm_metric3d",
    "comfyui_controlnet_aux_src",
    "comfyui_controlnet_aux_readme",
]
research_status = "verified"
open_questions = []

