id = "pidinet_safe"
label = "PiDiNet Safe"
summary = "PiDiNet soft edges quantized to a few levels; the most robust soft edge option per ControlNet 1.1."
description = """\
PiDiNet Safe runs PiDiNet and flattens its map into a few brightness levels, removing the hidden copy of the \
source image. The ControlNet 1.1 README ranks it the most robust of the four soft edge preprocessors and the \
lowest for maximum quality: results are dependable, if a little less detailed.\n\n\
In ComfyUI it is the PiDiNet node with safe enabled, which is that node's default."""
how_it_works = """\
After PiDiNet predicts its soft edge map, every value is snapped down to one of a few flat levels, which erases \
the subtle gradients and keeps the boundaries."""
control_types = ["softedge"]
effect = """\
Quantizes the edge map into a few flat levels, which removes the faint grayscale copy of the source image hidden \
in plain soft edge maps."""
output = "Black image with soft white boundary lines in a few flat levels."
best_input = "Photos and renders."
weak_input = ""
models = ["control_v11p_sd15_softedge"]

sources = [
    "cn11_readme",
    "paper_pidinet",
    "sdwebui_cn_annotators",
    "recorded_fixtures",
    "sdwebui_cn_legacy_preprocessors",
    "sdwebui_cn_preprocessors",
    "forge_preprocessors",
    "comfyui_controlnet_aux_nodes",
]
research_status = "verified"
open_questions = []

[names]
webui = ["pidinet_safe", "softedge_pidisafe"]
forge = ["softedge_pidisafe"]
comfyui = ["PiDiNetPreprocessor"]

[hardware]
device = "gpu_preferred"
speed = "fast: a lightweight network"

[[hardware.files]]
filename = "table5_pidinet.pth"
size_bytes = 2871148
sha256 = "80860ac267258b5f27486e0ef152a211d0b08120f62aeb185a050acc30da486c"
source_url = "https://huggingface.co/lllyasviel/Annotators/resolve/982e7edaec38759d914a963c48c4726685de7d96/table5_pidinet.pth"

[[parameters]]
id = "resolution"
label = "Resolution"
summary = "Size of the image's short side while the preprocessor runs."
names = { webui = "processor_res", forge = "processor_res", comfyui = "resolution" }
type = "int"
default = 512
range = [64, 2048]
effect = """\
The image is scaled so its short side matches this value, padded to a multiple of 64, and processed at that \
size. Larger values keep finer detail and take longer. ComfyUI accepts up to 16384."""
when_to_adjust = "Raise it toward the generation's short side for finer lines. Lower it for bolder, simpler maps."
