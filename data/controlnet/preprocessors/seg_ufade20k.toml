id = "seg_ufade20k"
label = "UniFormer ADE20K"
summary = "Labels every pixel with one of ADE20K's 150 scene classes using UniFormer, the segmenter ControlNet 1.0 was shown with."
description = """\
UniFormer ADE20K divides an image into regions of ADE20K's 150 scene classes and fills each region with that \
class's color, the same palette OneFormer ADE20K draws. The result is a flat color map with no edges or \
shading inside regions.\n\n\
This is the segmenter of ControlNet 1.0's segmentation demo, and sd-webui-controlnet's module named \
"segmentation". Both SD 1.5 segmentation ControlNets read its maps. Its network is smaller than OneFormer's: 52 \
million parameters against 219 million, and a 206 MB weights file against about 950 MB."""
how_it_works = """\
UniFormer is a vision network that mixes convolution, which looks at small neighborhoods, in its early layers \
with self-attention, which relates distant parts of the image, in its later ones. Here it feeds UperNet, a \
segmentation head from scene-parsing research, which turns those features into a class for each pixel. This \
checkpoint is UniFormer-S with UperNet, trained on ADE20K. Each pixel's predicted class is painted in \
ADE20K's palette color."""
control_types = ["segmentation"]
effect = "Replaces the image with flat regions in ADE20K class colors, one region per detected class."
output = "Flat color map in the 150-class ADE20K palette."
best_input = ""
weak_input = ""
models = ["control_sd15_seg", "control_v11p_sd15_seg"]

sources = [
    "recorded_fixtures",
    "sdwebui_cn_legacy_preprocessors",
    "sdwebui_cn_preprocessors",
    "forge_preprocessors",
    "reforge_preprocessors",
    "comfyui_controlnet_aux_nodes",
    "sdwebui_cn_annotators",
    "comfyui_controlnet_aux_src",
    "comfyui_controlnet_aux_readme",
    "hf_lllyasviel_annotators",
    "hf_lllyasviel_controlnet",
    "paper_uniformer",
    "paper_upernet",
    "gh_uniformer_seg_readme",
    "gh_oneformer_readme",
    "paper_ade20k",
    "cn10_readme",
    "cn11_readme",
]
