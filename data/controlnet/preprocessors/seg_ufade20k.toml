[[parameters]]
id = "resolution"
label = "Resolution"
summary = "Size of the image's short side while the preprocessor runs."
names = { webui = "processor_res", forge = "processor_res", comfyui = "resolution" }
type = "int"
default = 512
range = [64, 2048]
effect = """\
The image is scaled so its short side matches this value and padded to a multiple of 64. UniFormer then \
rescales it to a 512-pixel short side internally, or less for very wide images, so this value mostly sets \
the size of the returned map and how much detail survives the first scaling. ComfyUI accepts up to 16384."""
when_to_adjust = """\
Match it to the generation's short side to avoid rescaling the map later. Values far below 512 discard \
detail before the segmenter sees the image."""
