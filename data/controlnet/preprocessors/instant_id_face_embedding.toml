id = "instant_id_face_embedding"
label = "InstantID Face Embedding"
summary = "Reads a face's identity with InsightFace antelopev2 for the InstantID adapter, the first of InstantID's two units."
description = """\
InstantID Face Embedding finds the largest face in the photo and passes its identity embedding, not an image, to \
the InstantID IP-Adapter. Use it in the first of InstantID's two units. sd-webui-controlnet lists it as \
instant_id_face_embedding; Forge, reForge and Forge Neo call it InsightFace (InstantID).\n\n\
It uses InsightFace's antelopev2 model pack, not the buffalo_l pack the FaceID preprocessors use. Insightface's \
own release link for antelopev2 is down, so the WebUI extensions fetch it from a Hugging Face mirror on first \
use, about 430 MB. The insightface Python package must be installed. Forge retries detection at smaller sizes \
when no face is found at 640 pixels; sd-webui-controlnet does not."""
how_it_works = """\
InsightFace's antelopev2 pack detects the face and runs a face recognition network on it. Like ArcFace, it is \
trained so that photos of the same person land close together, so its 512-number embedding describes whose face \
it is rather than the lighting or angle. The InstantID adapter projects that embedding into 16 tokens, which feed \
both the U-Net and the InstantID ControlNet."""
control_types = ["instant_id"]
effect = "Produces a face identity embedding rather than a picture; nothing visible to preview."
output = "A 512-dimensional InsightFace antelopev2 face embedding."
best_input = "A clear photo of one face."
weak_input = "Images with no detectable face, which fail."
models = ["instantid_ip_adapter_sdxl"]

sources = [
    "recorded_fixtures",
    "sdwebui_cn_legacy_preprocessors",
    "sdwebui_cn_legacy_processor",
    "sdwebui_cn_preprocessors",
    "sdwebui_cn_instantid_discussion",
    "sdwebui_cn_ipadapter",
    "forge_preprocessors",
    "forge_ipadapter",
    "reforge_preprocessors",
    "reforge_ipadapter_lib",
    "forge_neo_ipadapter",
    "hf_instantx_instantid",
    "hf_diamonik_antelopev2",
    "paper_instantid",
    "paper_arcface",
]
research_status = "verified"
open_questions = []

[names]
webui = ["instant_id_face_embedding"]
forge = ["InsightFace (InstantID)", "instant_id_face_embedding"]
comfyui = []

