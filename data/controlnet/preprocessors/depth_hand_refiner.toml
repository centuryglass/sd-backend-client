id = "depth_hand_refiner"
label = "Depth Hand Refiner"
summary = "Fits 3D hand meshes to the hands in an image and draws their depth, to fix malformed hands by inpainting."
description = """\
Depth Hand Refiner finds the hands in an image, fits a 3D hand model to each, and draws the result as a depth \
map that shows five fingers and a plausible pose. Paired with the HandRefiner depth-inpainting ControlNet and a \
mask over the hands, it redraws a hand the generator got wrong while leaving the rest of the picture alone.\n\n\
The authors recommend a control strength of 0.4 to 0.8, since 1 can lose texture. Hands should be at least about \
60 pixels wide. If the original hand is unrecognizable, the fitting can fail. ComfyUI installs mediapipe and \
trimesh on first use."""
how_it_works = """\
HandRefiner treats a malformed hand as a problem that needs better information, not a retry. A hand detector \
finds each hand, and the Mesh Graphormer network, a transformer that also reasons about how mesh points connect, \
reconstructs a hand mesh with the right number of fingers in a matching pose. The preprocessor renders that mesh \
as a depth map and a mask. A depth ControlNet then guides the inpainting of the masked area, so the new hand \
follows the mesh."""
control_types = ["depth"]
effect = "Replaces the hands with a clean depth rendering of fitted hand meshes and ignores the rest."
output = "Grayscale depth map of the fitted hands, plus a hand mask in ComfyUI."
best_input = "Photos and renders of people whose hands are at least about 60 pixels wide."
weak_input = "Hands too distorted to recognize, anime or cartoon hands, and very small hands."
models = ["handrefiner_inpaint_depth_hand_sd15"]

sources = [
    "recorded_fixtures",
    "sdwebui_cn_legacy_preprocessors",
    "sdwebui_cn_preprocessors",
    "forge_preprocessors",
    "comfyui_controlnet_aux_nodes",
    "paper_handrefiner",
    "paper_mesh_graphormer",
    "gh_handrefiner_readme",
    "hf_hr16_handrefiner_pruned",
    "comfyui_controlnet_aux_src",
    "comfyui_controlnet_aux_readme",
]
research_status = "verified"
open_questions = []

[names]
webui = ["depth_hand_refiner"]
forge = ["depth_hand_refiner"]
comfyui = [
    "MeshGraphormer-DepthMapPreprocessor",
    "MeshGraphormer+ImpactDetector-DepthMapPreprocessor",
]

[hardware]
device = "gpu_preferred"

[[hardware.files]]
filename = "graphormer_hand_state_dict.bin"
size_bytes = 855658184
sha256 = "b78081d105dc730c179eb0e2366bea999ceb4363070bb3aa1ae31fcf878a8a41"
source_url = "https://huggingface.co/hr16/ControlNet-HandRefiner-pruned/resolve/f0917f0595ecb7f6435f49e4b2b28f8dd68ab0cb/graphormer_hand_state_dict.bin"

[[hardware.files]]
filename = "hrnetv2_w64_imagenet_pretrained.pth"
size_bytes = 513111608
sha256 = "41ed675bcd1f4f4b62a49bad64901f08f8b67ed744b715da87738f926dae685c"
source_url = "https://huggingface.co/hr16/ControlNet-HandRefiner-pruned/resolve/f0917f0595ecb7f6435f49e4b2b28f8dd68ab0cb/hrnetv2_w64_imagenet_pretrained.pth"

[[parameters]]
id = "resolution"
label = "Resolution"
summary = "Size of the image's short side while the preprocessor runs."
names = { webui = "processor_res", forge = "processor_res", comfyui = "resolution" }
type = "int"
default = 512
range = [64, 2048]
effect = """\
The image is scaled so its short side matches this value, padded to a multiple of 64, and processed at that \
size. Larger values keep finer detail and take longer. ComfyUI accepts up to 16384."""
when_to_adjust = """\
Raise it toward the generation's short side for finer depth detail. Lower it for a smoother, simpler map."""

[[parameters]]
id = "mask_bbox_padding"
label = "Mask Padding"
summary = "Extra pixels added around each detected hand when building the mask."
names = { comfyui = "mask_bbox_padding" }
type = "int"
default = 30
range = [0, 100]
effect = "Larger values make the mask reach farther past the hand. WebUI and Forge fix it at 30."
when_to_adjust = "Raise it when the malformed hand has long fingers that extend past the mask."

[[parameters]]
id = "mask_type"
label = "Mask Type"
summary = "How the ComfyUI node builds the inpainting mask."
names = { comfyui = "mask_type" }
type = "enum"
default = "based_on_depth"
choices = ["based_on_depth", "tight_bboxes", "original"]
effect = """\
based_on_depth masks every pixel where the depth map is nonzero. tight_bboxes fills the detected hand boxes. \
original keeps the mask the detector returns."""
when_to_adjust = "Try tight_bboxes or original when the depth-based mask misses part of the hand."

[[parameters]]
id = "mask_expand"
label = "Mask Expand"
summary = "Grows or shrinks the mask by this many pixels."
names = { comfyui = "mask_expand" }
type = "int"
default = 5
range = [-16384, 16384]
effect = "Positive values dilate the mask and negative values erode it."
when_to_adjust = "Raise it when the mask edge cuts into the old hand."

[[parameters]]
id = "rand_seed"
label = "Seed"
summary = "Seed for the mesh fitting step."
names = { comfyui = "rand_seed" }
type = "int"
default = 88
range = [0, 18446744073709551615]
effect = "Changes the random seed passed to the detector; the same seed repeats the same fit."
when_to_adjust = "Change it to get a different fit when the first one is wrong."

[[parameters]]
id = "detect_thr"
label = "Detection Threshold"
summary = "Confidence a hand must reach to be detected."
names = { comfyui = "detect_thr" }
type = "float"
default = 0.6
range = [0.1, 1.0]
effect = "Lower values detect more hands, including false ones."
when_to_adjust = "Lower it when a hand is missed."

[[parameters]]
id = "presence_thr"
label = "Presence Threshold"
summary = "Confidence a detection must reach to count as a hand."
names = { comfyui = "presence_thr" }
type = "float"
default = 0.6
range = [0.1, 1.0]
effect = "Lower values accept weaker detections."
when_to_adjust = "Lower it when a hand is missed and detection threshold alone does not help."
