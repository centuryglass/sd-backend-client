id = "teed"
label = "TEED"
summary = "Finds edges with TEED, a tiny, fast network that gives crisp soft edge maps."
description = """\
TEED draws crisp soft edges. Its authors designed it for simplicity, efficiency and generalization to images \
unlike its training set. Like the safe variants, it quantizes its map into a few levels by default.\n\n\
comfyui_controlnet_aux pairs it with the SargeZT SDXL soft edge model and, it notes, theoretically with the \
ControlNet 1.1 Soft Edge model. AnyLine runs the same network with its own weights."""
how_it_works = """\
TEED, tiny and efficient edge detector, is a convolutional network with only 58 thousand parameters, under 0.2 \
percent of the size of leading edge models, and trains in under 30 minutes. It predicts edge maps at a few \
scales and averages them into one map."""
control_types = ["softedge"]
effect = "Keeps object edges as crisp graded lines in a few flat levels."
output = "Black image with white edge lines."
best_input = "Photos and renders."
weak_input = ""
models = [
    "sargezt_xl_softedge",
    "control_v11p_sd15_softedge",
    "xinsir_union_sdxl",
    "xinsir_union_promax_sdxl",
]

sources = [
    "paper_teed",
    "sdwebui_cn_preprocessors",
    "sdwebui_cn_annotators",
    "comfyui_controlnet_aux_readme",
    "anyline_readme",
    "recorded_fixtures",
    "sdwebui_cn_legacy_preprocessors",
    "forge_preprocessors",
    "comfyui_controlnet_aux_nodes",
]
research_status = "verified"
open_questions = []

[names]
webui = ["softedge_teed"]
forge = ["softedge_teed"]
comfyui = ["TEEDPreprocessor", "TEED_Preprocessor"]

[hardware]
device = "gpu_preferred"
speed = "fast: a 58 thousand parameter network"

[[hardware.files]]
filename = "7_model.pth"
size_bytes = 247232
sha256 = "b9037964149c55156c6adbffdfbd7e8ca7d2ef2a4d90573520efa7f3a1aacf06"
source_url = "https://huggingface.co/bdsqlsz/qinglong_controlnet-lllite/resolve/67006a35a5955437d118490bfec822402eff09f5/Annotators/7_model.pth"

[[parameters]]
id = "resolution"
label = "Resolution"
summary = "Size of the image's short side while the preprocessor runs."
names = { webui = "processor_res", forge = "processor_res", comfyui = "resolution" }
type = "int"
default = 512
range = [64, 2048]
effect = """\
The image is scaled so its short side matches this value, padded to a multiple of 64, and processed at that \
size. Larger values keep finer detail and take longer. ComfyUI accepts up to 16384."""
when_to_adjust = "Raise it toward the generation's short side for finer lines. Lower it for bolder, simpler maps."

[[parameters]]
id = "safe_steps"
label = "Safe Steps"
summary = "Number of flat levels the edge map is quantized into; 0 turns quantizing off."
names = { webui = "threshold_a", forge = "threshold_a", comfyui = "safe_steps" }
type = "int"
default = 2
range = [0, 10]
effect = """\
Quantizes the edge map into a few flat levels, which removes the faint grayscale copy of the source image hidden \
in plain soft edge maps. Higher values keep more gradation."""
when_to_adjust = "Set it to 0 for the raw soft map. Raise it if faint edges are missing."
