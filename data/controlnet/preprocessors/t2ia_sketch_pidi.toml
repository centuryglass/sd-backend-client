id = "t2ia_sketch_pidi"
label = "T2I Sketch PiDiNet"
summary = "PiDiNet edges cut to hard white lines, for the SD1.x T2I-Adapter sketch models."
description = """\
T2I Sketch PiDiNet prepares input for the TencentARC sketch adapters for SD1.x. It runs PiDiNet and keeps only \
confident edges, as hard white lines on black, the form the sketch adapters were trained on. WebUI lists it \
under the T2I-Adapter type."""
how_it_works = """\
PiDiNet predicts a soft edge map, and every pixel above half strength becomes white while the rest becomes \
black."""
control_types = ["t2i_adapter"]
effect = "Keeps confident object edges as hard white lines; drops soft gradients."
output = "Black image with hard white lines."
best_input = "Photos and renders."
weak_input = ""
models = ["t2iadapter_sketch_sd14v1", "t2iadapter_sketch_sd15v2"]

sources = [
    "sdwebui_cn_preprocessors",
    "sdwebui_cn_annotators",
    "hf_tencentarc_t2i_adapter_sketch_sdxl_1_0",
    "recorded_fixtures",
    "sdwebui_cn_legacy_preprocessors",
    "forge_preprocessors",
]
research_status = "drafted"
open_questions = [
    "Confirm that the SD1.x sketch adapters were trained on thresholded PiDiNet maps. The SDXL sketch adapter card says \"trained with PidiNet edge detection\"; no SD1.x card says so.",
]

[names]
webui = ["pidinet_sketch", "t2ia_sketch_pidi"]
forge = ["t2ia_sketch_pidi"]
comfyui = []

[hardware]
device = "gpu_preferred"
speed = "fast: a lightweight network"

[[hardware.files]]
filename = "table5_pidinet.pth"
size_bytes = 2871148
sha256 = "80860ac267258b5f27486e0ef152a211d0b08120f62aeb185a050acc30da486c"
source_url = "https://huggingface.co/lllyasviel/Annotators/resolve/982e7edaec38759d914a963c48c4726685de7d96/table5_pidinet.pth"

[[parameters]]
id = "resolution"
label = "Resolution"
summary = "Size of the image's short side while the preprocessor runs."
names = { webui = "processor_res", forge = "processor_res" }
type = "int"
default = 512
range = [64, 2048]
effect = """\
The image is scaled so its short side matches this value, padded to a multiple of 64, and processed at that \
size. Larger values keep finer detail and take longer. ComfyUI accepts up to 16384."""
when_to_adjust = "Raise it toward the generation's short side for finer lines. Lower it for bolder, simpler maps."
