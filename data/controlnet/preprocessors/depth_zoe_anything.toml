id = "depth_zoe_anything"
label = "Zoe Depth Anything"
summary = "Estimates depth with ZoeDepth built on a Depth Anything encoder, with indoor and outdoor models."
description = """\
Zoe Depth Anything is the ZoeDepth design with its encoder replaced by Depth Anything's. It predicts metric \
depth, and the preprocessor turns that into a grayscale map with white near and black far. Choose the indoor or \
outdoor checkpoint to match the scene.\n\n\
The ComfyUI node is the only place it appears. The comfyui_controlnet_aux table pairs it with the Depth Anything \
ControlNet."""
how_it_works = """\
ZoeDepth predicts metric depth with a relative-depth encoder underneath, and here that encoder is Depth \
Anything's. The Depth Anything authors report fine-tuning their model with measured depth from NYUv2 and KITTI, \
and the metric checkpoints come in indoor and outdoor versions. The preprocessor discards the distances: like \
Depth ZoeDepth, it stretches the 2nd to 85th percentiles to the full range and inverts the result so near is \
white."""
control_types = ["depth"]
effect = "Replaces color and texture with a grayscale map of distance."
output = "Grayscale depth map, white near and black far, with the extremes clipped."
best_input = ""
weak_input = ""
models = ["depth_anything_controlnet_sd15"]

sources = [
    "recorded_fixtures",
    "comfyui_controlnet_aux_nodes",
    "paper_depth_anything",
    "gh_depth_anything_readme",
    "hf_liheyoung_depth_anything_space",
    "comfyui_controlnet_aux_readme",
    "comfyui_controlnet_aux_src",
]
research_status = "verified"
open_questions = []

