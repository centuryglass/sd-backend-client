id = "depth_midas"
label = "Depth MiDaS"
summary = "Estimates relative depth with MiDaS, the estimator the original ControlNet depth models were trained on."
description = """\
Depth MiDaS guesses how far each part of an image is from the camera and draws it as a grayscale map, white for \
near and black for far. It runs the DPT-Hybrid version of MiDaS, which was trained on a mix of datasets so it \
copes with many kinds of scenes. The map is relative: it ranks things as nearer or farther and carries no \
distances in meters.\n\n\
WebUI lists it as depth and depth_midas. The ControlNet 1.0 depth model and the T2I-Adapter MiDaS depth adapter \
for SDXL were trained on MiDaS maps, and the ControlNet 1.1 depth model accepts them."""
how_it_works = """\
MiDaS is a neural network trained on photos and film frames paired with depth data from several sources. Those \
sources measure depth in different units, so the training objective ignores each dataset's scale and offset. \
This is why the output ranks near and far but has no real units. The DPT-Hybrid version reads the whole image \
with a vision transformer and rebuilds a full-size depth map with a convolutional decoder. The preprocessor then \
stretches the result so its nearest point is white and its farthest is black."""
control_types = ["depth"]
effect = "Replaces color and texture with a smooth grayscale map of relative distance."
output = "Grayscale depth map, white near and black far, stretched to the full 0-255 range."
best_input = ""
weak_input = "Fine detail: depth estimators of this kind return maps that lack fine-grained detail."
models = [
    "control_sd15_depth",
    "control_v11f1p_sd15_depth",
    "diffusers_depth_sdxl",
    "diffusers_depth_sdxl_mid",
    "diffusers_depth_sdxl_small",
    "kohya_lllite_depth_anime_sdxl",
    "kohya_lllite_depth_sdxl",
    "sai_control_lora_depth_sdxl",
    "t2i_adapter_depth_midas_sdxl",
    "t2iadapter_depth_sd14v1",
    "t2iadapter_depth_sd15v2",
    "xinsir_depth_sdxl",
]

