[[parameters]]
id = "resolution"
label = "Resolution"
summary = "Size of the image's short side while the preprocessor runs."
names = { webui = "processor_res", forge = "processor_res", comfyui = "resolution" }
type = "int"
default = 512
range = [64, 2048]
effect = """\
The image is scaled so its short side matches this value, padded to a multiple of 64, and processed at that \
size. Larger values keep finer detail and take longer. ComfyUI accepts up to 16384."""
when_to_adjust = """\
Raise it toward the generation's short side for finer depth detail. Lower it for a smoother, simpler map."""

[[parameters]]
id = "a"
label = "Normal Z Scale"
summary = "Only shapes the normal map; the depth map ignores it."
names = { comfyui = "a" }
type = "float"
default = 6.283185307179586
range = [0.0, 15.707963267948966]
effect = """\
The ComfyUI node shares its inputs with MiDaS Normal Map. The depth map is computed before this value is used, \
so it has no effect here."""
when_to_adjust = "Leave it alone for depth."

[[parameters]]
id = "bg_threshold"
label = "Background Threshold"
summary = "Only shapes the normal map; the depth map ignores it."
