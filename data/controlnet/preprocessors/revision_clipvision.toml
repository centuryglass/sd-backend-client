id = "revision_clipvision"
label = "Revision"
summary = "Encodes an image with CLIP ViT-bigG so SDXL reads it as a pooled prompt embedding, alongside the text prompt."
description = """\
Revision encodes the reference image with CLIP and gives SDXL that embedding in place of the prompt's pooled \
summary, while keeping the text prompt's per-word tokens. The result blends the image's concept with the text. It \
needs no control model. sd-webui-controlnet lists it as revision_clipvision; Forge and reForge call it CLIP-G \
(Revision). Forge Neo doesn't have it.\n\n\
sd-webui-controlnet drops the prompt anyway when both the prompt and the negative prompt are empty, which makes \
it act like Revision Ignore Prompt. Its Noise Augmentation slider noises the embedding, loosening how closely the \
result follows the image. reForge hides that slider, since its SDXL model has no noise augmentor."""
how_it_works = """\
CLIP trains an image encoder and a text encoder together so that matching pictures and captions land close \
together. SDXL already conditions on a pooled embedding from its OpenCLIP ViT-bigG text encoder, a single vector \
for the whole prompt. Revision runs the matching bigG image encoder and writes its image embedding into that \
pooled slot, scaled by the unit weight. The negative side gets zeros there."""
control_types = ["revision"]
effect = "Produces an image embedding rather than a picture; nothing visible to preview."
output = "OpenCLIP ViT-bigG/14 image embedding, written into SDXL's pooled conditioning."
best_input = "An image whose overall subject and mood should carry over."
weak_input = "Layout and fine detail, which a single embedding doesn't keep."
models = []

