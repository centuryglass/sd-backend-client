id = "ip_adapter_face_id_plus"
label = "IP-Adapter FaceID Plus"
summary = "Reads a face's identity with InsightFace and its structure with CLIP ViT-H, for the FaceID Plus and Plus V2 models."
description = """\
IP-Adapter FaceID Plus passes two things to the model: an InsightFace identity embedding, as FaceID does, and \
CLIP ViT-H features of the face. h94 describes the first as carrying who the person is and the second as carrying \
the face's structure. It serves FaceID Plus and Plus V2, on SD 1.5 and SDXL.\n\n\
sd-webui-controlnet lists it as ip-adapter_face_id_plus. Forge, reForge and Forge Neo call it InsightFace+CLIP-H \
(IPAdapter), and there it also drives the plain FaceID and Portrait models. The insightface Python package must \
be installed, and the CLIP-ViT-H encoder downloads on first use."""
how_it_works = """\
InsightFace's buffalo_l pack detects the face and gives its ArcFace identity embedding. The image also goes \
through the OpenCLIP ViT-H/14 image encoder, and the patch features from its second-to-last layer are kept. \
sd-webui-controlnet encodes the whole image this way; Forge first crops and aligns the detected face to 224 \
pixels. The Plus models combine both inputs into image prompt tokens."""
control_types = ["ip_adapter"]
effect = "Produces face embeddings rather than a picture; nothing visible to preview."
output = "An InsightFace face embedding plus OpenCLIP ViT-H/14 patch features."
best_input = "A clear, well-lit photo of one face."
weak_input = "Images with no detectable face, which fail."
models = [
    "ip_adapter_faceid_plus_sd15",
    "ip_adapter_faceid_plusv2_sd15",
    "ip_adapter_faceid_plusv2_sdxl",
    "ip_adapter_faceid_sd15",
    "ip_adapter_faceid_sdxl",
    "ip_adapter_faceid_portrait_sd15",
