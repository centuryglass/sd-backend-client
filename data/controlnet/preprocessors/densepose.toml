    "sdwebui_cn_annotators",
    "comfyui_controlnet_aux_src",
    "comfyui_controlnet_aux_readme",
    "sdwebui_cn_densepose_pr",
    "paper_densepose",
    "hf_layernorm_densepose_torchscript",
]
research_status = "verified"
