id = "densepose"
label = "DensePose"
summary = "Paints each person as a map of 24 body parts in the viridis colors, on purple, the form MagicAnimate uses."
description = """\
DensePose paints every person in the image as a flat map of body parts, each part in its own shade from the \
viridis color scale, which runs from purple through blue and green to yellow. The background is the darkest \
purple. Unlike a stick figure it carries the body's outline, so it holds body shape as well as pose.\n\n\
WebUI labels it "densepose (pruple bg & purple torso)", with the typo. The pull request that added it names \
MagicAnimate's DensePose input as the match for these colors. No ControlNet in this reference was trained on \
DensePose maps."""
how_it_works = """\
DensePose is a network that maps every pixel of a person to a point on a surface model of the human body. \
Its authors annotated 50,000 people in COCO photos to train it. The surface is split into 24 parts. The \
preprocessor keeps only which part each pixel belongs to and paints the parts in evenly spaced steps of a \
color map. Backends ship a TorchScript copy of the network, so the Detectron2 library it was built with is not \
needed."""
control_types = ["openpose"]
effect = "Replaces each person with a flat body-part map in viridis colors; the background turns dark purple."
output = "24 body parts in viridis colors on a dark purple background."
best_input = ""
weak_input = ""
models = []

sources = [
    "recorded_fixtures",
    "sdwebui_cn_legacy_preprocessors",
    "sdwebui_cn_preprocessors",
    "forge_preprocessors",
    "reforge_preprocessors",
