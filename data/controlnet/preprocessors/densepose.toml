[[parameters]]
id = "resolution"
label = "Resolution"
summary = "Size of the image's short side while the preprocessor runs."
names = { webui = "processor_res", forge = "processor_res", comfyui = "resolution" }
type = "int"
default = 512
range = [64, 2048]
effect = """\
The image is scaled so its short side matches this value, padded to a multiple of 64, and processed at that \
size. ComfyUI accepts up to 16384."""
when_to_adjust = "Raise it when small or distant people are missed, at the cost of a slower run."

[[parameters]]
id = "model"
label = "Model"
summary = "Which DensePose network runs: ResNet-50 or the larger ResNet-101."
names = { comfyui = "model" }
type = "enum"
default = "densepose_r50_fpn_dl.torchscript"
choices = ["densepose_r50_fpn_dl.torchscript", "densepose_r101_fpn_dl.torchscript"]
effect = "Selects the network's backbone. WebUI and Forge always use the ResNet-50 file."
when_to_adjust = ""

[[parameters]]
id = "cmap"
label = "Color Map"
summary = "Which color scale paints the body parts: viridis on purple, or parula on black."
names = { comfyui = "cmap" }
type = "enum"
default = "Viridis (MagicAnimate)"
choices = ["Viridis (MagicAnimate)", "Parula (CivitAI)"]
effect = "Selects between the DensePose and DensePose Parula outputs. WebUI and Forge list them as two preprocessors."
when_to_adjust = "Match the colors the DensePose model in use was trained on."
