id = "recolor_intensity"
label = "Recolor Intensity"
summary = "Turns the image into a grayscale map of each pixel's brightest channel, which recolor models paint new colors onto."
description = """\
Recolor Intensity removes an image's color and keeps the value of each pixel's strongest channel, the V of HSV. \
Saturated colors stay bright in the map, where Recolor Luminance would darken them. A recolor model then \
colorizes the map to the prompt. Gamma Correction brightens or darkens it first.\n\n\
In Forge and reForge the preprocessor named recolor_intensity runs the luminance conversion instead: its code \
ignores the switch between the two. reForge's recolor_intensity_variant computes intensity. Both Forge versions \
also shift each result's brightness, pixel by pixel, to match the map after generation."""
how_it_works = """\
No network is involved. The image is converted to HSV, hue, saturation and value, and only the value is kept: \
for each pixel, the largest of its red, green and blue. That is raised to the power of the gamma value and \
copied into all three channels. sd-webui-controlnet ignores the resolution setting here; ComfyUI resizes to it \
first."""
control_types = ["recolor"]
effect = "Removes all color, keeping each pixel's brightest channel as gray; gamma below 1 brightens it, above 1 darkens it."
output = "Grayscale image of the source's HSV value."
best_input = "Color images with saturated areas that should stay bright in the map."
weak_input = ""
models = ["sai_control_lora_recolor_sdxl", "latentcat_brightness_sd15"]

sources = [
    "recorded_fixtures",
    "sdwebui_cn_legacy_preprocessors",
    "forge_preprocessors",
    "reforge_preprocessors",
    "comfyui_controlnet_aux_nodes",
    "comfyui_controlnet_aux_src",
    "comfyui_controlnet_aux_readme",
]
research_status = "verified"
open_questions = []

[names]
webui = ["recolor_intensity"]
forge = ["recolor_intensity", "recolor_intensity_variant"]
comfyui = ["ImageIntensityDetector"]

[hardware]
device = "none"
speed = "fast: a color conversion with no network"

[[parameters]]
id = "gamma_correction"
label = "Gamma Correction"
summary = "Brightens the map below 1 and darkens it above 1."
names = { webui = "threshold_a", forge = "threshold_a", comfyui = "gamma_correction" }
type = "float"
default = 1.0
range = [0.1, 2.0]
effect = "Each value, from 0 to 1, is raised to this power: midtones move most, black and white stay."
when_to_adjust = "Lower it to lift dark images before recoloring. Raise it to deepen washed-out ones."

[[parameters]]
id = "resolution"
label = "Resolution"
summary = "Size of the image's short side while ComfyUI converts it."
names = { comfyui = "resolution" }
type = "int"
default = 512
range = [64, 16384]
effect = "ComfyUI resizes the image to this short side and pads it to a multiple of 64. The WebUI backends don't resize."
when_to_adjust = "Match it to the generation's short side."
