id = "lineart_realistic"
label = "Lineart Realistic"
summary = "Redraws a photo as clean, detailed line art with a small neural network."
description = """\
Lineart Realistic turns a photo or render into a detailed line drawing: contours, folds, facial features and \
some texture, drawn as lines of varying weight. It is the "detailed" extractor the ControlNet 1.1 lineart model \
was demonstrated with.\n\n\
WebUI calls it "lineart" in older versions and "lineart_realistic" in newer ones. In ComfyUI it is the Realistic \
Lineart node with coarse disabled."""
how_it_works = """\
A small image-to-image generator network redraws the input as a line drawing. WebUI inverts its black-on-white \
output into white lines on black. The coarse variant runs the same network architecture with a second set of \
weights."""
control_types = ["lineart"]
effect = "Keeps contours and main interior lines with varying weight; drops color, shading and most texture."
output = "Black image with white lines of varying weight."
best_input = "Photos and realistic renders."
weak_input = ""
models = [
    "control_v11p_sd15_lineart",
    "t2i_adapter_lineart_sdxl",
    "xinsir_scribble_sdxl",
    "xinsir_union_sdxl",
    "xinsir_union_promax_sdxl",
]

sources = [
    "cn11_readme",
    "sdwebui_cn_preprocessors",
    "sdwebui_cn_annotators",
    "comfyui_controlnet_aux_readme",
    "hf_tencentarc_t2i_adapter_lineart_sdxl_1_0",
    "recorded_fixtures",
    "sdwebui_cn_legacy_preprocessors",
    "forge_preprocessors",
    "comfyui_controlnet_aux_nodes",
]
research_status = "drafted"
open_questions = [
    "Find where sk_model.pth and sk_model2.pth come from and what they were trained on. The LICENSE bundled with the annotator credits Caroline Chan (2022), author of Informative Drawings.",
]

[names]
webui = ["lineart", "lineart_realistic"]
forge = ["lineart_realistic"]
comfyui = ["LineArtPreprocessor"]

[hardware]
device = "gpu_preferred"

[[hardware.files]]
filename = "sk_model.pth"
