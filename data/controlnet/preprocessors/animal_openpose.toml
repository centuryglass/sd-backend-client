id = "animal_openpose"
label = "Animal Pose"
summary = "Finds the pose of four-legged animals and draws it as a colored skeleton for the animal pose ControlNet."
description = """\
Animal Pose finds four-legged animals and draws each one's skeleton on black: 17 points covering the eyes, \
nose, neck, tail root and each leg, joined by colored lines. The layout and colors differ from OpenPose's human \
skeleton, so it pairs with its own SD 1.5 model, the animal pose ControlNet, not with the human pose models.\n\n\
The skeleton has no ears and no tail beyond its root, so those come from the prompt. The ControlNet_AnimalPose \
README says the estimator works best with a single animal in the image and has trouble with close-ups."""
how_it_works = """\
It works top-down in two steps. A YOLOX detector draws a box around each animal, and an RTMPose-m network \
places 17 keypoints inside each box. That network was trained on AP-10K, a set of 10,015 photos of animals from \
23 families and 54 species, labeled with the same 17 keypoints. The preprocessor joins the points into limbs, \
each drawn in a fixed color."""
control_types = ["openpose"]
effect = "Replaces the image with a colored skeleton of each detected animal on black."
output = "Colored line skeletons on black, 17 AP-10K points per animal, no joint dots."
best_input = "Images with a single animal in them."
weak_input = "Close-up images, per the ControlNet_AnimalPose README."
models = ["animal_openpose_sd15"]

sources = [
    "recorded_fixtures",
    "sdwebui_cn_legacy_preprocessors",
    "sdwebui_cn_preprocessors",
    "forge_preprocessors",
    "reforge_preprocessors",
    "comfyui_controlnet_aux_nodes",
    "sdwebui_cn_annotators",
    "comfyui_controlnet_aux_src",
    "comfyui_controlnet_aux_readme",
    "sdwebui_cn_animal_openpose_discussion",
    "gh_controlnet_animalpose_readme",
    "paper_ap10k",
    "hf_bdsqlsz_qinglong_lllite",
    "hf_yzd_v_dwpose",
    "hf_hr16_dwpose_torchscript_bs5",
    "hf_hr16_yolox_onnx",
    "hf_hr16_unjit_dwpose",
]
research_status = "verified"
open_questions = []

[names]
webui = ["animal_openpose"]
forge = ["animal_openpose"]
comfyui = ["AnimalPosePreprocessor"]

[hardware]
device = "gpu_preferred"
speed = """\
WebUI and Forge always run it on the CPU through OpenCV. ComfyUI runs TorchScript files on the GPU, and ONNX \
files on the GPU only when onnxruntime has a GPU provider; otherwise it falls back to the CPU, which its README \
calls slow."""

