[[parameters]]
id = "resolution"
label = "Resolution"
summary = "Size of the image's short side while the preprocessor runs."
names = { webui = "processor_res", forge = "processor_res", comfyui = "resolution" }
type = "int"
default = 512
range = [64, 2048]
effect = """\
The image is scaled so its short side matches this value, padded to a multiple of 64, and searched for animals \
at that size. The skeleton is drawn at that size too, so its lines get thinner relative to the image as the \
value rises. ComfyUI accepts up to 16384."""
when_to_adjust = """\
Raise it when small or distant animals are missed, at the cost of a slower run. Lower it for thicker lines \
relative to the image."""

[[parameters]]
id = "bbox_detector"
label = "Animal Detector"
summary = "Which network finds each animal before the pose network places its points."
names = { comfyui = "bbox_detector" }
type = "enum"
default = "yolox_l.torchscript.pt"
choices = [
    "yolox_l.torchscript.pt",
    "yolox_l.onnx",
    "yolo_nas_l_fp16.onnx",
    "yolo_nas_m_fp16.onnx",
    "yolo_nas_s_fp16.onnx",
]
effect = """\
The TorchScript file runs on the GPU without extra libraries. The ONNX files need onnxruntime with a GPU \
provider to leave the CPU."""
when_to_adjust = "Keep the TorchScript default unless onnxruntime with a GPU provider is installed."

[[parameters]]
id = "pose_estimator"
label = "Pose Estimator"
summary = "Which file of the AP-10K RTMPose network to run: TorchScript or ONNX."
names = { comfyui = "pose_estimator" }
type = "enum"
default = "rtmpose-m_ap10k_256_bs5.torchscript.pt"
choices = ["rtmpose-m_ap10k_256_bs5.torchscript.pt", "rtmpose-m_ap10k_256.onnx"]
effect = """\
Both are forms of the RTMPose-m AP-10K network. The README says TorchScript is a little slower than ONNX Runtime but \
needs no extra library."""
when_to_adjust = "Choose ONNX only when onnxruntime with a GPU provider is installed."
