id = "revision_ignore_prompt"
label = "Revision Ignore Prompt"
summary = "Like Revision, but drops the text prompt entirely, so SDXL generates from the image's CLIP embedding alone."
description = """\
Revision Ignore Prompt works like Revision and also discards the text prompt, so the image alone drives the \
generation. It suits making variations of an image. It needs no control model. sd-webui-controlnet lists it as \
revision_ignore_prompt; Forge and reForge call it CLIP-G (Revision ignore prompt). Forge Neo doesn't have it.\n\n\
The prompt is dropped for every unit, not only this one: one ignore-prompt unit is enough to silence the text for \
all Revision units. The Noise Augmentation slider works as it does for Revision."""
how_it_works = """\
It writes the OpenCLIP ViT-bigG image embedding into SDXL's pooled conditioning, as Revision does, and also \
replaces the prompt's per-word token embeddings with zeros, for both the positive and the negative side. With \
nothing left in the text, the image embedding is all the model has to go on."""
control_types = ["revision"]
effect = "Produces an image embedding rather than a picture; nothing visible to preview."
output = "OpenCLIP ViT-bigG/14 image embedding, written into SDXL's pooled conditioning, with the text tokens zeroed."
best_input = "An image whose overall subject and mood should carry over."
weak_input = "Layout and fine detail, which a single embedding doesn't keep."
models = []

sources = [
    "recorded_fixtures",
    "sdwebui_cn_legacy_preprocessors",
    "sdwebui_cn_legacy_processor",
    "sdwebui_cn_preprocessors",
    "sdwebui_cn_hook",
    "sdwebui_cn_1_1_400_discussion",
    "forge_preprocessors",
    "forge_revision",
    "reforge_preprocessors",
    "forge_neo_preprocessors",
    "hf_stabilityai_control_lora",
    "hf_lllyasviel_annotators",
    "paper_clip",
    "paper_sdxl",
]
research_status = "verified"
open_questions = []

