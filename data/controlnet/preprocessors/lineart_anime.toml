id = "lineart_anime"
label = "Lineart Anime"
summary = "Redraws an anime-style illustration as clean line art for the anime lineart model."
description = """\
Lineart Anime extracts line art from anime and manga-style illustrations. It pairs with the ControlNet 1.1 anime \
lineart model, which takes either real anime line drawings or extracted ones. That model was trained with clip \
skip 2 and three times the usual prompt length, and works best with long prompts."""
how_it_works = """\
A U-Net generator network, a type that shrinks the image to read its overall structure and then enlarges it \
again while copying back fine detail, redraws the input as line art. The input is scaled to a multiple of 256 \
pixels first. WebUI inverts the black-on-white output into white lines on black."""
control_types = ["lineart"]
effect = "Keeps character outlines and main interior lines; drops color and shading."
output = "Black image with white lines."
best_input = "Anime, manga and cel-shaded illustrations."
weak_input = ""
models = [
    "control_v11p_sd15s2_lineart_anime",
    "xinsir_union_sdxl",
    "xinsir_union_promax_sdxl",
]

sources = [
    "cn11_readme",
    "sdwebui_cn_preprocessors",
    "sdwebui_cn_annotators",
    "comfyui_controlnet_aux_readme",
    "recorded_fixtures",
    "sdwebui_cn_legacy_preprocessors",
    "forge_preprocessors",
    "comfyui_controlnet_aux_nodes",
]
research_status = "drafted"
open_questions = [
    "Find where netG.pth comes from and what it was trained on. The LICENSE bundled with it is a copy of the lineart annotator's.",
]

[names]
webui = ["lineart_anime"]
forge = ["lineart_anime"]
comfyui = ["AnimeLineArtPreprocessor"]

[hardware]
device = "gpu_preferred"

[[hardware.files]]
filename = "netG.pth"
size_bytes = 217631959
sha256 = "ccabdcc3f5cf3c07cf65d58776acb21df7dfda825cdc70c9766a93fd62bfc488"
source_url = "https://huggingface.co/lllyasviel/Annotators/resolve/982e7edaec38759d914a963c48c4726685de7d96/netG.pth"

[[parameters]]
id = "resolution"
label = "Resolution"
summary = "Size of the image's short side while the preprocessor runs."
names = { webui = "processor_res", forge = "processor_res", comfyui = "resolution" }
type = "int"
default = 512
range = [64, 2048]
effect = """\
The image is scaled so its short side matches this value, padded to a multiple of 64, and processed at that \
size. Larger values keep finer detail and take longer. ComfyUI accepts up to 16384."""
when_to_adjust = "Raise it toward the generation's short side for finer lines. Lower it for bolder, simpler maps."
